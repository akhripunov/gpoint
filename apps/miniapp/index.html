<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>GPoint</title>
    <style>
      html, body { min-width: 320px; min-height: 100%; margin: 0; background: #090d16; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .gpoint-boot-splash {
        min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 24px;
        background: #090d16; color: #f5f1ed;
        font: 500 15px/1.4 system-ui, sans-serif;
      }
      .gpoint-boot-indicator {
        width: 22px; height: 22px; border: 2px solid #273247;
        border-top-color: #e3b2a6; border-radius: 50%;
        animation: gpoint-boot-spin .8s linear infinite;
      }
      @keyframes gpoint-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .gpoint-boot-indicator { animation-duration: 2s; } }
    </style>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"><main class="gpoint-boot-splash" role="status" aria-live="polite"><span class="gpoint-boot-indicator" aria-hidden="true"></span><span>Открываем GPoint…</span></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
