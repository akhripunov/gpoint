# Stock Eros uses the existing GPoint API and Worker; embeddings use the
# internal GPoint API proxy to the Mac-hosted Ollama tunnel.
[defaults]
fallback_model = "gpoint-codex@gpoint"
fallback_temperature = 1.0

[tasks.chat_companion]
model = "gpoint-codex@gpoint"
retry_depth = 0

[providers.gpoint]
chat = "http://api:3000/eros-worker/v1/chat/completions"
embeddings = "http://api:3000/eros-worker/v1/embeddings"

[tasks.embedding]
model = "qwen3-embedding:0.6b@gpoint"

[tasks.memory_extraction]
model = "gpoint-codex@gpoint"
max_tokens = 512
filter_prompt = "Extract only explicit, durable facts the user intentionally shares for future conversations. Do not infer facts or retain secrets, credentials, health, financial, or other sensitive data."
