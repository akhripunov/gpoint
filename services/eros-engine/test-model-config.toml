# Local synthetic acceptance only. No hosted providers are configured.
# Memory extraction uses a deterministic synthetic response from the isolated
# test Worker. No real model or hosted provider is contacted.
[defaults]
fallback_model = "gpoint-codex@gpoint"
fallback_temperature = 1.0

[tasks.chat_companion]
model = "gpoint-codex@gpoint"
retry_depth = 0

[providers.gpoint]
chat = "http://gpoint-api:3000/eros-worker/v1/chat/completions"
embeddings = "http://gpoint-api:3000/eros-worker/v1/embeddings"

[tasks.embedding]
model = "qwen3-embedding:0.6b@gpoint"

[tasks.memory_extraction]
model = "gpoint-codex@gpoint"
filter_prompt = "SYNTHETIC_MEMORY_EXTRACTION_RESULT. Extract the marked synthetic test facts only; return JSON with a memories array."
max_tokens = 512
