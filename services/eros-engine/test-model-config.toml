# Local synthetic acceptance only. No hosted providers are configured.
# Dreaming scan uses a deterministic synthetic response from the isolated
# test Worker. No real model or hosted provider is contacted.
[defaults]
fallback_model = "gpoint-codex@gpoint"
fallback_temperature = 1.0

[tasks.chat_companion]
model = "gpoint-codex@gpoint"
retry_depth = 0

[providers.gpoint]
chat = "http://gpoint-api:3000/eros-worker/v1/chat/completions"
embeddings = "http://gpoint-api:3000/eros-worker/v1/embeddings"

[tasks.embedding]
model = "qwen3-embedding:0.6b@gpoint"

[tasks.dreaming_scan]
model = "gpoint-codex@gpoint"
temperature = 1.0
max_tokens = 1024
filter_prompt = """
SYNTHETIC_DREAMING_SCAN_RESULT. Return one JSON object with memories, episode, and journal keys. This local deterministic fixture recognizes only its marked synthetic test inputs; no real dialogue is used. Return marked synthetic memory rows and empty episode and journal values when no other fixture input is provided.
"""

[tasks.arc_rewrite]
model = "gpoint-codex@gpoint"
temperature = 1.0
max_tokens = 1500
