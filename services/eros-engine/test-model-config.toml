# Local synthetic acceptance only. No hosted providers are configured.
[defaults]
fallback_model = "gpoint-codex@gpoint"

[tasks.chat_companion]
model = "gpoint-codex@gpoint"
retry_depth = 0

[providers.gpoint]
chat = "http://host.docker.internal:3000/eros-worker/v1/chat/completions"
embeddings = "http://host.docker.internal:3000/eros-worker/v1/embeddings"

[tasks.embedding]
model = "qwen3-embedding:0.6b@gpoint"
