# Local synthetic acceptance only. No hosted providers are configured.
# Dreaming scan uses a deterministic synthetic response from the isolated
# test Worker. No real model or hosted provider is contacted.
[defaults]
fallback_model = "gpoint-codex@gpoint"
fallback_temperature = 1.0

[tasks.chat_companion]
model = "gpoint-codex@gpoint"
retry_depth = 0

[providers.gpoint]
chat = "http://gpoint-api:3000/eros-worker/v1/chat/completions"
embeddings = "http://gpoint-api:3000/eros-worker/v1/embeddings"

[tasks.embedding]
model = "qwen3-embedding:0.6b@gpoint"

[tasks.dreaming_scan]
model = "gpoint-codex@gpoint"
temperature = 1.0
max_tokens = 1024
filter_prompt = """
SYNTHETIC_DREAMING_SCAN_RESULT. Return only one JSON object with memories, episode, and journal. Use only the marked synthetic facts; no real user data.
Privacy rules: memories may contain only explicit, durable, non-sensitive facts the real user intentionally shared. Never infer. Never retain secrets, credentials, health, financial, identifying, or other sensitive data. Exclude assistant inventions and roleplay from real-world facts. Apply the same privacy rule to episode and journal; omit private details.
Return the test markers as memories and empty episode and journal arrays when no other data is provided. Return all three keys.
"""

[tasks.arc_rewrite]
model = "gpoint-codex@gpoint"
temperature = 1.0
max_tokens = 1500
