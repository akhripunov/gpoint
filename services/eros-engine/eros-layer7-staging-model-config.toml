# Layer7 staging only. Chat inference is served by the DeepSeek API instead of
# the subscription Mac Worker; embeddings keep the existing private relay.
# Production keeps eros-production-model-config.toml unchanged.
#
# GPoint sends its signed Worker identity as `audit.user`; stock Eros forwards
# that value to the provider as the wire `user` field. The body rule below
# replaces it with a neutral constant so no g1.* token or GPoint identifier
# ever reaches an external provider.
[defaults]
fallback_model = "deepseek-chat@deepseek"
fallback_temperature = 1.0

[tasks.chat_companion]
model = "deepseek-chat@deepseek"
retry_depth = 0

[providers.deepseek]
chat = "https://api.deepseek.com/v1/chat/completions"

[[providers.deepseek.body]]
params = { user = "gpoint-staging" }

[providers.gpoint_embeddings]
embeddings = "http://gpoint-core-api:3000/eros-worker/v1/embeddings"

[tasks.embedding]
model = "qwen3-embedding:0.6b@gpoint_embeddings"

[tasks.memory_extraction]
model = "deepseek-chat@deepseek"
max_tokens = 512
filter_prompt = "Extract only explicit, durable facts the user intentionally shares for future conversations. Do not infer facts or retain secrets, credentials, health, financial, or other sensitive data."
