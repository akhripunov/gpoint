[build-system]
requires = ["setuptools>=70,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "gpoint-agata-core"
version = "1.0.0"
description = "Channel-neutral AGATA dialogue and memory core for GPoint"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "cryptography==50.0.2",
  "fastapi==0.147.0", "starlette==1.9.0",
  "greenlet==3.2.4",
  "httpx==0.28.1",
  "pgvector==0.4.1",
  "psycopg[binary]==3.2.10",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aiosqlite==0.21.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP042"]
