name: GPoint CI

on:
  pull_request:
    branches: [main, dev]
  workflow_call:
    inputs:
      candidate_sha:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: GPoint required tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: gpoint
          POSTGRES_USER: gpoint
          POSTGRES_PASSWORD: gpoint_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gpoint -d gpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint
      SHADOW_DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint_shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tested SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Run pinned actionlint on release workflows
        run: |
          set -euo pipefail
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" \
            | sha256sum --check --status
          install -d "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" \
            .github/workflows/gpoint-ci.yml \
            .github/workflows/gpoint-core-deploy.yml \
            .github/workflows/gpoint-miniapp-deploy.yml \
            .github/workflows/gpoint-eros-deploy.yml \
            .github/workflows/gpoint-eros-relay-deploy.yml \
            .github/workflows/gpoint-layer7-staging.yml
      - name: Validate Kamal configs with the pinned CLI image
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: bash scripts/check-kamal-configs.sh
      - name: Generate Prisma client and validate test migrations
        run: |
          set -euo pipefail
          pnpm --filter @gpoint/db exec prisma generate
          pnpm --filter @gpoint/db exec prisma migrate deploy
          createdb --maintenance-db="$DATABASE_URL" --owner=gpoint gpoint_shadow
          pnpm --filter @gpoint/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
          pnpm --filter @gpoint/db exec prisma migrate deploy
          pnpm --filter @gpoint/db exec prisma migrate status
      - name: Build and test workspace
        run: |
          set -euo pipefail
          pnpm -r build
          pnpm -r typecheck
          pnpm -r test
          NODE_ENV=development API_HOST=127.0.0.1 API_PORT=3000 pnpm --filter @gpoint/api start \
            > "$RUNNER_TEMP/gpoint-api.log" 2>&1 &
          api_pid=$!
          cleanup_api() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup_api EXIT
          ready=false
          for attempt in {1..30}; do
            if [[ "$attempt" == 1 ]]; then
              echo "Waiting for the API health endpoint"
            fi
            if curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/gpoint-api.log"
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/gpoint-api.log"
            exit 1
          fi
          pnpm test:integration
          pnpm test:release
      - name: Test migrations, backups, and release contracts
        run: |
          set -euo pipefail
          unset DATABASE_URL SHADOW_DATABASE_URL
          python -m pip install './services/agata[test]' './services/gsales[test]' pyyaml
          python -m pytest -q \
            tests/test_layer7_staging_workflow.py tests/test_layer7_release_scope.py \
            tests/test_layer7_staging_env.py tests/test_layer7_mac_free_ssh.py \
            tests/test_native_build_boundary.py tests/test_native_build_scope.py \
            tests/test_prepush_runner.py tests/test_release_scope_consistency.py \
            tests/test_release_routing_matrix.py tests/test_backup_install_script.py \
            tests/test_backup_restore_readiness.py tests/test_gpoint_scheduled_backup.py \
            tests/test_native_release_intent.py tests/test_kamal_migration_parity_dependencies.py \
            tests/test_native_prepared_run.py tests/test_release_pre_push_mode.py \
            tests/test_native_environment_deployment.py tests/test_native_prisma_apply_boundary.py \
            tests/test_prisma_migration_release_plan.py tests/test_eros_pilot_no_agata_transfer.py \
            tests/test_agata_production_migration.py tests/test_agata_migration_receipt.py \
            tests/test_kamal_native_automatic_release.py tests/test_eros_native_database_workflow.py \
            tests/test_layer7_ollama_verifier.py tests/test_verify_kamal_production_baseline.py \
            tests/test_native_rollback_evidence.py tests/test_kamal_release_config.py \
            tests/test_kamal_production_manifest.py tests/test_kamal_ordinary_manifest.py \
            tests/test_component_release_workflows.py
