name: GPoint First Kamal Cutover

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      app_source_sha:
        description: Exact production application source SHA whose migrations must match the live database
        required: true
        type: string
      mode:
        description: Select a read-only preflight or the guarded first cutover
        required: true
        type: choice
        options:
          - preflight
          - cutover
      approve_production:
        description: I authorize this exact candidate SHA on GPoint production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gpoint-first-kamal-cutover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workspace:
    name: Workspace, Prisma and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: gpoint
          POSTGRES_USER: gpoint
          POSTGRES_PASSWORD: gpoint_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpoint -d gpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.3'
      - name: Validate GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/gpoint-first-kamal-cutover.yml
      - name: Validate pinned Kamal configs and shared proxy routing
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          docker run --rm --volume "$GITHUB_WORKSPACE:/workdir" --workdir /workdir \
            --env GPOINT_COMMIT_SHA="$GITHUB_SHA" \
            --env GPOINT_APP_SOURCE_SHA="$GITHUB_SHA" \
            --env GPOINT_SSH_KEY=/tmp/not-used-by-config-check \
            --env GPOINT_KNOWN_HOSTS_FILE=/dev/null \
            --env GPOINT_PRODUCTION_HOST=192.0.2.10 \
            --env KAMAL_REGISTRY_PASSWORD=config-validation-placeholder \
            "$KAMAL_IMAGE" config --config-file config/deploy.yml >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workdir" --workdir /workdir \
            --env GPOINT_COMMIT_SHA="$GITHUB_SHA" \
            --env GPOINT_APP_SOURCE_SHA="$GITHUB_SHA" \
            --env GPOINT_SSH_KEY=/tmp/not-used-by-config-check \
            --env GPOINT_KNOWN_HOSTS_FILE=/dev/null \
            --env GPOINT_PRODUCTION_HOST=192.0.2.10 \
            --env KAMAL_REGISTRY_PASSWORD=config-validation-placeholder \
            "$KAMAL_IMAGE" config --config-file config/deploy.agata.yml >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workdir" --workdir /workdir \
            --env GPOINT_COMMIT_SHA="$GITHUB_SHA" \
            --env GPOINT_APP_SOURCE_SHA="$GITHUB_SHA" \
            --env GPOINT_SSH_KEY=/tmp/not-used-by-config-check \
            --env GPOINT_KNOWN_HOSTS_FILE=/dev/null \
            --env GPOINT_PRODUCTION_HOST=192.0.2.10 \
            --env KAMAL_REGISTRY_PASSWORD=config-validation-placeholder \
            "$KAMAL_IMAGE" config --config-file config/deploy.miniapp.yml >/dev/null
          ./scripts/test-kamal-proxy-integration.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Verify pinned pnpm
        run: test "$(pnpm --version)" = "9.15.0"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and apply test migrations
        run: |
          pnpm --filter @gpoint/db exec prisma generate
          pnpm --filter @gpoint/db exec prisma migrate deploy
      - name: Build and typecheck workspace
        run: |
          pnpm -r build
          pnpm -r typecheck
      - name: Run workspace tests
        run: pnpm -r --if-present test
      - name: Run canonical release and static-parent tests
        run: |
          pnpm test:release
          node --test scripts/release-component-bundle-v4.test.mjs scripts/release-static-v4.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Mini App end-to-end tests
        run: pnpm test:e2e

  python:
    name: Python, PostgreSQL 16 and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Install Python test dependencies
        run: python -m pip install './services/agata[test]' './services/gsales[test]' pyyaml
      - name: Test Native image read-back validation
        run: |
          python tests/test_native_image_readback.py
          python tests/test_native_image_attestation.py
      - name: Install pinned ORAS for release evidence round-trip test
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oras_1.3.0_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/oras-1.3.0"
          curl --fail --silent --show-error --location \
            https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64' "$archive" \
            | sha256sum --check --status
          install -d "$install_dir"
          tar -xzf "$archive" -C "$install_dir" oras
          chmod 0755 "$install_dir/oras"
          "$install_dir/oras" version | grep -Eq 'Version:[[:space:]]+1\.3\.0([[:space:]]|$)'
          echo "ORAS_1_3_BIN=$install_dir/oras" >> "$GITHUB_ENV"
      - name: Run workflow, Native First and Kamal boundary tests
        run: >-
          python -m pytest -q
          tests/test_deploy_evidence_workflow.py
          tests/test_native_build_boundary.py
          tests/test_kamal_release_config.py
          tests/test_kamal_pause_recovery_policy.py
          tests/test_kamal_cutover_owner.py
          tests/test_kamal_cutover_credentials.py
          tests/test_kamal_cutover_package.py
          tests/test_start_kamal_cutover_owner.py
          tests/test_kamal_production_manifest.py
          tests/test_recover_kamal_cutover.py
          tests/test_release_assets.py
          tests/test_gpoint_release_trigger_graph.py
      - name: Run isolated PostgreSQL 16 migration and integration suites
        run: python services/gsales/tests/run_postgres.py

  build:
    name: Build and publish immutable images
    needs: [workspace, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      agata_digest: ${{ steps.agata.outputs.digest }}
      miniapp_digest: ${{ steps.miniapp.outputs.digest }}
      proxy_digest: ${{ steps.proxy.outputs.digest }}
      nginx_base_digest: ${{ steps.nginx.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.app_source_sha }}
          path: app-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          platforms: linux/amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pinned Kamal Proxy image digest
        id: proxy
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect basecamp/kamal-proxy:v0.9.2 --format '{{json .Manifest}}')"
          digest="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["digest"])' "$manifest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          resolved="$(docker buildx imagetools inspect "basecamp/kamal-proxy@$digest" --format '{{json .Manifest}}')"
          test "$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["digest"])' "$resolved")" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Resolve pinned Nginx linux/amd64 base digest
        id: nginx
        run: |
          set -euo pipefail
          index="$(docker buildx imagetools inspect --raw docker.io/library/nginx:1.27-alpine)"
          digest="$(python3 -c 'import json,sys; rows=[m["digest"] for m in json.loads(sys.argv[1]).get("manifests",[]) if m.get("platform",{}).get("os")=="linux" and m.get("platform",{}).get("architecture")=="amd64"]; assert len(rows)==1; print(rows[0])' "$index")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          resolved="$(docker buildx imagetools inspect "docker.io/library/nginx@$digest" --format '{{json .Manifest}}')"
          test "$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["digest"])' "$resolved")" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify exact application source checkout and create its dependency manifests
        env:
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
        run: |
          set -euo pipefail
          [[ "$APP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C app-source rev-parse HEAD)" = "$APP_SOURCE_SHA"
          python3 app-source/scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - name: Build and publish immutable runtime image
        id: app
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ inputs.app_source_sha }}
          file: infra/production/Gpoint.Dockerfile
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ inputs.app_source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.app_source_sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable Mini App image
        id: miniapp
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Miniapp.Dockerfile
          target: miniapp-runtime
          build-contexts: |
            dependency-manifests=${{ runner.temp }}/dependency-manifests
            app-source=https://github.com/akhripunov/gpoint.git#${{ inputs.app_source_sha }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            GPOINT_BUILD_SHA=${{ inputs.app_source_sha }}
            GPOINT_WORKFLOW_SHA=${{ github.sha }}
            GPOINT_BUILD_TIME=2026-10-23T02:10:09.328Z
            NGINX_BASE_DIGEST=${{ steps.nginx.outputs.digest }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.app_source_sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            org.gpoint.workflow.revision=${{ github.sha }}
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-miniapp,mode=max
          sbom: true
          provenance: mode=max,version=v1
      - name: Build and publish immutable AGATA image
        id: agata
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ inputs.app_source_sha }}:services/agata
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ inputs.app_source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.app_source_sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-agata-runtime
          cache-to: type=gha,scope=gpoint-agata-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Validate immutable image identity and expose digests
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['CANDIDATE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate SHA is not exact')
          app_source_sha = os.environ['APP_SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', app_source_sha):
              raise SystemExit('application source SHA is not exact')
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'MINIAPP_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable OCI digest')
          PY
      - name: Read back exact published images and verify candidate identity
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          IMAGE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
        run: |
          set -euo pipefail
          for role in app agata miniapp; do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) image=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
              miniapp) image=ghcr.io/akhripunov/gpoint-miniapp; digest="$MINIAPP_DIGEST" ;;
            esac
            source_sha="$APP_SOURCE_SHA"
            docker pull --platform linux/amd64 "$image@$digest"
            docker pull --platform linux/amd64 "$image:$IMAGE_VERSION"
            docker image inspect "$image:$IMAGE_VERSION" --format '{{json .RepoDigests}}' | grep -Fq "$image@$digest"
            docker image inspect --format '{{json .}}' "$image@$digest" > "$RUNNER_TEMP/$role-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-provenance.json"
            python3 scripts/verify_native_image_readback.py \
              "$RUNNER_TEMP/$role-image.json" "$image" "$digest" "$source_sha"
            if [[ "$role" == miniapp ]]; then
              python3 scripts/verify_native_image_attestation.py \
                "$RUNNER_TEMP/$role-sbom.json" "$RUNNER_TEMP/$role-provenance.json" \
                "$CANDIDATE_SHA" https://github.com/akhripunov/gpoint.git \
                --required-material-sha "$APP_SOURCE_SHA" \
                --required-build-arg "NGINX_BASE_DIGEST=${{ steps.nginx.outputs.digest }}"
            else
              python3 scripts/verify_native_image_attestation.py \
                "$RUNNER_TEMP/$role-sbom.json" "$RUNNER_TEMP/$role-provenance.json" \
                "$source_sha" https://github.com/akhripunov/gpoint.git
            fi
          done
      - name: Exercise isolated Kamal cutover and exact late-failure recovery
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
          PROXY_DIGEST: ${{ steps.proxy.outputs.digest }}
        run: |
          set -euo pipefail
          python3 tests/integration/kamal-cutover-recovery-docker.py \
            --app-digest "$APP_DIGEST" \
            --agata-digest "$AGATA_DIGEST" \
            --miniapp-digest "$MINIAPP_DIGEST" \
            --proxy-digest "$PROXY_DIGEST"

  deploy:
    name: Kamal production Deploy and Verify
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
      IMAGE_VERSION: ${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      GPOINT_COMMIT_SHA: ${{ inputs.candidate_sha }}
      GPOINT_APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GPOINT_SSH_KEY: /root/.ssh/id_ed25519
      GPOINT_KNOWN_HOSTS_FILE: /root/.ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.app_source_sha }}
          path: app-source
          persist-credentials: false
      - name: Reject a candidate that differs from the requested exact SHA
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
        run: |
          test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
          printf '%s\n' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$APP_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git -C app-source rev-parse HEAD)" = "$APP_SOURCE_SHA"
      - name: Recheck owner authorization and current main for production mode
        if: inputs.mode == 'cutover'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          OWNER_APPROVAL_ACTOR: ${{ github.actor }}
          OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER_REPOSITORY: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$APPROVE_PRODUCTION" = true
          test "$OWNER_APPROVAL_ACTOR" = "$OWNER_REPOSITORY"
          test "$OWNER_TRIGGERING_ACTOR" = "$OWNER_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
      - name: Verify immutable image outputs for the requested candidate
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
          PROXY_DIGEST: ${{ needs.build.outputs.proxy_digest }}
        run: |
          python3 - <<'PY'
          import os, re
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'MINIAPP_DIGEST', 'PROXY_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable digest')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              for name in ('APP_DIGEST', 'AGATA_DIGEST', 'MINIAPP_DIGEST'):
                  summary.write(f"- {name}: `{os.environ[name]}`\n")
          PY
      - name: State that production Apply is not authorized in preflight mode
        if: inputs.mode == 'preflight'
        run: |
          test "${{ inputs.mode }}" = preflight
          echo 'PRODUCTION_APPLY=NOT_AUTHORIZED' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify GHCR candidate tags resolve to the exact digests
        if: inputs.mode == 'cutover'
        id: imageverify
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          candidate_image_bytes=0
          for item in \
            "ghcr.io/akhripunov/gpoint-runtime|$APP_DIGEST" \
            "ghcr.io/akhripunov/gpoint-agata-runtime|$AGATA_DIGEST" \
            "ghcr.io/akhripunov/gpoint-miniapp|$MINIAPP_DIGEST"; do
            IFS='|' read -r repository digest <<< "$item"
            docker pull --platform linux/amd64 "$repository@$digest"
            docker pull --platform linux/amd64 "$repository:$IMAGE_VERSION"
            actual="$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .RepoDigests 0}}')"
            test "$actual" = "$repository@$digest"
            source_sha="$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$source_sha" = "$APP_SOURCE_SHA"
            image_bytes="$(docker image inspect "$repository@$digest" --format '{{.Size}}')"
            [[ "$image_bytes" =~ ^[0-9]+$ && "$image_bytes" -gt 0 ]]
            candidate_image_bytes=$((candidate_image_bytes + image_bytes))
          done
          # The first-cutover owner runs the same pinned CLI image on the VPS.
          tool_image=ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
          docker pull --platform linux/amd64 "$tool_image"
          tool_bytes="$(docker image inspect "$tool_image" --format '{{.Size}}')"
          [[ "$tool_bytes" =~ ^[0-9]+$ && "$tool_bytes" -gt 0 ]]
          candidate_image_bytes=$((candidate_image_bytes + tool_bytes))
          echo "candidate_image_bytes=$candidate_image_bytes" >> "$GITHUB_OUTPUT"
          echo "Candidate image size upper bound (sum of uncompressed images): $candidate_image_bytes bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Install verified Kamal SSH credentials
        if: inputs.mode == 'cutover'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          [[ "$GPOINT_PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host ${GPOINT_PRODUCTION_HOST}
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Compare built Mini App static files with live production before mutation
        if: inputs.mode == 'cutover'
        env:
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          repository=ghcr.io/akhripunov/gpoint-miniapp
          temp_dir="$(mktemp -d "$RUNNER_TEMP/gpoint-miniapp-static.XXXXXX")"
          container_name="gpoint-miniapp-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=""
          remote_helper="/run/gpoint-kamal-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$temp_dir"
          }
          trap cleanup EXIT
          [[ "$MINIAPP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          container_id="$(docker create --name "$container_name" "$repository@$MINIAPP_DIGEST")"
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          install -d -m 700 "$temp_dir/image"
          docker cp "$container_id:/usr/share/nginx/html/." "$temp_dir/image" >/dev/null
          image_manifest="$(python3 scripts/gpoint-miniapp-static-manifest.py "$temp_dir/image")"
          readarray -t expected_manifest < <(python3 - "$image_manifest" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          if value.get('schema') != 'gpoint-miniapp-static/v1':
              raise SystemExit('built Mini App static manifest schema is invalid')
          print(value['sha256'])
          print(value['fileCount'])
          PY
          )
          expected_sha="${expected_manifest[0]}"
          expected_count="${expected_manifest[1]}"
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ && "$expected_count" =~ ^[0-9]+$ ]]
          helper_sha="$(sha256sum scripts/gpoint-miniapp-static-manifest.py | awk '{print $1}')"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh -T "${ssh_opts[@]}" "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$remote_helper" <<'REMOTE_SETUP'
          set -euo pipefail
          [[ "$1" =~ ^/run/gpoint-kamal-static-[0-9]+-[0-9]+\.py$ ]]
          test ! -e "$1"
          REMOTE_SETUP
          scp "${ssh_opts[@]}" scripts/gpoint-miniapp-static-manifest.py \
            "root@${GPOINT_PRODUCTION_HOST}:$remote_helper"
          static_result="$(ssh -T "${ssh_opts[@]}" "root@${GPOINT_PRODUCTION_HOST}" bash -s -- \
            "$remote_helper" "$helper_sha" "$expected_sha" "$expected_count" <<'REMOTE_COMPARE'
          set -euo pipefail
          helper="$1"; helper_sha="$2"; expected_sha="$3"; expected_count="$4"
          [[ "$helper" =~ ^/run/gpoint-kamal-static-[0-9]+-[0-9]+\.py$ ]]
          [[ "$helper_sha" =~ ^[0-9a-f]{64}$ && "$expected_sha" =~ ^[0-9a-f]{64}$ && "$expected_count" =~ ^[0-9]+$ ]]
          test "$(sha256sum "$helper" | awk '{print $1}')" = "$helper_sha"
          trap 'rm -f -- "$helper"' EXIT
          live_manifest="$(python3 "$helper" --reject-symlink-ancestors /opt/gpoint/app/miniapp)"
          python3 - "$live_manifest" "$expected_sha" "$expected_count" <<'PY'
          import json, sys
          actual = json.loads(sys.argv[1])
          if (actual.get('schema') != 'gpoint-miniapp-static/v1'
                  or actual.get('sha256') != sys.argv[2]
                  or str(actual.get('fileCount')) != sys.argv[3]):
              raise SystemExit('live Mini App static files differ from the exact built image')
          print('GPOINT_MINIAPP_LIVE_STATIC_PARITY=PASS')
          print('MINIAPP_STATIC_MANIFEST_SHA256=' + actual['sha256'])
          print('MINIAPP_STATIC_FILE_COUNT=' + str(actual['fileCount']))
          PY
          REMOTE_COMPARE
          )"
          grep -qx 'GPOINT_MINIAPP_LIVE_STATIC_PARITY=PASS' <<< "$static_result"
          grep -qx "MINIAPP_STATIC_MANIFEST_SHA256=$expected_sha" <<< "$static_result"
          grep -qx "MINIAPP_STATIC_FILE_COUNT=$expected_count" <<< "$static_result"
          echo "$static_result" >> "$GITHUB_STEP_SUMMARY"
      - name: Capture PostgreSQL and no-Eros cutover baseline
        if: inputs.mode == 'cutover'
        id: baseline
        env:
          CANDIDATE_IMAGE_BYTES: ${{ steps.imageverify.outputs.candidate_image_bytes }}
        run: |
          set -euo pipefail
          remote_script_dir="/run/gpoint-kamal/${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_inventory_script="${remote_script_dir}/inventory.py"
          remote_resource_script="${remote_script_dir}/resources.py"
          remote_eros_collector="${remote_script_dir}/eros-state-collector.py"
          remote_eros_state="${remote_script_dir}/kamal_eros_state.py"
          remote_eros_inventory_sanitizer="${remote_script_dir}/sanitize-kamal-inventory.py"
          remote_eros_resource_sanitizer="${remote_script_dir}/sanitize-kamal-resources.py"
          eros_collector_sha="$(sha256sum scripts/collect_kamal_eros_state.py | awk '{print $1}')"
          eros_state_sha="$(sha256sum scripts/kamal_eros_state.py | awk '{print $1}')"
          eros_inventory_sanitizer_sha="$(sha256sum scripts/sanitize-kamal-inventory.py | awk '{print $1}')"
          eros_resource_sanitizer_sha="$(sha256sum scripts/sanitize-kamal-resources.py | awk '{print $1}')"
          ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$remote_script_dir" <<'REMOTE_SETUP'
          set -euo pipefail
          [[ "$1" =~ ^/run/gpoint-kamal/[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          test ! -e "$1"
          install -d -m 700 /run/gpoint-kamal
          install -d -m 700 "$1"
          REMOTE_SETUP
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/sanitize-kamal-inventory.py "root@${GPOINT_PRODUCTION_HOST}:$remote_inventory_script"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/sanitize-kamal-resources.py "root@${GPOINT_PRODUCTION_HOST}:$remote_resource_script"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/collect_kamal_eros_state.py "root@${GPOINT_PRODUCTION_HOST}:$remote_eros_collector"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/kamal_eros_state.py "root@${GPOINT_PRODUCTION_HOST}:$remote_eros_state"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/sanitize-kamal-inventory.py "root@${GPOINT_PRODUCTION_HOST}:$remote_eros_inventory_sanitizer"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/sanitize-kamal-resources.py "root@${GPOINT_PRODUCTION_HOST}:$remote_eros_resource_sanitizer"
          facts="$(ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$CANDIDATE_SHA" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "$remote_inventory_script" "$remote_resource_script" "$CANDIDATE_IMAGE_BYTES" \
            "$remote_eros_collector" "$remote_eros_state" "$eros_collector_sha" "$eros_state_sha" \
            "$eros_inventory_sanitizer_sha" "$eros_resource_sanitizer_sha" <<'REMOTE'
          set -euo pipefail
          candidate="$1"; run_id="$2"; attempt="$3"; inventory_script="$4"; resource_script="$5"; candidate_image_bytes="$6"; eros_collector="$7"; eros_state_script="$8"
          eros_collector_sha="$9"; eros_state_sha="${10}"; eros_inventory_sanitizer_sha="${11}"; eros_resource_sanitizer_sha="${12}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]]
          [[ "$candidate_image_bytes" =~ ^[0-9]+$ && "$candidate_image_bytes" -gt 0 ]]
          [[ "$inventory_script" == "/run/gpoint-kamal/${candidate}-${run_id}-${attempt}/inventory.py" ]]
          [[ "$resource_script" == "/run/gpoint-kamal/${candidate}-${run_id}-${attempt}/resources.py" ]]
          [[ "$eros_collector" == "/run/gpoint-kamal/${candidate}-${run_id}-${attempt}/eros-state-collector.py" ]]
          [[ "$eros_state_script" == "/run/gpoint-kamal/${candidate}-${run_id}-${attempt}/kamal_eros_state.py" ]]
          test -s "$inventory_script" && test -s "$resource_script"
          test -s "$eros_collector" && test -s "$eros_state_script"
          test ! -L "$(dirname "$eros_collector")"
          test ! -L "$eros_collector" && test ! -L "$eros_state_script"
          [[ "$eros_collector_sha" =~ ^[0-9a-f]{64}$ && "$eros_state_sha" =~ ^[0-9a-f]{64}$ && "$eros_inventory_sanitizer_sha" =~ ^[0-9a-f]{64}$ && "$eros_resource_sanitizer_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$eros_collector" | awk '{print $1}')" = "$eros_collector_sha"
          test "$(sha256sum "$eros_state_script" | awk '{print $1}')" = "$eros_state_sha"
          test "$(sha256sum "$(dirname "$eros_collector")/sanitize-kamal-inventory.py" | awk '{print $1}')" = "$eros_inventory_sanitizer_sha"
          test "$(sha256sum "$(dirname "$eros_collector")/sanitize-kamal-resources.py" | awk '{print $1}')" = "$eros_resource_sanitizer_sha"
          current_sha="$(sed -n 's/^RELEASE_SHA=//p' /opt/gpoint/env/production.env | head -1)"
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          api_image="$(docker inspect --format '{{.Config.Image}}' compose-api-1)"
          docker image inspect "$api_image" >/dev/null
          api_image_sha="$(docker image inspect "$api_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$api_image_sha" = "$current_sha"
          postgres_id="$(docker inspect --format '{{.Id}}' shared_postgres_1)"
          postgres_image_id="$(docker inspect --format '{{.Image}}' shared_postgres_1)"
          test "$(docker inspect --format '{{.State.Running}}' shared_postgres_1)" = true
          systemctl is-active --quiet caddy
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          caddy_sha="$(sha256sum /etc/caddy/Caddyfile | awk '{print $1}')"
          database_facts="$(docker exec -i shared_postgres_1 sh -ec 'exec psql -XqAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d gpoint' <<'SQL'
          SELECT json_build_object(
            'systemIdentifier',(SELECT system_identifier::text FROM pg_control_system()),
            'serverVersionNum',current_setting('server_version_num')::integer,
            'databases',(SELECT json_agg(json_build_object('name',datname,'owner',pg_get_userbyid(datdba),'allowConnections',datallowconn,'acl',datacl::text) ORDER BY datname) FROM pg_database WHERE datname IN ('gpoint','postgres','template1','eros')),
            'erosRoles',(SELECT json_agg(json_build_object('name',rolname,'login',rolcanlogin,'superuser',rolsuper,'createDatabase',rolcreatedb,'createRole',rolcreaterole,'bypassRls',rolbypassrls) ORDER BY rolname) FROM pg_roles WHERE rolname IN ('eros_ddl','eros_runtime','eros_migrator')),
            'erosMemberships',(SELECT json_agg(json_build_object('role',pg_get_userbyid(roleid),'member',pg_get_userbyid(member)) ORDER BY roleid,member) FROM pg_auth_members WHERE roleid IN (SELECT oid FROM pg_roles WHERE rolname IN ('eros_ddl','eros_runtime','eros_migrator')) OR member IN (SELECT oid FROM pg_roles WHERE rolname IN ('eros_ddl','eros_runtime','eros_migrator')))
          )::text;
          SQL
          )"
          postgres_system_identifier="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["systemIdentifier"])' "$database_facts")"
          postgres_server_version_num="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["serverVersionNum"])' "$database_facts")"
          [[ "$postgres_system_identifier" =~ ^[0-9]+$ && "$postgres_server_version_num" =~ ^[0-9]+$ ]]
          postgres_acl_fingerprint="$(printf '%s' "$database_facts" | sha256sum | awk '{print $1}')"
          migration_facts="$(docker run --rm --network shared_internal --env-file /opt/gpoint/env/production.env --workdir /app/apps/api "$api_image" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const p=await db.$queryRawUnsafe("SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY finished_at DESC LIMIT 1");const all=await db.$queryRawUnsafe("SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const a=await db.$queryRawUnsafe("SELECT to_regclass('\''agata.alembic_version'\'')::text AS relation");let head="ABSENT";if(a[0].relation){const rows=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(rows.length!==1)throw Error("AGATA head is not singular");head=rows[0].version_num}console.log("PRISMA_HEAD="+(p[0]?.migration_name||"NONE"));console.log("PRISMA_MIGRATIONS="+all.map(x=>x.migration_name).join(","));console.log("AGATA_HEAD="+head)}catch(e){console.error("READ_ONLY_DATABASE_BASELINE_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          prisma_head="$(sed -n 's/^PRISMA_HEAD=//p' <<< "$migration_facts")"
          prisma_migrations="$(sed -n 's/^PRISMA_MIGRATIONS=//p' <<< "$migration_facts")"
          agata_head="$(sed -n 's/^AGATA_HEAD=//p' <<< "$migration_facts")"
          test -n "$prisma_head" && test -n "$prisma_migrations" && test -n "$agata_head"
          free_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          [[ "$docker_root" == /* && -d "$docker_root" ]]
          docker_free_kb="$(df -Pk "$docker_root" | awk 'NR==2 {print $4}')"
          memory_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          memory_total_kb="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          [[ "$free_kb" =~ ^[0-9]+$ && "$docker_free_kb" =~ ^[0-9]+$ && "$memory_kb" =~ ^[0-9]+$ && "$memory_total_kb" =~ ^[0-9]+$ ]]
          log_dir="/opt/gpoint/release-logs/${candidate}"
          mkdir -p "$log_dir" && chmod 700 "$log_dir"
          eros_state_file="${log_dir}/kamal-no-eros-state-${run_id}-${attempt}.json"
          test ! -e "$eros_state_file"
          eros_state_result="$(python3 "$eros_collector" --output "$eros_state_file")"
          grep -qx 'EROS_STATE_COLLECT=PASS' <<< "$eros_state_result"
          eros_state_content_sha="$(sed -n 's/^EROS_STATE_SHA256=//p' <<< "$eros_state_result")"
          [[ "$eros_state_content_sha" =~ ^[0-9a-f]{64}$ ]]
          eros_state_sha="$(sha256sum "$eros_state_file" | awk '{print $1}')"
          [[ "$eros_state_sha" =~ ^[0-9a-f]{64}$ ]]
          inventory_file="${log_dir}/kamal-vps-inventory-${run_id}-${attempt}.json"
          ids=( $(docker ps -aq) )
          ((${#ids[@]} > 0))
          test -z "$(docker ps -aq --filter 'name=^/kamal-proxy$')"
          ! docker network inspect kamal >/dev/null 2>&1
          ! docker volume inspect kamal-proxy-config >/dev/null 2>&1
          kamal_proxy_baseline=ABSENT
          resource_file="/run/gpoint-kamal/${candidate}-${run_id}-${attempt}/resources.json"
          docker stats --no-stream --format '{{json .}}' | python3 "$resource_script" > "$resource_file"
          docker inspect "${ids[@]}" | python3 "$inventory_script" --resource-facts "$resource_file" > "$inventory_file"
          rm -f "$resource_file"
          chmod 600 "$inventory_file"
          inventory_sha="$(sha256sum "$inventory_file" | awk '{print $1}')"
          readarray -t resource_metrics < <(python3 - "$inventory_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              rows=json.load(f)['resourceUsage']
          print(len(rows))
          print(sum(row['memoryUsedBytes'] for row in rows))
          print(sum(row['cpuPercent'] for row in rows))
          print(max(row['memoryPercent'] for row in rows))
          PY
          )
          resource_containers="${resource_metrics[0]}"
          resource_memory_bytes="${resource_metrics[1]}"
          resource_cpu_percent="${resource_metrics[2]}"
          resource_max_memory_percent="${resource_metrics[3]}"
          [[ "$resource_containers" =~ ^[0-9]+$ && "$resource_memory_bytes" =~ ^[0-9]+$ ]]
          baseline_file="${log_dir}/kamal-cutover-baseline-${run_id}-${attempt}.txt"
          baseline_captured_at_epoch="$(date -u +%s)"
          [[ "$baseline_captured_at_epoch" =~ ^[0-9]+$ ]]
          umask 077
          cat > "$baseline_file" <<EOF
          BASELINE_SCHEMA=gpoint-kamal-cutover-baseline/v1
          CANDIDATE_SHA=$candidate
          RUN_ID=$run_id
          ATTEMPT=$attempt
          BASELINE_CAPTURED_AT_EPOCH=$baseline_captured_at_epoch
          CURRENT_SHA=$current_sha
          CURRENT_API_IMAGE=$api_image
          CURRENT_API_IMAGE_SHA=$api_image_sha
          POSTGRES_CONTAINER_ID=$postgres_id
          POSTGRES_IMAGE_ID=$postgres_image_id
          POSTGRES_SYSTEM_IDENTIFIER=$postgres_system_identifier
          POSTGRES_SERVER_VERSION_NUM=$postgres_server_version_num
          POSTGRES_ACL_FINGERPRINT=$postgres_acl_fingerprint
          PRISMA_HEAD=$prisma_head
          AGATA_HEAD=$agata_head
          PRISMA_MIGRATIONS=$prisma_migrations
          NO_EROS_STATE_FILE=$eros_state_file
          NO_EROS_STATE_SHA256=$eros_state_sha
          NO_EROS_STATE_CONTENT_SHA256=$eros_state_content_sha
          CADDYFILE_SHA256=$caddy_sha
          KAMAL_PROXY_BASELINE=$kamal_proxy_baseline
          INVENTORY_FILE=$inventory_file
          INVENTORY_SHA256=$inventory_sha
          FREE_DISK_KB=$free_kb
          DOCKER_ROOT=$docker_root
          DOCKER_FREE_DISK_KB=$docker_free_kb
          MEMORY_AVAILABLE_KB=$memory_kb
          MEMORY_TOTAL_KB=$memory_total_kb
          CANDIDATE_IMAGE_BYTES=$candidate_image_bytes
          RUNNING_RESOURCE_SAMPLES=$resource_containers
          CONTAINER_MEMORY_USED_BYTES=$resource_memory_bytes
          CONTAINER_CPU_PERCENT_SUM=$resource_cpu_percent
          MAX_CONTAINER_MEMORY_PERCENT=$resource_max_memory_percent
          EOF
          chmod 600 "$baseline_file"
          baseline_sha="$(sha256sum "$baseline_file" | awk '{print $1}')"
          printf 'baseline_path=%s\nbaseline_sha=%s\ninventory_sha=%s\ncurrent_sha=%s\nprisma_head=%s\nprisma_migrations=%s\nagata_head=%s\npostgres_system_identifier=%s\ndocker_free_kb=%s\nmemory_available_kb=%s\nmemory_total_kb=%s\nrunning_resource_samples=%s\ncontainer_memory_used_bytes=%s\ncontainer_cpu_percent_sum=%s\nmax_container_memory_percent=%s\ncandidate_image_bytes=%s\nno_eros_state_path=%s\nno_eros_state_sha=%s\n' \
            "$baseline_file" "$baseline_sha" "$inventory_sha" "$current_sha" "$prisma_head" "$prisma_migrations" "$agata_head" "$postgres_system_identifier" \
            "$docker_free_kb" "$memory_kb" "$memory_total_kb" "$resource_containers" "$resource_memory_bytes" "$resource_cpu_percent" "$resource_max_memory_percent" "$candidate_image_bytes" "$eros_state_file" "$eros_state_sha"
          rm -f "$inventory_script" "$resource_script" "$eros_collector" "$eros_state_script" "$(dirname "$eros_collector")/sanitize-kamal-inventory.py" "$(dirname "$eros_collector")/sanitize-kamal-resources.py"
          # Keep the attempt-scoped evidence directory: other verification artifacts
          # may legitimately remain. Its removal is not a readiness gate.
          test -s "$baseline_file"
          test -s "$inventory_file"
          test -s "$eros_state_file"
          test "$(sha256sum "$baseline_file" | awk '{print $1}')" = "$baseline_sha"
          test "$(sha256sum "$inventory_file" | awk '{print $1}')" = "$inventory_sha"
          test "$(sha256sum "$eros_state_file" | awk '{print $1}')" = "$eros_state_sha"
          REMOTE
          )"
          while IFS='=' read -r key value; do
            case "$key" in
              baseline_path|baseline_sha|inventory_sha|current_sha|prisma_head|prisma_migrations|agata_head|postgres_system_identifier|docker_free_kb|memory_available_kb|memory_total_kb|running_resource_samples|container_memory_used_bytes|container_cpu_percent_sum|max_container_memory_percent|candidate_image_bytes|no_eros_state_path|no_eros_state_sha)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                printf -- '- %s: %s\n' "$key" "$value" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done <<< "$facts"
      - name: Verify application source matches the live production SHA
        if: inputs.mode == 'cutover'
        env:
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          LIVE_SOURCE_SHA: ${{ steps.baseline.outputs.current_sha }}
        run: |
          set -euo pipefail
          [[ "$APP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$LIVE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APP_SOURCE_SHA" = "$LIVE_SOURCE_SHA"
          echo "Verified APP_SOURCE_SHA=$APP_SOURCE_SHA matches current production RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify application source migrations match the live database
        if: inputs.mode == 'cutover'
        env:
          PRISMA_HEAD: ${{ steps.baseline.outputs.prisma_head }}
          PRISMA_MIGRATIONS: ${{ steps.baseline.outputs.prisma_migrations }}
          AGATA_HEAD: ${{ steps.baseline.outputs.agata_head }}
        run: |
          set -euo pipefail
          python3 scripts/verify-kamal-migration-parity.py \
            --prisma-directory app-source/packages/db/prisma/migrations \
            --prisma-current-migrations "$PRISMA_MIGRATIONS" \
            --prisma-current-head "$PRISMA_HEAD" \
            --agata-directory app-source/services/agata/migrations/versions \
            --agata-current-head "$AGATA_HEAD"
          echo 'Verified no migrations are pending for the selected production application source.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify fresh PostgreSQL and media backup with isolated restore
        if: inputs.mode == 'cutover'
        id: backuprestore
        env:
          BASELINE_PATH: ${{ steps.baseline.outputs.baseline_path }}
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          GPOINT_KAMAL_BACKUP_AGE_RECIPIENT: ${{ secrets.GPOINT_KAMAL_BACKUP_AGE_RECIPIENT }}
          GPOINT_KAMAL_BACKUP_OFFSITE_REMOTE: ${{ secrets.GPOINT_KAMAL_BACKUP_OFFSITE_REMOTE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'age1[0-9a-z]{58}', os.environ['GPOINT_KAMAL_BACKUP_AGE_RECIPIENT']):
              raise SystemExit('protected age recipient is missing or malformed')
          remote = os.environ['GPOINT_KAMAL_BACKUP_OFFSITE_REMOTE']
          if not re.fullmatch(r'[A-Za-z0-9_-]+:[A-Za-z0-9_./-]+', remote) or '..' in remote:
              raise SystemExit('protected offsite backup destination is missing or malformed')
          PY
          remote_script_dir="/run/gpoint-kamal/${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_backup_helper="${remote_script_dir}/backup.py"
          remote_restore_script="${remote_script_dir}/restore.sh"
          remote_media_tree_helper="${remote_script_dir}/media-tree.py"
          ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$remote_script_dir" <<'REMOTE_SETUP'
          set -euo pipefail
          [[ "$1" =~ ^/run/gpoint-kamal/[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          # The baseline step created this exact attempt-scoped directory.
          # Fail closed if it is absent, symlinked, or not root-owned/private.
          test -d "$1"
          test ! -L "$1"
          test "$(stat -c '%u:%a' "$1")" = '0:700'
          test ! -e "$1/backup.py"
          test ! -e "$1/restore.sh"
          test ! -e "$1/media-tree.py"
          REMOTE_SETUP
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/agata-production-migration.py "root@${GPOINT_PRODUCTION_HOST}:$remote_backup_helper"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/verify-gpoint-backup-restore.sh "root@${GPOINT_PRODUCTION_HOST}:$remote_restore_script"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/gpoint-media-tree.py "root@${GPOINT_PRODUCTION_HOST}:$remote_media_tree_helper"
          facts="$(ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@${GPOINT_PRODUCTION_HOST}" bash "$remote_restore_script" \
            "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$BASELINE_PATH" "$BASELINE_SHA" "$remote_backup_helper" \
            "$GPOINT_KAMAL_BACKUP_AGE_RECIPIENT" "$GPOINT_KAMAL_BACKUP_OFFSITE_REMOTE" \
            "$remote_media_tree_helper")"
          grep -qx 'GPOINT_PRE_BACKUP_CAPACITY=PASS' <<< "$facts"
          grep -qx 'GPOINT_MEDIA_OFFSITE_READBACK=PASS' <<< "$facts"
          grep -qx 'GPOINT_PRE_RESTORE_CAPACITY=PASS' <<< "$facts"
          grep -qx 'GPOINT_ISOLATED_RESTORE=PASS' <<< "$facts"
          grep -qx 'GPOINT_MEDIA_BACKUP=PASS' <<< "$facts"
          grep -qx 'GPOINT_MEDIA_ISOLATED_RESTORE=PASS' <<< "$facts"
          while IFS='=' read -r key value; do
            case "$key" in
              backup_path|backup_sha256|backup_bytes|restore_evidence_path|restore_evidence_sha|restored_table_count|media_backup_path|media_backup_sha256|media_backup_bytes|media_file_count|media_directory_count|media_total_bytes|media_source_manifest_sha256|media_restore_manifest_sha256)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                printf -- '- %s: %s\n' "$key" "$value" >> "$GITHUB_STEP_SUMMARY"
                ;;
              GPOINT_PRE_BACKUP_CAPACITY|GPOINT_MEDIA_OFFSITE_READBACK|GPOINT_PRE_RESTORE_CAPACITY|GPOINT_ISOLATED_RESTORE|GPOINT_MEDIA_BACKUP|GPOINT_MEDIA_ISOLATED_RESTORE)
                test "$value" = 'PASS' || { echo "Backup/restore status $key is not PASS" >&2; exit 1; }
                ;;
              *) echo "Unexpected backup/restore result field: $key" >&2; exit 1 ;;
            esac
          done <<< "$facts"
      - name: Check VPS disk headroom for the exact candidate images
        if: inputs.mode == 'cutover'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_IMAGE_BYTES: ${{ steps.imageverify.outputs.candidate_image_bytes }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          [[ "$CANDIDATE_IMAGE_BYTES" =~ ^[0-9]+$ && "$CANDIDATE_IMAGE_BYTES" -gt 0 ]]
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CANDIDATE_IMAGE_BYTES" <<'REMOTE'
          set -euo pipefail
          sha="$1"; run_id="$2"; attempt="$3"; image_bytes="$4"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ && "$image_bytes" =~ ^[0-9]+$ ]]
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          [[ "$docker_root" == /* && -d "$docker_root" ]]
          free_kb="$(df -Pk "$docker_root" | awk 'NR==2 {print $4}')"
          [[ "$free_kb" =~ ^[0-9]+$ ]]
          free_bytes=$((free_kb * 1024))
          reserve_bytes=$((1024 * 1024 * 1024))
          required_bytes=$((image_bytes + reserve_bytes))
          if (( free_bytes < required_bytes )); then
            echo "insufficient Docker-root free space for candidate images plus 1 GiB reserve" >&2
            exit 1
          fi
          evidence="/opt/gpoint/release-logs/${sha}/kamal-disk-headroom-${run_id}-${attempt}.txt"
          umask 077
          cat > "$evidence" <<EOF
          DISK_HEADROOM_SCHEMA=gpoint-kamal-disk-headroom/v1
          CANDIDATE_SHA=$sha
          RUN_ID=$run_id
          ATTEMPT=$attempt
          DOCKER_ROOT=$docker_root
          DOCKER_FREE_BYTES=$free_bytes
          CANDIDATE_IMAGE_BYTES=$image_bytes
          RESERVE_BYTES=$reserve_bytes
          REQUIRED_BYTES=$required_bytes
          KAMAL_CUTOVER_DISK_HEADROOM=PASS
          EOF
          chmod 600 "$evidence"
          printf 'docker_free_bytes=%s\ncandidate_image_bytes=%s\nreserve_bytes=%s\nevidence_path=%s\nevidence_sha=%s\nKAMAL_CUTOVER_DISK_HEADROOM=PASS\n' \
            "$free_bytes" "$image_bytes" "$reserve_bytes" "$evidence" "$(sha256sum "$evidence" | awk '{print $1}')"
          REMOTE
          )"
          grep -qx 'KAMAL_CUTOVER_DISK_HEADROOM=PASS' <<< "$facts"
          while IFS='=' read -r key value; do
            case "$key" in
              docker_free_bytes|candidate_image_bytes|reserve_bytes|evidence_path|evidence_sha)
                printf -- '- %s: %s\n' "$key" "$value" >> "$GITHUB_STEP_SUMMARY"
                ;;
              KAMAL_CUTOVER_DISK_HEADROOM) ;;
              *) echo "Unexpected disk headroom result field: $key" >&2; exit 1 ;;
            esac
          done <<< "$facts"
      - name: Create exact-SHA in-progress GitHub Deployment
        if: inputs.mode == 'cutover'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "$CANDIDATE_SHA" '{ref:$ref, task:"deploy", environment:"production", auto_merge:false, required_contexts:[]}')"
          deployment_id="$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - <<<"$payload" --jq .id)"
          test "$deployment_id" -gt 0
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=in_progress -f environment=production \
            -f description="Kamal Deploy started after Native First CI/Build PASS" >/dev/null
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Run one server-owned Kamal cutover transaction
        if: inputs.mode == 'cutover'
        id: verify
        env:
          BASELINE_PATH: ${{ steps.baseline.outputs.baseline_path }}
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          NO_EROS_STATE_PATH: ${{ steps.baseline.outputs.no_eros_state_path }}
          NO_EROS_STATE_SHA: ${{ steps.baseline.outputs.no_eros_state_sha }}
          MEDIA_SOURCE_MANIFEST_SHA: ${{ steps.backuprestore.outputs.media_source_manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
          PROXY_DIGEST: ${{ needs.build.outputs.proxy_digest }}
          BACKUP_PATH: ${{ steps.backuprestore.outputs.backup_path }}
          BACKUP_SHA: ${{ steps.backuprestore.outputs.backup_sha256 }}
          RESTORE_EVIDENCE_PATH: ${{ steps.backuprestore.outputs.restore_evidence_path }}
          RESTORE_EVIDENCE_SHA: ${{ steps.backuprestore.outputs.restore_evidence_sha }}
          MEDIA_BACKUP_PATH: ${{ steps.backuprestore.outputs.media_backup_path }}
          MEDIA_BACKUP_SHA: ${{ steps.backuprestore.outputs.media_backup_sha256 }}
          MEDIA_BACKUP_BYTES: ${{ steps.backuprestore.outputs.media_backup_bytes }}
          MEDIA_FILE_COUNT: ${{ steps.backuprestore.outputs.media_file_count }}
          MEDIA_DIRECTORY_COUNT: ${{ steps.backuprestore.outputs.media_directory_count }}
          MEDIA_TOTAL_BYTES: ${{ steps.backuprestore.outputs.media_total_bytes }}
          MEDIA_RESTORE_MANIFEST_SHA: ${{ steps.backuprestore.outputs.media_restore_manifest_sha256 }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          CADDYFILE_SHA256: ${{ steps.baseline.outputs.caddy_sha }}
        run: bash scripts/run-kamal-cutover-owner.sh
      - name: Record GitHub Deployment result against the same attempt
        if: always() && inputs.mode == 'cutover' && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          MANIFEST_SHA: ${{ steps.verify.outputs.manifest_sha }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$DEPLOY_JOB_STATUS" == success && "$VERIFY_OUTCOME" == success ]]; then state=success; fi
          description="Kamal $state workflow $CANDIDATE_SHA app-source $APP_SOURCE_SHA"
          if [[ "$state" == success ]]; then
            [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
            description="Kamal $state workflow $CANDIDATE_SHA app-source $APP_SOURCE_SHA manifest $MANIFEST_SHA"
          fi
          echo "GITHUB_DEPLOYMENT_STATUS=$state SHA=$CANDIDATE_SHA MANIFEST_SHA=$MANIFEST_SHA" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -f environment=production \
            -f description="$description" >/dev/null
