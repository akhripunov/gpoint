name: GPoint — Protected rollback

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      approve_production:
        description: I authorize this exact rollback target on GPoint production
        required: true
        type: boolean
        default: false
      rollback:
        description: Roll back to a previously verified successful Native production release
        required: true
        type: boolean
        default: false
      rollback_eros:
        description: Also roll back the Eros image after isolated SQLx compatibility verification
        required: true
        type: boolean
        default: false
      rollback_target_sha:
        description: Exact target source SHA from a successful Native production deployment
        required: false
        type: string
      rollback_deployment_id:
        description: Exact successful GitHub production Deployment ID for the target SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Protected rollback to a verified Native release
    if: github.ref == 'refs/heads/main' && inputs.rollback == true && inputs.approve_production == true
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.verify.outputs.environment_url }}
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GPOINT_SSH_KEY: /root/.ssh/id_ed25519
      GPOINT_KNOWN_HOSTS_FILE: /root/.ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact current main and owner-selected previous deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TARGET_SHA: ${{ inputs.rollback_target_sha }}
          TARGET_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          OWNER_ACTOR: ${{ github.actor }}
          OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_DEPLOYMENT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$TARGET_SHA" != "$CANDIDATE_SHA"
          test "$APPROVE_PRODUCTION" = true
          test "$OWNER_ACTOR" = "$REPOSITORY_OWNER"
          test "$OWNER_TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/gpoint-rollback"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$TARGET_DEPLOYMENT_ID" > "$RUNNER_TEMP/gpoint-rollback/deployment.json"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$TARGET_DEPLOYMENT_ID/statuses?per_page=100" > "$RUNNER_TEMP/gpoint-rollback/statuses.json"
          python3 - "$RUNNER_TEMP/gpoint-rollback/deployment.json" "$RUNNER_TEMP/gpoint-rollback/statuses.json" "$TARGET_SHA" "$TARGET_DEPLOYMENT_ID" > "$RUNNER_TEMP/gpoint-rollback/run_id" <<'PY'
          import json,re,sys
          import os
          deployment=json.load(open(sys.argv[1])); statuses=json.load(open(sys.argv[2]))
          sha, deployment_id=sys.argv[3],int(sys.argv[4])
          if deployment.get('sha') != sha or deployment.get('environment') != 'production' or deployment.get('task') != 'deploy' or deployment.get('id') != deployment_id:
              raise SystemExit('selected target is not the requested production Deploy')
          statuses.sort(key=lambda x:x.get('created_at',''), reverse=True)
          if not statuses or statuses[0].get('state') != 'success': raise SystemExit('latest target Deployment status is not SUCCESS')
          description_match=re.fullmatch(r'Kamal success SHA ([0-9a-f]{40}) manifest ([0-9a-f]{64})',statuses[0].get('description',''))
          environment_match=re.fullmatch(r'https://gpoint\.one/#gpoint-manifest-sha256=([0-9a-f]{64})(?:&gpoint-core-source-sha=[0-9a-f]{40}&gpoint-agata-source-sha=[0-9a-f]{40}&gpoint-miniapp-source-sha=[0-9a-f]{40})?',statuses[0].get('environment_url',''))
          if environment_match:
              manifest_sha=environment_match.group(1)
          elif description_match and description_match.group(1) == sha:
              manifest_sha=description_match.group(2)
          else:
              raise SystemExit('target Deployment lacks exact Runtime Verify manifest evidence')
          url=statuses[0].get('log_url','')
          run=re.fullmatch(r'https://github\.com/([^/]+/[^/]+)/actions/runs/([0-9]+)(?:/attempts/([0-9]+))?',url)
          if not run or run.group(1).lower() != os.environ.get('GITHUB_REPOSITORY','').lower(): raise SystemExit('target Deployment lacks a trusted Native Release run link')
          print(run.group(2))
          print(manifest_sha)
          PY
          run_id="$(sed -n '1p' "$RUNNER_TEMP/gpoint-rollback/run_id")"
          target_manifest_sha="$(sed -n '2p' "$RUNNER_TEMP/gpoint-rollback/run_id")"
          [[ "$target_manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/gpoint-rollback/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs' > "$RUNNER_TEMP/gpoint-rollback/jobs.json"
          echo "TARGET_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "TARGET_MANIFEST_SHA=$target_manifest_sha" >> "$GITHUB_ENV"
      - name: Install verified VPS SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          [[ "$GPOINT_PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host ${GPOINT_PRODUCTION_HOST}
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Retrieve only the manifest anchored by the prior successful status
        id: manifest
        env:
          TARGET_SHA: ${{ inputs.rollback_target_sha }}
          TARGET_MANIFEST_SHA: ${{ env.TARGET_MANIFEST_SHA }}
        run: |
          set -euo pipefail
          manifest_sha="$TARGET_MANIFEST_SHA"
          [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          encoded="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$TARGET_SHA" "$manifest_sha" <<'REMOTE'
          set -euo pipefail
          sha="$1"; expected="$2"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$expected" =~ ^[0-9a-f]{64}$ ]]
          root="/opt/gpoint/release-logs/$sha"
          test -d "$root" && test ! -L "$root"
          matches=0; selected=''
          while IFS= read -r -d '' path; do
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [[ "$actual" == "$expected" ]]; then matches=$((matches+1)); selected="$path"; fi
          done < <(find "$root" -maxdepth 1 -type f -name 'kamal-production-*.json' -print0)
          test "$matches" = 1
          base64 < "$selected" | tr -d '\n'
          REMOTE
          )"
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/gpoint-rollback/manifest.json"
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
      - name: Validate linked build, successful Runtime Verify and component-role manifest
        id: evidence
        env:
          TARGET_SHA: ${{ inputs.rollback_target_sha }}
          TARGET_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
        run: |
          set -euo pipefail
          python3 scripts/verify_native_rollback_evidence.py \
            --deployment "$RUNNER_TEMP/gpoint-rollback/deployment.json" \
            --statuses "$RUNNER_TEMP/gpoint-rollback/statuses.json" \
            --run "$RUNNER_TEMP/gpoint-rollback/run.json" \
            --jobs "$RUNNER_TEMP/gpoint-rollback/jobs.json" \
            --manifest "$RUNNER_TEMP/gpoint-rollback/manifest.json" \
            --sha "$TARGET_SHA" --deployment-id "$TARGET_DEPLOYMENT_ID" \
            --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          platforms: linux/amd64
      - name: Authenticate to GHCR for read-only immutable image verification
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify target digests, platform, revision and provenance
        env:
          TARGET_SHA: ${{ inputs.rollback_target_sha }}
          CORE_DIGEST: ${{ steps.evidence.outputs.core_digest }}
          AGATA_DIGEST: ${{ steps.evidence.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ steps.evidence.outputs.miniapp_digest }}
          EROS_DIGEST: ${{ steps.evidence.outputs.eros_digest }}
          CORE_SOURCE_SHA: ${{ steps.evidence.outputs.core_source_sha }}
          AGATA_SOURCE_SHA: ${{ steps.evidence.outputs.agata_source_sha }}
          MINIAPP_SOURCE_SHA: ${{ steps.evidence.outputs.miniapp_source_sha }}
          EROS_SOURCE_SHA: ${{ steps.evidence.outputs.eros_source_sha }}
        run: |
          set -euo pipefail
          for item in \
            "core|ghcr.io/akhripunov/gpoint-runtime|$CORE_DIGEST|$CORE_SOURCE_SHA" \
            "agata|ghcr.io/akhripunov/gpoint-agata-runtime|$AGATA_DIGEST|$AGATA_SOURCE_SHA" \
            "miniapp|ghcr.io/akhripunov/gpoint-miniapp|$MINIAPP_DIGEST|$MINIAPP_SOURCE_SHA"; do
            IFS='|' read -r role repository digest source_sha <<< "$item"
            docker pull --platform linux/amd64 "$repository@$digest"
            docker image inspect "$repository@$digest" > "$RUNNER_TEMP/gpoint-rollback/$role-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' "$repository@$digest" > "$RUNNER_TEMP/gpoint-rollback/$role-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' "$repository@$digest" > "$RUNNER_TEMP/gpoint-rollback/$role-provenance.json"
            python3 scripts/verify_native_image_readback.py "$RUNNER_TEMP/gpoint-rollback/$role-image.json" "$repository" "$digest" "$source_sha"
            python3 scripts/verify_native_image_attestation.py "$RUNNER_TEMP/gpoint-rollback/$role-sbom.json" "$RUNNER_TEMP/gpoint-rollback/$role-provenance.json" "$source_sha" https://github.com/akhripunov/gpoint.git
          done
          if [[ "${{ inputs.rollback_eros }}" == true ]]; then
            [[ "$EROS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$EROS_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            image=ghcr.io/akhripunov/gpoint-eros
            docker pull --platform linux/amd64 "$image@$EROS_DIGEST"
            docker image inspect "$image@$EROS_DIGEST" > "$RUNNER_TEMP/gpoint-rollback/eros-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' "$image@$EROS_DIGEST" > "$RUNNER_TEMP/gpoint-rollback/eros-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' "$image@$EROS_DIGEST" > "$RUNNER_TEMP/gpoint-rollback/eros-provenance.json"
            python3 scripts/verify_native_eros_image.py \
              "$RUNNER_TEMP/gpoint-rollback/eros-image.json" "$RUNNER_TEMP/gpoint-rollback/eros-sbom.json" \
              "$RUNNER_TEMP/gpoint-rollback/eros-provenance.json" "$EROS_DIGEST" "$EROS_SOURCE_SHA"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.evidence.outputs.core_source_sha }}
          path: rollback-core
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.evidence.outputs.agata_source_sha }}
          path: rollback-agata
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.evidence.outputs.miniapp_source_sha }}
          path: rollback-miniapp
          persist-credentials: false
      - name: Verify live DB compatibility and retained target containers before mutation
        id: baseline
        env:
          TARGET_SHA: ${{ inputs.rollback_target_sha }}
          CORE_VERSION: ${{ steps.evidence.outputs.core_version }}
          AGATA_VERSION: ${{ steps.evidence.outputs.agata_version }}
          MINIAPP_VERSION: ${{ steps.evidence.outputs.miniapp_version }}
          CORE_SOURCE_SHA: ${{ steps.evidence.outputs.core_source_sha }}
          AGATA_SOURCE_SHA: ${{ steps.evidence.outputs.agata_source_sha }}
          MINIAPP_SOURCE_SHA: ${{ steps.evidence.outputs.miniapp_source_sha }}
          CORE_DIGEST: ${{ steps.evidence.outputs.core_digest }}
          AGATA_DIGEST: ${{ steps.evidence.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ steps.evidence.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$TARGET_SHA" "$CORE_VERSION" "$AGATA_VERSION" "$MINIAPP_VERSION" "$CORE_SOURCE_SHA" "$AGATA_SOURCE_SHA" "$MINIAPP_SOURCE_SHA" "$CORE_DIGEST" "$AGATA_DIGEST" "$MINIAPP_DIGEST" <<'REMOTE'
          set -euo pipefail
          target_sha="$1"; core_version="$2"; agata_version="$3"; miniapp_version="$4"; core_sha="$5"; agata_sha="$6"; miniapp_sha="$7"; core="ghcr.io/akhripunov/gpoint-runtime@$8"; agata="ghcr.io/akhripunov/gpoint-agata-runtime@$9"; miniapp="ghcr.io/akhripunov/gpoint-miniapp@${10}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ && "$core_version" == "$core_sha"-* && "$agata_version" == "$agata_sha"-* && "$miniapp_version" == "$miniapp_sha"-* ]]
          test "$(docker inspect --format '{{.State.Running}}' kamal-proxy)" = true
          test "$(docker inspect --format '{{.State.Running}}' shared_postgres_1)" = true
          test "$(docker inspect --format '{{.State.Running}}' shared_redis_1)" = true
          echo "DB_CONTAINER_ID=$(docker inspect --format '{{.Id}}' shared_postgres_1)"
          echo "REDIS_CONTAINER_ID=$(docker inspect --format '{{.Id}}' shared_redis_1)"
          for item in "gpoint-core-api|$core|$core_version|$core_sha" "gpoint-core-worker|$core|$core_version|$core_sha" "gpoint-core-bot|$core|$core_version|$core_sha" "gpoint-agata-api|$agata|$agata_version|$agata_sha" "gpoint-agata-memory-worker|$agata|$agata_version|$agata_sha" "gpoint-miniapp-web|$miniapp|$miniapp_version|$miniapp_sha"; do
            IFS='|' read -r prefix expected_image version source_sha <<< "$item"
            current="$(docker ps -q --filter "name=^/${prefix}-")"
            test "$(wc -l <<< "$current" | tr -d ' ')" = 1
            live_name="$(docker inspect --format '{{.Name}}' "$current" | sed 's#^/##')"
            current_version="${live_name#${prefix}-}"
            current_sha="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$current")"
            [[ "$current_sha" =~ ^[0-9a-f]{40}$ && "$current_version" == "$current_sha"-* ]]
            target="$(docker ps -aq --filter "name=^/${prefix}-${version}$")"
            test "$(wc -l <<< "$target" | tr -d ' ')" = 1 || { echo "rollback target container is not retained: $prefix" >&2; exit 1; }
            test "$(docker inspect --format '{{.Config.Labels "org.opencontainers.image.revision"}}' "$target")" = "$source_sha"
            image_id="$(docker inspect --format '{{.Image}}' "$target")"
            docker image inspect "$image_id" --format '{{json .RepoDigests}}' | grep -F "$expected_image" >/dev/null
          done
          db_mounts="$(docker inspect shared_postgres_1 --format '{{json .Mounts}}' | python3 -c 'import hashlib,json,sys; a=json.load(sys.stdin); r=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a),key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert r and all(x["Source"] and x["Destination"] for x in r); print(hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          redis_mounts="$(docker inspect shared_redis_1 --format '{{json .Mounts}}' | python3 -c 'import hashlib,json,sys; a=json.load(sys.stdin); r=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a),key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert r and all(x["Source"] and x["Destination"] for x in r); print(hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          echo "DB_MOUNTS_SHA256=$db_mounts"
          echo "REDIS_MOUNTS_SHA256=$redis_mounts"
          current_api="$(docker ps -q --filter 'name=^/gpoint-core-api-')"
          current_db="$(docker exec --workdir /app/apps/api "$current_api" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const r=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const a=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(a.length!==1)throw Error("AGATA head not singular");console.log("PRISMA_HEAD="+(r.length?r[r.length-1].migration_name:"NONE"));console.log("PRISMA_MIGRATIONS="+r.map(x=>x.migration_name).join(","));console.log("PRISMA_CHECKSUMS="+r.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("AGATA_HEAD="+a[0].version_num)}catch(e){console.error("READ_ONLY_DB_CHECK_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          printf '%s\n' "$current_db"
          REMOTE
          )"
          printf '%s\n' "$facts" > "$RUNNER_TEMP/gpoint-rollback/live-db.txt"
          python3 "$GITHUB_WORKSPACE/scripts/verify-kamal-migration-parity.py" \
            --prisma-directory "$GITHUB_WORKSPACE/rollback-core/packages/db/prisma/migrations" \
            --prisma-current-migrations "$(sed -n 's/^PRISMA_MIGRATIONS=//p' <<< "$facts")" \
            --prisma-current-checksums "$(sed -n 's/^PRISMA_CHECKSUMS=//p' <<< "$facts")" \
            --prisma-current-head "$(sed -n 's/^PRISMA_HEAD=//p' <<< "$facts")" \
            --agata-directory "$GITHUB_WORKSPACE/rollback-agata/services/agata/migrations/versions" \
            --agata-current-head "$(sed -n 's/^AGATA_HEAD=//p' <<< "$facts")"
          while IFS='=' read -r key value; do case "$key" in DB_CONTAINER_ID|REDIS_CONTAINER_ID|DB_MOUNTS_SHA256|REDIS_MOUNTS_SHA256) echo "$key=$value" >> "$GITHUB_OUTPUT" ;; esac; done <<< "$facts"
      - name: Verify retained Eros rollback containers
        if: inputs.rollback_eros == true
        env:
          EROS_VERSION: ${{ steps.evidence.outputs.eros_version }}
          EROS_RELAY_VERSION: ${{ steps.evidence.outputs.eros_relay_version }}
          EROS_DIGEST: ${{ steps.evidence.outputs.eros_digest }}
          CORE_DIGEST: ${{ steps.evidence.outputs.core_digest }}
          EROS_SOURCE_SHA: ${{ steps.evidence.outputs.eros_source_sha }}
        run: |
          set -euo pipefail
          [[ "$EROS_VERSION" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$EROS_RELAY_VERSION" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$EROS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$CORE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$EROS_SOURCE_SHA" = "${EROS_VERSION%%-*}"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$EROS_VERSION" "$EROS_RELAY_VERSION" "$EROS_SOURCE_SHA" \
            "ghcr.io/akhripunov/gpoint-eros@$EROS_DIGEST" "ghcr.io/akhripunov/gpoint-runtime@$CORE_DIGEST" <<'REMOTE'
          set -euo pipefail
          for item in "gpoint-eros-pilot-engine|$1|$3|$4|com.gpoint.source.revision" \
                      "gpoint-eros-relay-relay|$2|$3|$5|org.opencontainers.image.revision"; do
            IFS='|' read -r prefix version source image label <<< "$item"
            ids="$(docker ps -aq --filter "name=^/${prefix}-${version}$")"
            test "$(wc -l <<< "$ids" | tr -d ' ')" = 1
            test "$(docker inspect --format "{{index .Config.Labels \"$label\"}}" "$ids")" = "$source"
            docker image inspect "$(docker inspect --format '{{.Image}}' "$ids")" --format '{{json .RepoDigests}}' | grep -F "$image" >/dev/null
          done
          echo EROS_ROLLBACK_TARGET_RETAINED=PASS
          REMOTE
      - name: Verify Eros rollback image against an isolated current database restore
        if: inputs.rollback_eros == true
        env:
          EROS_SOURCE_SHA: ${{ steps.evidence.outputs.eros_source_sha }}
          EROS_DIGEST: ${{ steps.evidence.outputs.eros_digest }}
        run: |
          set -euo pipefail
          [[ "$EROS_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$EROS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/akhripunov/gpoint-eros@$EROS_DIGEST"
          run_identity="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_docker_config="/run/gpoint-eros-ghcr-$run_identity"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" install -d -o root -g root -m 0700 "$remote_docker_config"
          cleanup_remote_docker_config() {
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" rm -rf -- "$remote_docker_config"
          }
          trap cleanup_remote_docker_config EXIT
          printf '%s' "$KAMAL_REGISTRY_PASSWORD" | ssh -T "root@${GPOINT_PRODUCTION_HOST}" \
            "DOCKER_CONFIG='$remote_docker_config' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin" >/dev/null
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" env DOCKER_CONFIG="$remote_docker_config" docker pull --platform linux/amd64 "$image"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" env DOCKER_CONFIG="$remote_docker_config" python3 - --mode rollback-check \
            --candidate "$EROS_SOURCE_SHA" --image "$image" --run-id "$run_identity" \
            < scripts/eros-native-database.py
      - name: Roll back consumers and then APIs with stock Kamal
        id: rollback_apply
        env:
          CORE_VERSION: ${{ steps.evidence.outputs.core_version }}
          AGATA_VERSION: ${{ steps.evidence.outputs.agata_version }}
          MINIAPP_VERSION: ${{ steps.evidence.outputs.miniapp_version }}
          CORE_DIGEST: ${{ steps.evidence.outputs.core_digest }}
          AGATA_DIGEST: ${{ steps.evidence.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ steps.evidence.outputs.miniapp_digest }}
          EROS_DIGEST: ${{ steps.evidence.outputs.eros_digest }}
          CORE_SOURCE_SHA: ${{ steps.evidence.outputs.core_source_sha }}
          AGATA_SOURCE_SHA: ${{ steps.evidence.outputs.agata_source_sha }}
          MINIAPP_SOURCE_SHA: ${{ steps.evidence.outputs.miniapp_source_sha }}
          EROS_SOURCE_SHA: ${{ steps.evidence.outputs.eros_source_sha }}
          EROS_VERSION: ${{ steps.evidence.outputs.eros_version }}
          EROS_RELAY_VERSION: ${{ steps.evidence.outputs.eros_relay_version }}
          ROLLBACK_EROS: ${{ inputs.rollback_eros }}
          TARGET_MANIFEST_SHA: ${{ steps.evidence.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          kamal() {
            local checkout="$1"; shift
            docker run --rm --volume "$GITHUB_WORKSPACE/$checkout:/workdir" --volume "$HOME/.ssh:/root/.ssh:ro" --volume "$HOME/.ssh:$HOME/.ssh:ro" --workdir /workdir \
              --env GPOINT_COMMIT_SHA --env GPOINT_APP_SOURCE_SHA --env GPOINT_PRODUCTION_HOST --env GPOINT_SSH_KEY \
              --env GPOINT_KNOWN_HOSTS_FILE --env KAMAL_REGISTRY_PASSWORD --env GPOINT_KAMAL_EXPECTED_DIGEST \
              --env GPOINT_KAMAL_SERVICE --env KAMAL_ROLES \
              ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625 "$@"
          }
          verify_role() {
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$1" "$2" "$3" \
              < "$GITHUB_WORKSPACE/scripts/verify-kamal-role.sh"
          }
          GPOINT_COMMIT_SHA="$CORE_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$CORE_SOURCE_SHA" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=worker kamal rollback-core app stop --roles worker --config-file config/deploy.yml
          GPOINT_COMMIT_SHA="$CORE_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$CORE_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$CORE_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=worker kamal rollback-core rollback "$CORE_VERSION" --roles worker --config-file config/deploy.yml
          verify_role gpoint-core-worker "$CORE_VERSION" "$CORE_SOURCE_SHA"
          GPOINT_COMMIT_SHA="$CORE_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$CORE_SOURCE_SHA" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=bot kamal rollback-core app stop --roles bot --config-file config/deploy.yml
          GPOINT_COMMIT_SHA="$CORE_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$CORE_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$CORE_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=bot kamal rollback-core rollback "$CORE_VERSION" --roles bot --config-file config/deploy.yml
          verify_role gpoint-core-bot "$CORE_VERSION" "$CORE_SOURCE_SHA"
          GPOINT_COMMIT_SHA="$AGATA_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$AGATA_SOURCE_SHA" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=memory-worker kamal rollback-agata app stop --roles memory-worker --config-file config/deploy.agata.yml
          GPOINT_COMMIT_SHA="$AGATA_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$AGATA_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=memory-worker kamal rollback-agata rollback "$AGATA_VERSION" --roles memory-worker --config-file config/deploy.agata.yml
          verify_role gpoint-agata-memory-worker "$AGATA_VERSION" "$AGATA_SOURCE_SHA"
          GPOINT_COMMIT_SHA="$MINIAPP_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$MINIAPP_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$MINIAPP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-miniapp KAMAL_ROLES=web kamal rollback-miniapp rollback "$MINIAPP_VERSION" --roles web --config-file config/deploy.miniapp.yml
          verify_role gpoint-miniapp-web "$MINIAPP_VERSION" "$MINIAPP_SOURCE_SHA"
          GPOINT_COMMIT_SHA="$AGATA_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$AGATA_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=api kamal rollback-agata rollback "$AGATA_VERSION" --roles api --config-file config/deploy.agata.yml
          verify_role gpoint-agata-api "$AGATA_VERSION" "$AGATA_SOURCE_SHA"
          GPOINT_COMMIT_SHA="$CORE_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$CORE_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$CORE_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=api kamal rollback-core rollback "$CORE_VERSION" --roles api --config-file config/deploy.yml
          verify_role gpoint-core-api "$CORE_VERSION" "$CORE_SOURCE_SHA"
          if [[ "$ROLLBACK_EROS" == true ]]; then
            [[ "$EROS_VERSION" == "$EROS_SOURCE_SHA-"* && "$EROS_RELAY_VERSION" == "$EROS_SOURCE_SHA-"* ]]
            GPOINT_COMMIT_SHA="$EROS_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$EROS_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$EROS_DIGEST" \
              GPOINT_KAMAL_SERVICE=gpoint-eros-pilot KAMAL_ROLES=engine \
              kamal . rollback "$EROS_VERSION" --roles engine --config-file config/deploy.eros.yml
            verify_role gpoint-eros-pilot-engine "$EROS_VERSION" "$EROS_SOURCE_SHA"
            GPOINT_COMMIT_SHA="$EROS_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$EROS_SOURCE_SHA" GPOINT_KAMAL_SERVICE=gpoint-eros-relay KAMAL_ROLES=relay \
              kamal . app stop --roles relay --config-file config/deploy.eros-relay.yml
            GPOINT_COMMIT_SHA="$EROS_SOURCE_SHA" GPOINT_APP_SOURCE_SHA="$EROS_SOURCE_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$CORE_DIGEST" \
              GPOINT_KAMAL_SERVICE=gpoint-eros-relay KAMAL_ROLES=relay \
              kamal . rollback "$EROS_RELAY_VERSION" --roles relay --config-file config/deploy.eros-relay.yml
            verify_role gpoint-eros-relay-relay "$EROS_RELAY_VERSION" "$EROS_SOURCE_SHA"
          fi
      - name: Verify rollback Runtime and preserve databases before SUCCESS
        id: verify
        env:
          TARGET_SHA: ${{ inputs.rollback_target_sha }}
          CORE_VERSION: ${{ steps.evidence.outputs.core_version }}
          AGATA_VERSION: ${{ steps.evidence.outputs.agata_version }}
          MINIAPP_VERSION: ${{ steps.evidence.outputs.miniapp_version }}
          CORE_DIGEST: ${{ steps.evidence.outputs.core_digest }}
          AGATA_DIGEST: ${{ steps.evidence.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ steps.evidence.outputs.miniapp_digest }}
          DB_CONTAINER_ID: ${{ steps.baseline.outputs.DB_CONTAINER_ID }}
          REDIS_CONTAINER_ID: ${{ steps.baseline.outputs.REDIS_CONTAINER_ID }}
          DB_MOUNTS_SHA256: ${{ steps.baseline.outputs.DB_MOUNTS_SHA256 }}
          REDIS_MOUNTS_SHA256: ${{ steps.baseline.outputs.REDIS_MOUNTS_SHA256 }}
          CORE_SOURCE_SHA: ${{ steps.evidence.outputs.core_source_sha }}
          AGATA_SOURCE_SHA: ${{ steps.evidence.outputs.agata_source_sha }}
          MINIAPP_SOURCE_SHA: ${{ steps.evidence.outputs.miniapp_source_sha }}
          EROS_SOURCE_SHA: ${{ steps.evidence.outputs.eros_source_sha }}
          EROS_VERSION: ${{ steps.evidence.outputs.eros_version }}
          EROS_RELAY_VERSION: ${{ steps.evidence.outputs.eros_relay_version }}
          EROS_DIGEST: ${{ steps.evidence.outputs.eros_digest }}
          ROLLBACK_EROS: ${{ inputs.rollback_eros }}
          TARGET_MANIFEST_SHA: ${{ steps.evidence.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          curl --retry 8 --retry-connrefused --retry-delay 3 --fail --silent --show-error https://gpoint.one/api/health/live | grep -F '"status":"ok"' >/dev/null
          for path in / /creators; do curl --retry 5 --retry-connrefused --retry-delay 2 --fail --silent --show-error "https://gpoint.one$path" | grep -F '<div id="root">' >/dev/null; done
          media_body="$RUNNER_TEMP/gpoint-rollback/media-route.json"
          media_status="$(curl --retry 5 --retry-connrefused --retry-delay 2 --silent --show-error --output "$media_body" --write-out '%{http_code}' https://gpoint.one/media/assets/kamal-route-verification-missing)"
          test "$media_status" = 404 && grep -Fq '"message":"media not found"' "$media_body"
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$TARGET_SHA" "$CORE_VERSION" "$AGATA_VERSION" "$MINIAPP_VERSION" "$CORE_SOURCE_SHA" "$AGATA_SOURCE_SHA" "$MINIAPP_SOURCE_SHA" "$CORE_DIGEST" "$AGATA_DIGEST" "$MINIAPP_DIGEST" "$DB_CONTAINER_ID" "$REDIS_CONTAINER_ID" "$DB_MOUNTS_SHA256" "$REDIS_MOUNTS_SHA256" <<'REMOTE'
          set -euo pipefail
          core_version="$2"; agata_version="$3"; miniapp_version="$4"; core_sha="$5"; agata_sha="$6"; miniapp_sha="$7"; dbid="${11}"; redisid="${12}"; dbmount="${13}"; redismount="${14}"
          test "$(docker inspect --format '{{.Id}}' shared_postgres_1)" = "$dbid"
          test "$(docker inspect --format '{{.Id}}' shared_redis_1)" = "$redisid"
          test "$(docker inspect --format '{{.State.Running}}' shared_postgres_1)" = true
          test "$(docker inspect --format '{{.State.Running}}' shared_redis_1)" = true
          test "$(docker inspect --format '{{.State.Running}}' kamal-proxy)" = true
          test "$(docker ps -q --filter 'name=^/kamal-proxy$' | wc -l | tr -d ' ')" = 1
          for item in "gpoint-core-api|ghcr.io/akhripunov/gpoint-runtime@$8|$core_version|$core_sha" "gpoint-core-worker|ghcr.io/akhripunov/gpoint-runtime@$8|$core_version|$core_sha" "gpoint-core-bot|ghcr.io/akhripunov/gpoint-runtime@$8|$core_version|$core_sha" "gpoint-agata-api|ghcr.io/akhripunov/gpoint-agata-runtime@$9|$agata_version|$agata_sha" "gpoint-agata-memory-worker|ghcr.io/akhripunov/gpoint-agata-runtime@$9|$agata_version|$agata_sha" "gpoint-miniapp-web|ghcr.io/akhripunov/gpoint-miniapp@${10}|$miniapp_version|$miniapp_sha"; do
            IFS='|' read -r prefix expected version source_sha <<< "$item"
            name="$prefix-$version"
            test "$(docker ps -q --filter "name=^/${prefix}-" | wc -l | tr -d ' ')" = 1
            test "$(docker ps -q --filter "name=^/$name$" | wc -l | tr -d ' ')" = 1
            test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$name")" = "$source_sha"
            image="$(docker inspect --format '{{.Image}}' "$name")"; docker image inspect "$image" --format '{{json .RepoDigests}}' | grep -F "$expected" >/dev/null
          done
          fingerprint() { docker inspect "$1" --format '{{json .Mounts}}' | python3 -c 'import hashlib,json,sys; a=json.load(sys.stdin); r=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a),key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert r and all(x["Source"] and x["Destination"] for x in r); print(hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":")).encode()).hexdigest())'; }
          test "$(fingerprint shared_postgres_1)" = "$dbmount"
          test "$(fingerprint shared_redis_1)" = "$redismount"
          docker exec "gpoint-core-api-$core_version" node -e "fetch('http://127.0.0.1:3000/health/live').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
          test "$(docker exec "gpoint-core-api-$core_version" node -p 'process.env.RELEASE_SHA || ""')" = "$core_sha"
          test "$(docker exec "gpoint-core-worker-$core_version" node -p 'process.env.RELEASE_SHA || ""')" = "$core_sha"
          test "$(docker exec "gpoint-core-bot-$core_version" node -p 'process.env.RELEASE_SHA || ""')" = "$core_sha"
          docker top "gpoint-core-worker-$core_version" -eo pid,args | grep -F "apps/worker/dist/main.js"
          docker top "gpoint-core-bot-$core_version" -eo pid,args | grep -F "apps/bot/dist/main.js"
          docker exec "gpoint-agata-api-$agata_version" python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3).status==200"
          docker exec "gpoint-agata-memory-worker-$agata_version" python -m app.memory.worker --healthcheck
          test "$(docker exec "gpoint-agata-api-$agata_version" python -c 'import os; print(os.environ.get("RELEASE_SHA", ""))')" = "$agata_sha"
          test "$(docker exec "gpoint-agata-memory-worker-$agata_version" python -c 'import os; print(os.environ.get("RELEASE_SHA", ""))')" = "$agata_sha"
          docker exec "gpoint-miniapp-web-$miniapp_version" wget --spider --quiet http://127.0.0.1/
          docker exec "gpoint-core-api-$core_version" node -e 'const fs=require("node:fs");const p="/data/media/.gpoint-rollback-"+require("node:crypto").randomUUID();let created=false;try{fs.writeFileSync(p,"ok",{flag:"wx"});created=true;if(fs.readFileSync(p,"utf8")!=="ok")process.exit(1)}finally{if(created)fs.unlinkSync(p)}'
          media_mounts="$(docker inspect "gpoint-core-api-$core_version" --format '{{json .Mounts}}')"
          python3 - "$media_mounts" <<'PY'
          import json,sys
          rows=[m for m in json.loads(sys.argv[1]) if m.get('Destination') == '/data/media']
          if len(rows)!=1 or rows[0].get('Type')!='bind' or rows[0].get('Source')!='/opt/gpoint/media' or rows[0].get('RW') is not True: raise SystemExit('media mount identity changed')
          PY
          docker exec kamal-proxy kamal-proxy list | grep -F 'gpoint-miniapp' >/dev/null
          docker exec kamal-proxy kamal-proxy list | grep -F 'gpoint-core' >/dev/null
          runtime_db="$(docker exec --workdir /app/apps/api "gpoint-core-api-$core_version" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const r=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const a=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(a.length!==1)throw Error("AGATA head not singular");console.log("PRISMA_HEAD="+(r.length?r[r.length-1].migration_name:"NONE"));console.log("PRISMA_MIGRATIONS="+r.map(x=>x.migration_name).join(","));console.log("PRISMA_CHECKSUMS="+r.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("AGATA_HEAD="+a[0].version_num)}catch(e){console.error("POST_ROLLBACK_DB_VERIFY_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          printf '%s\n' "$runtime_db"
          echo ROLLBACK_RUNTIME_VERIFY=PASS
          REMOTE
          )"
          grep -Fq 'ROLLBACK_RUNTIME_VERIFY=PASS' <<< "$facts"
          python3 "$GITHUB_WORKSPACE/scripts/verify-kamal-migration-parity.py" \
            --prisma-directory "$GITHUB_WORKSPACE/rollback-core/packages/db/prisma/migrations" \
            --prisma-current-migrations "$(sed -n 's/^PRISMA_MIGRATIONS=//p' <<< "$facts")" \
            --prisma-current-checksums "$(sed -n 's/^PRISMA_CHECKSUMS=//p' <<< "$facts")" \
            --prisma-current-head "$(sed -n 's/^PRISMA_HEAD=//p' <<< "$facts")" \
            --agata-directory "$GITHUB_WORKSPACE/rollback-agata/services/agata/migrations/versions" \
            --agata-current-head "$(sed -n 's/^AGATA_HEAD=//p' <<< "$facts")"
          if [[ "$ROLLBACK_EROS" == true ]]; then
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$EROS_VERSION" "$EROS_RELAY_VERSION" \
              "$EROS_SOURCE_SHA" "ghcr.io/akhripunov/gpoint-eros@$EROS_DIGEST" \
              "ghcr.io/akhripunov/gpoint-runtime@$CORE_DIGEST" <<'REMOTE_EROS_VERIFY'
          set -euo pipefail
          for item in "gpoint-eros-pilot-engine|$1|$3|$4|com.gpoint.source.revision" \
                      "gpoint-eros-relay-relay|$2|$3|$5|org.opencontainers.image.revision"; do
            IFS='|' read -r prefix version source image label <<< "$item"
            name="$prefix-$version"
            test "$(docker ps -q --filter "name=^/$name$")" != ""
            test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
            test "$(docker inspect --format "{{index .Config.Labels \"$label\"}}" "$name")" = "$source"
            image_id="$(docker inspect --format '{{.Image}}' "$name")"
            docker image inspect "$image_id" --format '{{json .RepoDigests}}' | grep -F "$image" >/dev/null
          done
          docker exec "gpoint-eros-pilot-engine-$1" curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null
          docker exec "gpoint-eros-relay-relay-$2" node -e "fetch('http://172.31.254.1:11434/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          echo EROS_ROLLBACK_RUNTIME_VERIFY=PASS
          REMOTE_EROS_VERIFY
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - --mode verify-unchanged \
              --candidate "$EROS_SOURCE_SHA" --image "ghcr.io/akhripunov/gpoint-eros@$EROS_DIGEST" \
              --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" < scripts/eros-native-database.py
          fi
          environment_url="https://gpoint.one/#gpoint-manifest-sha256=$TARGET_MANIFEST_SHA&gpoint-runtime-target-sha=$TARGET_SHA&gpoint-core-source-sha=$CORE_SOURCE_SHA&gpoint-agata-source-sha=$AGATA_SOURCE_SHA&gpoint-miniapp-source-sha=$MINIAPP_SOURCE_SHA"
          if [[ "$ROLLBACK_EROS" == true ]]; then environment_url+="&gpoint-eros-source-sha=$EROS_SOURCE_SHA"; fi
          printf 'environment_url=%s\n' "$environment_url" >> "$GITHUB_OUTPUT"
          echo "GPOINT_ROLLBACK_VERIFY=PASS SHA=$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark failed partial rollback for read-only recovery
        if: always() && (steps.rollback_apply.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          APPLY_OUTCOME: ${{ steps.rollback_apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          echo "RECOVERY_REQUIRED: rollback apply/verify did not PASS; no automatic rollback or second Apply. Confirm live topology read-only before another production mutation." >> "$GITHUB_STEP_SUMMARY"
