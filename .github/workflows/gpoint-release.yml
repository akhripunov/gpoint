            echo WORKER_TUNNEL_PROXY=PASS
          fi
          runtime_db="$(docker exec --workdir /app/apps/api "gpoint-core-api-$core_version" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const failed=await db.$queryRawUnsafe("SELECT count(*)::int AS count FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL");if(failed[0].count!==0)throw Error("unfinished Prisma migration exists");const r=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");console.log("PRISMA_HEAD="+(r.length?r[r.length-1].migration_name:"NONE"));console.log("PRISMA_MIGRATIONS="+r.map(x=>x.migration_name).join(","));console.log("PRISMA_CHECKSUMS="+r.map(x=>x.migration_name+"="+x.checksum).join(","))}catch(e){console.error("POST_ROLLBACK_DB_VERIFY_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          printf '%s\n' "$runtime_db"
          echo ROLLBACK_RUNTIME_VERIFY=PASS
          REMOTE
          )"
          grep -Fq 'ROLLBACK_RUNTIME_VERIFY=PASS' <<< "$facts"
          python3 "$GITHUB_WORKSPACE/scripts/verify-kamal-migration-parity.py" \
            --prisma-only \
            --prisma-directory "$GITHUB_WORKSPACE/rollback-core/packages/db/prisma/migrations" \
            --prisma-current-migrations "$(sed -n 's/^PRISMA_MIGRATIONS=//p' <<< "$facts")" \
            --prisma-current-checksums "$(sed -n 's/^PRISMA_CHECKSUMS=//p' <<< "$facts")" \
            --prisma-current-head "$(sed -n 's/^PRISMA_HEAD=//p' <<< "$facts")"
          if [[ "$ROLLBACK_EROS" == true ]]; then
            model_digest="$(python3 -c 'import json; print(json.load(open("services/eros-engine/ollama-model.lock.json"))["digest"])')"
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - "$model_digest" < scripts/verify-layer7-ollama.py
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - --mode verify-unchanged \
              --candidate "$EROS_SOURCE_SHA" --image "ghcr.io/akhripunov/gpoint-eros@$EROS_DIGEST" \
              --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" < scripts/eros-native-database.py
            echo 'EROS_ROLLBACK_RUNTIME_VERIFY=PASS'
          fi
          environment_url="https://gpoint.one/#gpoint-manifest-sha256=$TARGET_MANIFEST_SHA&gpoint-runtime-target-sha=$TARGET_SHA&gpoint-core-source-sha=$CORE_SOURCE_SHA&gpoint-miniapp-source-sha=$MINIAPP_SOURCE_SHA"
          if [[ "$ROLLBACK_EROS" == true ]]; then environment_url+="&gpoint-eros-source-sha=$EROS_SOURCE_SHA"; fi
          printf 'environment_url=%s\n' "$environment_url" >> "$GITHUB_OUTPUT"
          echo "GPOINT_ROLLBACK_VERIFY=PASS SHA=$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark failed partial rollback for read-only recovery
        if: ((always() && (steps.rollback_apply.outcome == 'failure' || steps.rollback_verify.outcome == 'failure')) && inputs.mode == 'rollback')
        env:
          APPLY_OUTCOME: ${{ steps.rollback_apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.rollback_verify.outcome }}
        run: |
          set -euo pipefail
          echo "RECOVERY_REQUIRED: rollback apply/verify did not PASS; no automatic rollback or second Apply. Confirm live topology read-only before another production mutation." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified GitHub production Deployment
        if: (inputs.mode != 'rollback' && steps.verify.outcome == 'success')
        id: deployment_success
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          ENVIRONMENT_URL: ${{ steps.verify.outputs.environment_url }}
          MANIFEST_SHA: ${{ steps.verify.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ENVIRONMENT_URL" == "https://gpoint.one/#gpoint-manifest-sha256=$MANIFEST_SHA"* ]]
          log_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(jq -nc --arg log "$log_url" --arg url "$ENVIRONMENT_URL" --arg sha "$CANDIDATE_SHA" --arg manifest "$MANIFEST_SHA" \
            '{state: "success", environment: "production", log_url: $log, environment_url: $url, description: ("Kamal success SHA " + $sha + " manifest " + $manifest)}')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input - <<< "$body" | jq -e '.state == "success"' >/dev/null
          echo "GPOINT_DEPLOYMENT_SUCCESS=$DEPLOYMENT_ID SHA=$CANDIDATE_SHA MANIFEST_SHA=$MANIFEST_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish unsuccessful GitHub production Deployment
        if: (always() && inputs.mode != 'rollback' && steps.deployment.outputs.id != '' && steps.deployment_success.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ID" =~ ^[1-9][0-9]*$ ]]
          log_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(jq -nc --arg log "$log_url" '{state: "failure", environment: "production", log_url: $log, description: "Kamal release did not complete verified success"}')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input - <<< "$body" | jq -e '.state == "failure"' >/dev/null
          echo "GPOINT_DEPLOYMENT_FAILURE=$DEPLOYMENT_ID RECOVERY_REQUIRED=read-only-reconciliation" >> "$GITHUB_STEP_SUMMARY"

