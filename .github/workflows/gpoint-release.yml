name: GPoint Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      approve_production:
        description: I authorize this exact candidate SHA on GPoint production
        required: true
        default: false
        type: boolean
      mode:
        description: 'deploy applies the candidate; rollback returns to a verified prior release'
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      rollback_eros:
        description: 'Also roll back the Eros image after isolated SQLx compatibility verification'
        required: true
        default: false
        type: boolean
      rollback_target_sha:
        description: 'Exact target source SHA from a successful Native production deployment'
        required: false
        type: string
      rollback_deployment_id:
        description: 'Exact successful GitHub production Deployment ID for the target SHA'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  # Serialize production baseline reads, Build and Apply as one transaction.
  # PR validation has its own group and cannot occupy the release queue.
  group: gpoint-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'native-production-transaction' }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (${{ matrix.suite }})
    permissions:
      contents: read
      deployments: read
      actions: read
      pull-requests: read
    # Both required suites compute identical release intent outputs.
    outputs:
      mode: ${{ steps.intent.outputs.mode }}
      deploy: ${{ steps.intent.outputs.deploy }}
    # Playwright's --with-deps package list is not available on the moving
    # ubuntu-latest image; pin the test matrix to its supported Ubuntu image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, python]
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: gpoint
          POSTGRES_USER: gpoint
          POSTGRES_PASSWORD: gpoint_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpoint -d gpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint
      SHADOW_DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint_shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter changed components
        id: filter
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          token: ${{ github.token }}
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters/native-release.json
      - name: Read pinned Eros upstream source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(cat services/eros-engine/upstream.sha)"
          [[ "$upstream" =~ ^[0-9a-f]{40}$ ]]
          echo "EROS_UPSTREAM_SHA=$upstream" >> "$GITHUB_ENV"
      - name: Fail closed unless the event and complete path set allow a release
        id: intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          REQUESTED_SHA: ${{ inputs.candidate_sha || github.sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          MODE: ${{ inputs.mode || 'deploy' }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production || false }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT_NAME" --ref "$EVENT_REF" --sha "$EVENT_SHA"
            --before "$EVENT_BEFORE"
            --candidate-sha "$REQUESTED_SHA" --actor "$EVENT_ACTOR"
            --triggering-actor "$EVENT_TRIGGERING_ACTOR"
            --repository-owner "$REPOSITORY_OWNER")
          [[ -n "$EVENT_COMMIT_MESSAGE" ]] && args+=(--commit-message "$EVENT_COMMIT_MESSAGE")
          [[ "$MODE" == rollback ]] && args+=(--rollback)
          [[ "$APPROVE_PRODUCTION" == true ]] && args+=(--approve-production)
          python3 scripts/native_release_intent.py "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Verify production Environment allows direct Deployment records
        if: matrix.suite == 'python' && (inputs.mode != 'rollback')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read-only. Reject unknown/custom app protection rules before changing main.
          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/production")"
          jq -e '
            .name == "production" and
            ([.protection_rules[]?.type] | all(. == "required_reviewers" or . == "wait_timer" or . == "branch_policy"))
          ' <<< "$environment_json" >/dev/null
          echo "GPOINT_DIRECT_DEPLOYMENT_ENVIRONMENT=PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Seed pinned Go 1.25.3 in Actions tool cache
        if: matrix.suite == 'workspace'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-1.25.3-linux-x64.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/actions/go-versions/releases/assets/303957986 \
            --output "$archive"
          echo "1b6c5c84f587ab036ca904638a39cf4bd272d1e8d439eb9c8bc60f91793e0765  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TOOL_CACHE/go/1.25.3/x64"
          tar -xzf "$archive" -C "$RUNNER_TOOL_CACHE/go/1.25.3/x64"
          test "$("$RUNNER_TOOL_CACHE/go/1.25.3/x64/bin/go" version)" = 'go version go1.25.3 linux/amd64'
          touch "$RUNNER_TOOL_CACHE/go/1.25.3/x64.complete"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: matrix.suite == 'workspace'
        with:
          go-version: '1.25.3'
      - name: Validate GitHub Actions workflow
        if: matrix.suite == 'workspace'
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          .github/workflows/gpoint-release.yml
      - name: Validate pinned Kamal configs and shared proxy routing
        if: matrix.suite == 'workspace'
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          ./scripts/check-kamal-configs.sh
          ./scripts/test-kamal-proxy-integration.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: matrix.suite == 'workspace'
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.suite == 'workspace'
        with:
          node-version: 22
          cache: pnpm
      - name: Verify pinned pnpm
        if: matrix.suite == 'workspace'
        run: test "$(pnpm --version)" = "9.15.0"
      - name: Install workspace dependencies
        if: matrix.suite == 'workspace'
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and apply test migrations
        if: matrix.suite == 'workspace'
        run: |
          pnpm --filter @gpoint/db exec prisma generate
          pnpm --filter @gpoint/db exec prisma migrate deploy
          command -v createdb
          createdb --maintenance-db="$DATABASE_URL" --owner=gpoint gpoint_shadow
          pnpm --filter @gpoint/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
          pnpm --filter @gpoint/db exec prisma migrate deploy
          pnpm --filter @gpoint/db exec prisma migrate status
      - name: Build and typecheck workspace
        if: matrix.suite == 'workspace'
        run: |
          pnpm -r build
          pnpm -r typecheck
      - name: Run workspace tests
        if: matrix.suite == 'workspace'
        run: pnpm -r --if-present test
      - name: Validate Eros test harness without Docker builds
        if: matrix.suite == 'workspace'
        run: node --test services/eros-engine/local-e2e.test.mjs
      - name: Run canonical release and static-parent tests
        if: matrix.suite == 'workspace'
        run: |
          pnpm test:release
      - name: Install Playwright Chromium
        if: matrix.suite == 'workspace' && (steps.filter.outputs.miniapp == 'true' || steps.filter.outputs.integration_infrastructure == 'true' || steps.filter.outputs.database == 'true' || github.event_name == 'workflow_dispatch' || github.event.before == '0000000000000000000000000000000000000000')
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Mini App end-to-end tests
        if: matrix.suite == 'workspace' && (steps.filter.outputs.miniapp == 'true' || steps.filter.outputs.integration_infrastructure == 'true' || steps.filter.outputs.database == 'true' || github.event_name == 'workflow_dispatch' || github.event.before == '0000000000000000000000000000000000000000')
        run: pnpm test:e2e
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: matrix.suite == 'python'
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        if: matrix.suite == 'python'
        run: unset DATABASE_URL SHADOW_DATABASE_URL; python -m pip install 'pytest==9.1.1' 'alembic==1.16.5' 'PyYAML==6.0.2'
      - name: Test Native image read-back validation
        if: matrix.suite == 'python'
        run: |
          unset DATABASE_URL SHADOW_DATABASE_URL
          python tests/test_native_image_readback.py
          python tests/test_native_image_attestation.py
          python tests/test_native_eros_image.py
      - name: Install pinned ORAS for release evidence round-trip test
        if: matrix.suite == 'python'
        run: |
          set -euo pipefail
          unset DATABASE_URL SHADOW_DATABASE_URL
          archive="$RUNNER_TEMP/oras_1.3.0_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/oras-1.3.0"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --header 'Accept: application/octet-stream' \
            https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64' "$archive" \
            | sha256sum --check --status
          install -d "$install_dir"
          tar -xzf "$archive" -C "$install_dir" oras
          chmod 0755 "$install_dir/oras"
          "$install_dir/oras" version | grep -E 'Version:[[:space:]]+1\.3\.0([[:space:]]|$)' >/dev/null
          echo "ORAS_1_3_BIN=$install_dir/oras" >> "$GITHUB_ENV"
      - name: Detect pending schema dependencies before Build
        if: matrix.suite == 'python' && (steps.filter.outputs.database == 'true' || steps.filter.outputs.integration_infrastructure == 'true' || github.event_name == 'workflow_dispatch' || github.event.before == '0000000000000000000000000000000000000000')
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Base per event: the PR target, the last successful production
          # deployment (so previously added but unapplied migrations are still
          # scanned), else the push predecessor. A manual dispatch has no
          # predecessor and never blocks on an unknown base.
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            *) base="$(gh api "repos/$REPOSITORY/deployments?environment=production&per_page=1" \
                 --jq '.[0].sha // empty' 2>/dev/null || true)"
               [ -n "$base" ] || base="$EVENT_BEFORE" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "$HEAD_SHA" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              base="$(git rev-parse --verify --quiet "$HEAD_SHA^")" || base=""
            fi
          fi
          if [ -z "$base" ]; then
            echo "GPOINT_KAMAL_SCHEMA_DEPENDENCY=SKIPPED reason=no_base_revision event=$EVENT_NAME"
            exit 0
          fi
          git cat-file -e "$base^{commit}" 2>/dev/null || {
            echo "GPOINT_KAMAL_SCHEMA_DEPENDENCY=SKIPPED reason=base_not_in_checkout event=$EVENT_NAME base=$base"
            exit 0
          }
          python3 scripts/verify-kamal-migration-parity.py --static-pending \
            --repo-root . --baseline-source-sha "$base" --candidate-source-sha "$HEAD_SHA" \
            --prisma-directory packages/db/prisma/migrations
      - name: Run workflow, Native First and Kamal boundary tests
        if: matrix.suite == 'python'
        run: >-
          unset DATABASE_URL SHADOW_DATABASE_URL; python -m pytest -q
          tests/test_simple_release_architecture.py
          tests/test_native_build_boundary.py
          tests/test_native_change_surface.py
          tests/test_docker_dependency_manifests.py
          tests/test_prepush_runner.py
          tests/test_release_scope_consistency.py
          tests/test_ci_integration_scope.py
          tests/test_release_routing_matrix.py
          tests/test_backup_install_script.py
          tests/test_backup_restore_readiness.py tests/test_gpoint_scheduled_backup.py
          tests/test_native_release_intent.py
          tests/test_kamal_migration_parity_dependencies.py
          tests/test_release_pre_push_mode.py
          tests/test_native_prisma_apply_boundary.py
          tests/test_prisma_migration_release_plan.py
          tests/test_eros_pilot_no_agata_transfer.py
          tests/test_kamal_native_automatic_release.py
          tests/test_eros_native_database_workflow.py
          tests/test_layer7_ollama_verifier.py
          tests/test_verify_kamal_production_baseline.py
          tests/test_native_rollback_evidence.py
          tests/test_native_environment_deployment.py
          tests/test_kamal_release_config.py
          tests/test_kamal_ordinary_manifest.py
          tests/test_pinned_kamal_invoker.py
          tests/test_native_remote_role_verification.py
      - name: Run isolated PostgreSQL 16 migration and integration suites
        if: matrix.suite == 'python' && (steps.filter.outputs.database == 'true' || steps.filter.outputs.integration_infrastructure == 'true' || github.event_name == 'workflow_dispatch' || github.event.before == '0000000000000000000000000000000000000000')
        run: |
          unset DATABASE_URL SHADOW_DATABASE_URL
          python tests/integration/gpoint-chat-schema-docker.py --image pgvector/pgvector:0.8.6-pg16

  build:
    name: Build and publish immutable images
    needs: [tests]
    if: >-
      !cancelled() && needs.tests.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      needs.tests.outputs.mode == 'DEPLOY' && needs.tests.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      miniapp_digest: ${{ steps.miniapp.outputs.digest }}
      eros_digest: ${{ steps.eros.outputs.digest }}
      image_version: ${{ steps.image_version.outputs.image_version }}
      app_image_bytes: ${{ steps.image_readback.outputs.app_image_bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned Eros upstream source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(cat services/eros-engine/upstream.sha)"
          [[ "$upstream" =~ ^[0-9a-f]{40}$ ]]
          echo "EROS_UPSTREAM_SHA=$upstream" >> "$GITHUB_ENV"
      - name: Select exact immutable image version
        id: image_version
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CURRENT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          image_version="${CANDIDATE_SHA}-${CURRENT_RUN_ID}-${CURRENT_RUN_ATTEMPT}"
          printf 'image_version=%s\n' "$image_version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          platforms: linux/amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - name: Build and publish immutable runtime image
        id: app
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          target: runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-core
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable Mini App image
        id: miniapp
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          target: miniapp-runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-miniapp
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-miniapp,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish stock Eros image
        id: eros
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/etherfunlab/eros-engine.git#${{ env.EROS_UPSTREAM_SHA }}
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-eros:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-eros:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/etherfunlab/eros-engine
            org.opencontainers.image.revision=${{ env.EROS_UPSTREAM_SHA }}
            com.gpoint.source.revision=${{ github.sha }}
            com.gpoint.eros.upstream-revision=${{ env.EROS_UPSTREAM_SHA }}
            com.gpoint.eros.patch-set.sha256=none
            service=gpoint-eros-pilot
          cache-from: type=gha,scope=gpoint-eros-release,timeout=30s
          cache-to: type=gha,scope=gpoint-eros-release,mode=max,timeout=45s,ignore-error=true
          sbom: true
          provenance: mode=max
      - name: Validate immutable image identity and expose digests
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
          EROS_DIGEST: ${{ steps.eros.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['CANDIDATE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate SHA is not exact')
          for component, name in {'CORE': 'APP_DIGEST', 'MINIAPP': 'MINIAPP_DIGEST', 'EROS': 'EROS_DIGEST'}.items():
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable OCI digest')
          for component, name in {'CORE': 'APP_DIGEST', 'MINIAPP': 'MINIAPP_DIGEST', 'EROS': 'EROS_DIGEST'}.items():
              image = "ghcr.io/akhripunov/" + ("gpoint-runtime" if component == "CORE" else "gpoint-miniapp" if component == "MINIAPP" else "gpoint-eros") + "@" + os.environ[name]
              line = f"GPOINT_IMAGE_DIGEST {component} {image}"
              print(line)
              print(f"{component}_IMAGE={image}", file=open(os.environ['GITHUB_STEP_SUMMARY'], 'a'))
          PY
      - name: Read back exact published images and verify candidate identity
        id: image_readback
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
          EROS_DIGEST: ${{ steps.eros.outputs.digest }}
        run: |
          set -euo pipefail
          for role in app miniapp eros; do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST"; expected_service=gpoint-core ;;
              miniapp) image=ghcr.io/akhripunov/gpoint-miniapp; digest="$MINIAPP_DIGEST"; expected_service=gpoint-miniapp ;;
              eros) image=ghcr.io/akhripunov/gpoint-eros; digest="$EROS_DIGEST"; expected_service=gpoint-eros-pilot ;;
            esac
            docker pull --platform linux/amd64 "$image@$digest"
            test "$(docker image inspect --format '{{index .Config.Labels "service"}}' "$image@$digest")" = "$expected_service"
            docker pull --platform linux/amd64 "$image:$IMAGE_VERSION"
            docker image inspect "$image:$IMAGE_VERSION" --format '{{json .RepoDigests}}' | grep -F "$image@$digest" >/dev/null
            docker image inspect --format '{{json .}}' "$image@$digest" > "$RUNNER_TEMP/$role-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-provenance.json"
            if [[ "$role" == eros ]]; then
              python3 scripts/verify_native_eros_image.py \
                "$RUNNER_TEMP/$role-image.json" "$RUNNER_TEMP/$role-sbom.json" \
                "$RUNNER_TEMP/$role-provenance.json" "$digest" "$CANDIDATE_SHA"
            else
              python3 scripts/verify_native_image_readback.py \
                "$RUNNER_TEMP/$role-image.json" "$image" "$digest" "$CANDIDATE_SHA"
              python3 scripts/verify_native_image_attestation.py \
                "$RUNNER_TEMP/$role-sbom.json" "$RUNNER_TEMP/$role-provenance.json" \
                "$CANDIDATE_SHA" https://github.com/akhripunov/gpoint.git
            fi
          done
          image_bytes="$(docker image inspect "ghcr.io/akhripunov/gpoint-runtime@$APP_DIGEST" --format '{{.Size}}')"
          [[ "$image_bytes" =~ ^[0-9]+$ ]]
          echo "app_image_bytes=$image_bytes" >> "$GITHUB_OUTPUT"

  deploy:
    name: Kamal production Deploy and Verify
    needs: [tests, build]
    if: >-
      always() && !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.tests.result == 'success' && needs.tests.outputs.deploy == 'true' &&
         needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
         github.actor == github.repository_owner && needs.tests.result == 'success' &&
         (
           (inputs.mode == 'deploy' && needs.tests.outputs.mode == 'DEPLOY' &&
            needs.tests.outputs.deploy == 'true' && needs.build.result == 'success') ||
           (inputs.mode == 'rollback' && needs.tests.outputs.mode == 'ROLLBACK' &&
            needs.tests.outputs.deploy == 'true' &&
            (needs.build.result == 'success' || needs.build.result == 'skipped'))
         ))
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      # Rollbacks retain native GitHub deployments. Ordinary deploys create exact API records only after preflight.
      deployment: ${{ inputs.mode == 'rollback' }}
      url: ${{ inputs.mode == 'rollback' && steps.rollback_verify.outputs.environment_url || steps.verify.outputs.environment_url }}
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      actions: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      IMAGE_VERSION: ${{ needs.build.outputs.image_version }}
      GPOINT_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      GPOINT_APP_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact SHA, current main and owner approval
        if: (inputs.mode != 'rollback')
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production || false }}
          OWNER_APPROVAL_ACTOR: ${{ github.actor }}
          OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER_REPOSITORY: ${{ github.repository_owner }}
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$APPROVE_PRODUCTION" = true
            test "$OWNER_APPROVAL_ACTOR" = "$OWNER_REPOSITORY" || {
              echo 'production release actor must match the repository owner' >&2; exit 1;
            }
            test "$OWNER_TRIGGERING_ACTOR" = "$OWNER_REPOSITORY" || {
              echo 'production release triggering actor must match the repository owner' >&2; exit 1;
            }
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$OWNER_APPROVAL_ACTOR" = "$OWNER_REPOSITORY" || {
              echo 'production push actor must match the repository owner' >&2; exit 1;
            }
            test "$OWNER_TRIGGERING_ACTOR" = "$OWNER_REPOSITORY" || {
              echo 'production push triggering actor must match the repository owner' >&2; exit 1;
            }
          else
            echo 'unsupported production release event' >&2; exit 1
          fi
          test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
          if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'candidate SHA must be exactly 40 lowercase hexadecimal characters' >&2; exit 1;
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REQUESTED_SHA"
      - name: Install verified Kamal SSH credentials
        env:
          GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$GPOINT_PRODUCTION_HOST" || { echo 'GPOINT_KAMAL_HOST is required' >&2; exit 1; }
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$VERIFIED_KNOWN_HOSTS" ]]; then
            echo 'required production SSH credentials are missing' >&2; exit 1;
          fi
          [[ "$GPOINT_PRODUCTION_HOST" == "95.133.236.59" ]] || {
            echo 'production target must match the verified Layer7 address' >&2; exit 1;
          }
          GPOINT_KNOWN_HOSTS_PREFLIGHT="$(mktemp "$RUNNER_TEMP/gpoint-known-hosts.XXXXXX")"
          trap 'rm -f "$GPOINT_KNOWN_HOSTS_PREFLIGHT"' EXIT
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$GPOINT_KNOWN_HOSTS_PREFLIGHT"
          chmod 600 "$GPOINT_KNOWN_HOSTS_PREFLIGHT"
          if ! ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$GPOINT_KNOWN_HOSTS_PREFLIGHT" >/dev/null; then
            echo 'Layer7 SSH host key is not pinned for the production target' >&2; exit 1;
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 "$GPOINT_KNOWN_HOSTS_PREFLIGHT" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/config" <<EOF
          Host ${GPOINT_PRODUCTION_HOST}
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 "$HOME/.ssh/config"
          {
            echo "GPOINT_PRODUCTION_HOST=$GPOINT_PRODUCTION_HOST"
            echo "GPOINT_SSH_KEY=/root/.ssh/id_ed25519"
            echo "GPOINT_KNOWN_HOSTS_FILE=/root/.ssh/known_hosts"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Pull and verify pinned Kamal CLI image
        timeout-minutes: 5
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$KAMAL_IMAGE"
          echo "KAMAL_IMAGE_PULL=PASS PLATFORM=linux/amd64 DIGEST=sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625"
      - name: Audit existing GPoint Telegram token sources once (read only)
        if: github.event_name == 'push' && inputs.mode != 'rollback'
        env:
          TOKEN_SOURCE_BEFORE_SHA: ${{ github.event.before || '' }}
          GH_TELEGRAM_BOT_TOKEN_EXISTS: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          GH_GPOINT_TELEGRAM_BOT_TOKEN_EXISTS: ${{ secrets.GPOINT_TELEGRAM_BOT_TOKEN != '' }}
          GH_GPOINT_BOT_TOKEN_EXISTS: ${{ secrets.GPOINT_BOT_TOKEN != '' }}
        run: |
          set -euo pipefail
          audit_path=docs/operations/gpoint-bot-token-source-audit-20261123.md
          before="$TOKEN_SOURCE_BEFORE_SHA"
          if [[ ! "$before" =~ ^[0-9a-f]{40}$ || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'TOKEN_SOURCE_AUDIT=BLOCKED invalid push SHA' >&2; exit 1
          fi
          if [[ "$(git diff --name-status --no-renames "$before" "$GITHUB_SHA" -- "$audit_path")" != $'A\t'"$audit_path" ]]; then
            echo 'TOKEN_SOURCE_AUDIT=SKIPPED one-time authorization not newly added'
            exit 0
          fi
          echo 'TOKEN_SOURCE_AUDIT=STARTED read-only; no secret values printed'
          echo "GITHUB_ENV_SECRET_TELEGRAM_BOT_TOKEN_PRESENT=$GH_TELEGRAM_BOT_TOKEN_EXISTS"
          echo "GITHUB_ENV_SECRET_GPOINT_TELEGRAM_BOT_TOKEN_PRESENT=$GH_GPOINT_TELEGRAM_BOT_TOKEN_EXISTS"
          echo "GITHUB_ENV_SECRET_GPOINT_BOT_TOKEN_PRESENT=$GH_GPOINT_BOT_TOKEN_EXISTS"
          scanner="$(mktemp "$RUNNER_TEMP/gpoint-token-source-audit.XXXXXX.py")"
          trap 'rm -f "$scanner"' EXIT
          cat > "$scanner" <<'PY'
          import os, re, json, pathlib, subprocess
          from collections import defaultdict
          roots=("/opt/gpoint/env","/opt/gpoint","/root","/home","/srv","/etc/gpoint")
          avoid={".git","node_modules",".cache","cache","logs","media","pgdata","postgres","redis","ollama","backups","tmp",".venv","venv"}
          def env_path(p):
              n=p.name.lower()
              return n==".env" or n.startswith(".env.") or n.endswith(".env") or n.startswith("production.env") or n.endswith(".env.bak") or n.endswith(".env.old")
          def present(s):
              for line in s.splitlines():
                  m=re.match(r"^\s*(?:export\s+)?TELEGRAM_BOT_TOKEN\s*=\s*(.*?)\s*$",line)
                  if m and m.group(1).strip().strip("\"'") and not m.group(1).lstrip().startswith("#"):
                      return True
              return False
          found=set()
          seen=set()
          for root in roots:
              top=pathlib.Path(root)
              if not top.is_dir(): continue
              for directory, dirs, files in os.walk(root,topdown=True,followlinks=False):
                  relative=pathlib.Path(directory).relative_to(top)
                  if len(relative.parts)>=5:
                      dirs[:]=[]
                  else:
                      dirs[:]=[d for d in dirs if d not in avoid and not d.startswith("kube")]
                  for name in files:
                      p=pathlib.Path(directory)/name
                      if str(p) in seen: continue
                      seen.add(str(p))
                      if not env_path(p) or p.is_symlink(): continue
                      try:
                          if not p.is_file() or p.stat().st_size>1_000_000: continue
                          if present(p.read_text(encoding="utf8")):found.add(str(p))
                      except (OSError,UnicodeError):pass
          for p in sorted(found):
              print("EXISTING_TOKEN_ENV_FILE="+p)
          p=pathlib.Path("/opt/gpoint/env/production.env")
          keys=("TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","PUBLIC_APP_URL","GPOINT_INGEST_URL")
          try: lines=p.read_text().splitlines()
          except (OSError,UnicodeError):lines=[]
          for key in keys:
              result=any(re.match(r"^\s*(?:export\s+)?"+re.escape(key)+r"\s*=\s*\S",line) for line in lines)
              print("CURRENT_PRODUCTION_"+key+"_PRESENT="+str(result).lower())
          try:
              ps=subprocess.run(["docker","ps","-a","--format","{{.ID}}\t{{.Names}}"],capture_output=True,text=True,timeout=8)
              if ps.returncode: raise OSError
              for line in ps.stdout.splitlines():
                  container_id,_,name=line.partition("\t")
                  if not re.search(r"(^|[-_])bot($|[-_])",name,flags=re.I):continue
                  v=subprocess.run(["docker","inspect",container_id],capture_output=True,text=True,timeout=9)
                  if v.returncode:continue
                  j=json.loads(v.stdout)[0]
                  env=j.get("Config",{}).get("Env") or []
                  if any(row.startswith("TELEGRAM_BOT_TOKEN=") and row.partition("=")[2] for row in env):
                      print("EXISTING_TOKEN_DOCKER_CONTAINER="+name)
          except (OSError,ValueError,subprocess.TimeoutExpired,IndexError):
              print("DOCKER_ENV_AUDIT=UNAVAILABLE")
          print("EXISTING_TOKEN_SOURCES="+str(len(found)))
          PY
          echo 'SOURCE_HOST=current_layer7'
          ssh -T "root@$GPOINT_PRODUCTION_HOST" python3 - < "$scanner"
          echo 'TOKEN_SOURCE_AUDIT=COMPLETE_READ_ONLY'
          
      - name: Restore absent GPoint Bot once from verified installed Core
        if: github.event_name == 'push' && inputs.mode != 'rollback'
