          BOT_AUTH_EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          bash scripts/gpoint-bot-bootstrap.sh
      - name: Read live application version with Kamal
        if: (inputs.mode != 'rollback')
        id: kamal_inventory
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          kamal() {
            bash "$GITHUB_WORKSPACE/scripts/run-pinned-kamal.sh" inventory . "$@"
          }
          role_inventory="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - \
            < "$GITHUB_WORKSPACE/scripts/verify-kamal-production-baseline.py")"
          python3 - "$role_inventory" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          if (not isinstance(value.get("roles"), dict)
                  or not isinstance(value.get("missing_roles"), list)
                  or not isinstance(value.get("mixed_components"), list)):
              raise SystemExit("live Kamal role inventory is malformed")
          PY
          printf 'GPOINT_LIVE_ROLE_INVENTORY=%s\n' "$role_inventory" >> "$GITHUB_OUTPUT"
          for config in config/deploy.yml config/deploy.miniapp.yml config/deploy.eros.yml; do
            case "$config" in
              config/deploy.yml)
                version_output=core_version
                expected_role=gpoint-core-api
                ;;
              config/deploy.miniapp.yml)
                version_output=miniapp_version
                expected_role=gpoint-miniapp-web
                ;;
              config/deploy.eros.yml)
                version_output=eros_version
                expected_role=gpoint-eros-pilot-engine
                ;;
            esac
            if ! python3 -c 'import json,sys; raise SystemExit(0 if sys.argv[2] in json.loads(sys.argv[1])["roles"] else 1)' \
              "$role_inventory" "$expected_role"; then
              printf '%s=ABSENT\n' "$version_output" >> "$GITHUB_OUTPUT"
              printf '### Kamal inventory: %s\n\nRole absent; candidate release must bootstrap it.\n\n' \
                "$expected_role" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if version_text="$(kamal app version --config-file "$config" 2>&1)"; then
              version_status=0
            else
              version_status=$?
            fi
            if [[ "$version_status" != 0 ]]; then
              safe_error="$(printf '%s' "$version_text" | python3 -c '
          import os, re, sys
          message = sys.stdin.read()
          for name in ("GPOINT_PRODUCTION_HOST", "KAMAL_REGISTRY_PASSWORD"):
              secret = os.environ.get(name)
              if secret:
                  message = message.replace(secret, "[redacted]")
          message = re.sub(r"(?i)\b(password|token|secret|authorization)\b\s*[:=]\s*\S+", r"\1=[redacted]", message)
          message = re.sub(r"-----BEGIN [^-]+-----.*?-----END [^-]+-----", "[redacted]", message, flags=re.S)
          message = re.sub(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", "[redacted-ip]", message)
          lines = message.splitlines()[-12:]
          print(" | ".join(" ".join(line.split()) for line in lines)[-1800:])
          ')"
              [[ -n "$safe_error" ]] || safe_error="no command output"
              echo "Kamal app version command failed for $config (exit=$version_status): $safe_error" >&2
              exit "$version_status"
            fi
            version="$( { grep -Eo '[0-9a-f]{40}-[0-9]+-[0-9]+' <<< "$version_text" || test "$?" -eq 1; } | sort -u)"
            if ! [[ "$version" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]; then
              echo "Kamal inventory could not resolve one exact current version for $config." >&2
              exit 1
            fi
            printf '%s=%s\n' "$version_output" "$version" >> "$GITHUB_OUTPUT"
            printf '### Kamal inventory: %s\n\nCurrent version: **%s**\n\n' \
              "$config" "$version" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Verify installed Kamal topology before ordinary release
        if: (inputs.mode != 'rollback')
