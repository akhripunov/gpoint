          CANDIDATE_SHA: ${{ github.sha }}
          EROS_DIGEST: ${{ steps.component_plan.outputs.eros_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/akhripunov/gpoint-eros@$EROS_DIGEST"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - \
            --mode verify-applied --candidate "$CANDIDATE_SHA" --image "$image" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" < scripts/eros-native-database.py
      - name: Verify native Voyage memory write and recall
        if: steps.component_plan.outputs.voyage_memory_reset == 'true' && inputs.mode != 'rollback'
        id: voyage_memory_verify
        env:
          CORE_API_VERSION: ${{ steps.component_plan.outputs.core_api_version }}
        run: |
          set -euo pipefail
          [[ "$CORE_API_VERSION" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          api_container="gpoint-core-api-$CORE_API_VERSION"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$api_container" <<'REMOTE_VOYAGE_MEMORY'
          set -euo pipefail
          name="$1"
          test "$(docker inspect --format '{{.State.Status}}' "$name")" = running
          test "$(docker inspect --format '{{index .Config.Labels "service"}}' "$name")" = gpoint-core
          docker exec -i "$name" node --input-type=module - <<'NODE'
          import { createErosEngineClient, erosGenomeCardFor, erosGenomeIdentityFor, erosIdentityFor, uuidV5 } from '/app/apps/api/dist/apps/api/src/eros-adapter.js';

          const client = createErosEngineClient();
          if (!client) throw new Error('synthetic Eros client unavailable');
          const creatorId = 'voyage_native_memory_verification';
          const userId = 'voyage_native_memory_verification_user';
          const identity = erosIdentityFor({ userId, creatorId });
          const genomeId = erosGenomeIdentityFor(creatorId);
          await client.createGenome(genomeId, erosGenomeCardFor('Synthetic Voyage memory verification'));
          let session = await client.startSession(identity.userId, genomeId);
          const namespace = '11111111-1111-5111-8111-111111111111';
          const send = async (sequence, text) => client.sendMessage(
            identity.userId,
            session.sessionId,
            uuidV5(namespace, `voyage-memory-verification-${sequence}`),
            text,
            { creatorId: identity.creatorId, instanceId: session.instanceId },
          );
          await send(1, 'My favorite fruit is cobalt pear, and I live near Zephyr Bay. Please remember those details.');
          const distractors = [
            'Describe a calm morning walk through a botanical garden.',
            'What makes a well organized desk comfortable to work at?',
            'Write a short thought about listening to rain indoors.',
            'How can someone plan a relaxed weekend without a schedule?',
            'Describe the colors in a fictional landscape painting.',
            'What are a few ways to keep a reading nook comfortable?',
            'Write a neutral sentence about learning a new recipe.',
            'Describe a quiet train ride through the countryside.',
            'What is enjoyable about visiting a small museum?',
            'Share a simple idea for arranging house plants.',
            'Describe the sound of wind moving through pine trees.',
            'What helps make a public library welcoming?',
            'Write about choosing a notebook for everyday notes.',
            'Describe a peaceful evening at a lakeside cabin.',
          ];
          for (let index = 0; index < distractors.length; index += 1) {
            await send(index + 2, distractors[index]);
          }
          const reopened = await client.startSession(identity.userId, genomeId);
          if (reopened.sessionId !== session.sessionId || reopened.instanceId !== session.instanceId) {
            throw new Error('synthetic session recovery mismatch');
          }
          session = reopened;
          const recall = await send(16, 'After all those other topics, what is my favorite fruit and which bay did I say I live near?');
          const answer = recall.text.toLowerCase();
          if (!answer.includes('zephyr bay') || !answer.includes('cobalt pear')) {
            throw new Error('synthetic durable memory recall failed');
          }
          // The final SSE frame can precede the history read becoming visible.
          // Poll read-only history; never resend a turn or weaken the recall check.
          let persisted = false;
          const recallClientId = uuidV5(namespace, 'voyage-memory-verification-16');
          for (let attempt = 0; attempt < 10 && !persisted; attempt += 1) {
            const history = await client.history(identity.userId, session.sessionId, 50);
            const question = history.messages.findIndex((message) => message.role === 'user' && message.client_msg_id === recallClientId);
            const response = question >= 0 ? history.messages[question + 1] : undefined;
            persisted = history.messages.some((message) => message.role === 'user' && message.content.includes('Zephyr Bay')) &&
              response?.role === 'assistant' && response.content.toLowerCase().includes('zephyr bay') &&
              response.content.toLowerCase().includes('cobalt pear');
            if (!persisted && attempt < 9) await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          if (!persisted) throw new Error('synthetic Eros memory transcript persistence failed');
          console.log('EROS_NATIVE_VOYAGE_MEMORY=PASS synthetic_turns=16 session_reopened=true recall=PASS history=PASS');
          NODE
          REMOTE_VOYAGE_MEMORY
          echo 'EROS_NATIVE_VOYAGE_MEMORY=PASS' >> "$GITHUB_STEP_SUMMARY"
