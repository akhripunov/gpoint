          print("voyage_memory_reset=" + str(bool(scope["deploy_eros"] and reset_changed)).lower())
          scope_components = set(scope["scope"].split("+")) - {"NONE"}
          effective = {}
          image_inputs = {"CORE": "APP_DIGEST", "MINIAPP": "MINIAPP_DIGEST", "EROS": "EROS_DIGEST"}
          outputs = {"CORE": "app_digest", "MINIAPP": "miniapp_digest", "EROS": "eros_digest"}
          for component, roles in ALL_COMPONENT_ROLES.items():
              role = roles[0]
              if component in scope_components:
                  digest = os.environ[image_inputs[component]]
