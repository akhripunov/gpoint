          KAMAL_MINIAPP_VERSION: ${{ steps.kamal_inventory.outputs.miniapp_version }}
          KAMAL_EROS_VERSION: ${{ steps.kamal_inventory.outputs.eros_version }}
          LIVE_ROLE_INVENTORY: ${{ steps.kamal_inventory.outputs.GPOINT_LIVE_ROLE_INVENTORY }}
        run: |
          set -euo pipefail
          role_inventory="${LIVE_ROLE_INVENTORY:?verified live role inventory is required}"
          python3 - "$role_inventory" <<'PY'
          import json, os, re, sys
          roles = json.loads(sys.argv[1])["roles"]
          for role, expected in {
              "gpoint-core-api": os.environ["KAMAL_CORE_VERSION"],
              "gpoint-miniapp-web": os.environ["KAMAL_MINIAPP_VERSION"],
              "gpoint-eros-pilot-engine": os.environ["KAMAL_EROS_VERSION"],
