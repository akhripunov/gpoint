                fi
              fi
              ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$APP_DIGEST" <<'REMOTE_WORKER_PROXY_CHECK'
          set -euo pipefail
          expected_image="ghcr.io/akhripunov/gpoint-runtime@$1"
          name=gpoint-core-worker-proxy
          test "$(docker inspect --format '{{.State.Status}}' "$name")" = running
          test "$(docker inspect --format '{{.Config.Image}}' "$name")" = "$expected_image"
          test "$(docker inspect --format '{{index .Config.Labels "service"}}' "$name")" = gpoint-core-worker-proxy
          bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$name")"
          networks="$(docker inspect --format '{{json .NetworkSettings.Networks}}' "$name")"
          python3 - "$bindings" "$networks" <<'PY'
          import json, sys
          bindings, networks = (json.loads(value) for value in sys.argv[1:])
          if bindings != {"3000/tcp": [{"HostIp": "127.0.0.1", "HostPort": "13004"}]}:
              raise SystemExit("Worker tunnel accessory must bind only VPS loopback port 13004")
          if set(networks) != {"kamal"}:
              raise SystemExit("Worker tunnel accessory must use only the Kamal network")
          PY
          status="$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --data '{}' http://127.0.0.1:13004/gpoint-worker/health)"
