name: GPoint — Prepare

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpoint-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coalesce:
    # Keep bounded quiet-window waiting off paid hosted minutes. This trusted,
    # repository-scoped runner does no Docker build or production mutation.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, gpoint-production]
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      result: ${{ steps.coalesce.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify GitHub API read with the job token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETWORK_RETRY_BUDGET_STATE: ${{ runner.temp }}/gpoint-prepare-network-retry-${{ github.run_id }}-${{ github.run_attempt }}.state
        run: python3 scripts/github_api_preflight.py
      - name: Wait for a quiet main and verify the exact candidate
        id: coalesce
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          NETWORK_RETRY_BUDGET_STATE: ${{ runner.temp }}/gpoint-prepare-network-retry-${{ github.run_id }}-${{ github.run_attempt }}.state
        run: python3 scripts/prepare_coalescing.py

  prepare:
    # Legacy recovery Prepare is manually dispatched from main only.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.coalesce.result == 'success' &&
      needs.coalesce.outputs.result == 'WINNER'
    needs: coalesce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      coalescing: ${{ needs.coalesce.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Release V3 exact-production impact plan (fail closed)
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 scripts/release_impact_v3.py --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/gpoint-impact-v3.json"
      - name: V4 component scope (read-only advisory; V3 gates unchanged)
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        run: python3 scripts/release_component_impact_v4.py --candidate "$GITHUB_SHA" --v3-plan "$RUNNER_TEMP/gpoint-impact-v3.json" --output "$RUNNER_TEMP/gpoint-impact-v4-advisory.json"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Pin production Docker version with classic build store
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.1.3
          context: gpoint-setup-docker
          runtime-basedir: ${{ runner.temp }}/gpoint-setup-docker
          set-host: false
          daemon-config: |
            {"features":{"containerd-snapshotter":false}}
      - name: Select the pinned local Docker context
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        run: |
          printf 'DOCKER_CONTEXT=gpoint-setup-docker\n' >> "$GITHUB_ENV"
          printf 'GPOINT_DOCKER_RUNTIME_BASEDIR=%s/gpoint-setup-docker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Expose scoped GitHub Actions cache runtime to BuildKit
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        uses: crazy-max/ghaction-github-runtime@a1014fef88934970651c7916e89aaf51bc58f38b
      - name: Set up isolated production-platform Buildx builder
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: linux/amd64
          # Prepare runs only on disposable ubuntu-latest. Its hosted runner is
          # destroyed after this job, so removing the builder again in the
          # action's 20+ second post-step does not improve isolation or safety.
          # Keep this guarded by test_gpoint_docker_cache_v3 if runs-on changes.
          cleanup: false
      - name: Install AGATA test dependencies
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        run: |
          python -m pip install --no-cache-dir pip==26.2.2
          python -m pip install './services/agata[test]' './services/gsales[test]'
      - name: Test release preflight coordinator
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        run: |
          python3 -m pytest -q tests/test_public_workflow_security.py
          python3 -m unittest tests.test_gpoint_release_trigger_graph
          python3 scripts/test_prepare_coalescing.py
          python3 -m unittest tests.test_prepare_workflow_summary
          python3 -m unittest tests.test_unified_release_v1
          python3 -m unittest tests.test_interrupted_recovery_workflow
          python3 -m unittest discover -s tests -p test_release_impact_v3.py
          python3 -m unittest discover -s tests -p 'test_release_*v4.py'
          python3 -m unittest discover -s tests -p test_gpoint_docker_cache_v3.py
          python3 scripts/test_release_preflight_benchmark.py
          python3 scripts/select-release-run.test.py
          node --test scripts/release-orchestrator.test.mjs
          node --test scripts/release-component-bundle-v4.test.mjs scripts/release-component-vps-proof-v4.test.mjs
          node --test scripts/release-static-v4.test.mjs scripts/release-static-transfer-v4.test.mjs scripts/release-static-publish-v4.test.mjs scripts/release-static-baseline-v4.test.mjs
          node --test scripts/release-evidence.test.mjs
      - name: Tests, disposable database rehearsal and immutable Docker build
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GPOINT_V3_IMPACT_PLAN_PATH: ${{ runner.temp }}/gpoint-impact-v3.json
        run: python scripts/prepare-release.py "$CANDIDATE_SHA" "$RUNNER_TEMP/gpoint-bundle"
      - name: Authenticate hosted Prepare for scoped GHCR publication
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up pinned ORAS CLI
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.2.0
      - name: Publish and read back exact GHCR artifacts
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        id: ghcr-publish
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GHCR_REHEARSAL_USERNAME: ${{ github.actor }}
          GHCR_REHEARSAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_ghcr_images.py
      - name: Verify V3 baseline has not drifted after receipt publication
        if: github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 scripts/release_impact_v3.py --candidate "$CANDIDATE_SHA" --verify-receipt "$RUNNER_TEMP/gpoint-bundle/receipt.json"
      - name: Owner summary
        if: always() && github.ref == 'refs/heads/main' && needs.coalesce.outputs.result == 'WINNER'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          echo "Candidate: $CANDIDATE_SHA — canonical Prepare completed. Production is unchanged." >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = Path(os.environ['RUNNER_TEMP']) / 'gpoint-bundle' / 'receipt.json'
          if receipt.is_file():
              stages = json.loads(receipt.read_text()).get('prepareStages', {})
              if stages:
                  with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                      summary.write('\n| Prepare stage | Result | Seconds |\n| --- | --- | ---: |\n')
                      for name, result in stages.items():
                          summary.write(f"| {name} | {result['status']} | {result['seconds']:.3f} |\n")
          PY
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo 'Legacy recovery artifacts are prepared for this exact main SHA. No Deploy follows automatically; any legacy recovery Deploy remains a separate explicit workflow dispatch.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    permissions:
      contents: read
      actions: read
      deployments: read
    needs: [coalesce, prepare]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.coalesce.result == 'success' &&
      needs.coalesce.outputs.result == 'WINNER' &&
      needs.prepare.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpoint-linear-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Measure Prepare runner usage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEMETRY_RUN_IDS: ${{ github.run_id }}
          CACHE_PREVENTED_DOWNLOAD: NO
        run: |
          python scripts/release-telemetry.py
          cat "$GITHUB_OUTPUT" >> "$GITHUB_ENV"
      - name: Publish candidate result to existing Linear documents
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PHASE: candidate
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/publish-release-linear.py
