name: GPoint — Prepare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpoint-prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    # Branch dispatch rehearses tooling on hosted Linux only; it never qualifies
    # for production or publishes candidate readiness to Linear.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Pin production Docker version with classic build store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.1.3
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":false}}
      - name: Check rehearsal setup before expensive branch preparation
        if: github.ref != 'refs/heads/main'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python scripts/check-release-rehearsal.py
      - name: Install AGATA test dependencies
        run: python -m pip install './services/agata[test]'
      - name: Test release preflight coordinator
        run: python3 scripts/test_release_preflight_benchmark.py
      - name: Tests, disposable database rehearsal and immutable Docker build
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python scripts/prepare-release.py "$CANDIDATE_SHA" "$RUNNER_TEMP/gpoint-bundle"
      - name: Save exact candidate images and readiness receipt
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gpoint-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpoint-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save branch rehearsal receipt without a duplicate image archive
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gpoint-rehearsal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpoint-bundle/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Owner summary
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          echo "Candidate: $CANDIDATE_SHA — rehearsal PASS. Production is unchanged." >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = Path(os.environ['RUNNER_TEMP']) / 'gpoint-bundle' / 'receipt.json'
          if receipt.is_file():
              stages = json.loads(receipt.read_text()).get('prepareStages', {})
              if stages:
                  with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                      summary.write('\n| Prepare stage | Result | Seconds |\n| --- | --- | ---: |\n')
                      for name, result in stages.items():
                          summary.write(f"| {name} | {result['status']} | {result['seconds']:.3f} |\n")
          PY
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo 'Next: await Publish PASS, then GPoint — Deploy → main → this SHA → approve production.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Branch rehearsal only: not eligible for production. Merge reviewed changes and await main Prepare.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: prepare
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpoint-linear-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish candidate result to existing Linear documents
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PHASE: candidate
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/publish-release-linear.py
