name: GPoint — Prepare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpoint-prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Install AGATA test dependencies
        run: python -m pip install './services/agata[test]'
      - name: Tests, disposable database rehearsal and immutable Docker build
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python scripts/prepare-release.py "$CANDIDATE_SHA" "$RUNNER_TEMP/gpoint-bundle"
      - name: Save exact candidate images and readiness receipt
        uses: actions/upload-artifact@v4
        with:
          name: gpoint-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpoint-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Owner summary
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          echo "Candidate: $CANDIDATE_SHA — READY. Production is unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo 'Next: GPoint — Deploy → Run workflow → main → paste this SHA → approve production.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: prepare
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpoint-linear-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish candidate result to existing Linear documents
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PHASE: candidate
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/publish-release-linear.py
