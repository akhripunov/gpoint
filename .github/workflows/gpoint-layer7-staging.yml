name: GPoint — Protected Layer7 staging deploy

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      staging_image_sha:
        required: true
        type: string
      scoped_snapshot:
        required: true
        type: string
      scoped_image_version:
        required: true
        type: string
      prepared_app_digest:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      deploy_layer7_staging:
        description: Deploy only to the fixed, isolated Layer7 staging VPS
        required: true
        type: boolean
        default: false
      approve_layer7_staging:
        description: I authorize this exact candidate SHA on the isolated Layer7 staging VPS
        required: true
        type: boolean
        default: false
      staging_image_sha:
        description: Exact source SHA represented by the prepared images
        required: false
        type: string
      prepared_run_id:
        description: Run ID of the successful Build run for this exact SHA
        required: false
        type: string
      prepared_app_digest:
        description: Prepared GHCR digest for CORE
        required: false
        type: string
      prepared_agata_digest:
        description: Prepared GHCR digest for AGATA
        required: false
        type: string
      prepared_miniapp_digest:
        description: Prepared GHCR digest for MINIAPP
        required: false
        type: string
      prepared_eros_digest:
        description: Prepared GHCR digest for EROS
        required: false
        type: string

permissions:
  contents: read


jobs:
  layer7_staging:
    name: Protected Layer7 staging Kamal deploy and verify
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy_layer7_staging == true &&
       inputs.approve_layer7_staging == true &&
       inputs.staging_image_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'layer7-staging' || 'layer7-api-auto' }}
    concurrency:
      group: gpoint-layer7-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      actions: read
      deployments: write
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize Layer7 SSH credentials
        env:
          LAYER7_SSH_KEY_SECRET: ${{ secrets.LAYER7_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LAYER7_SSH_KEY_SECRET"
          install -d -m 700 "$RUNNER_TEMP/layer7"
          printf '%s\n' "$LAYER7_SSH_KEY_SECRET" > "$RUNNER_TEMP/layer7/key"
          chmod 600 "$RUNNER_TEMP/layer7/key"
          test "$(stat -c '%a' "$RUNNER_TEMP/layer7/key")" = 600
          {
            echo "LAYER7_SSH_KEY=$RUNNER_TEMP/layer7/key"
            echo "GPOINT_SSH_KEY=$RUNNER_TEMP/layer7/key"
            echo "GPOINT_KNOWN_HOSTS_FILE=$GITHUB_WORKSPACE/infra/staging/layer7_known_hosts"
            echo "GPOINT_LAYER7_STAGING_HOST=95.133.236.59"
            echo "GPOINT_KAMAL_TARGET_HOST=95.133.236.59"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "GPOINT_COMMIT_SHA=$GITHUB_SHA"
            echo "GPOINT_APP_SOURCE_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/layer7-deploy
        with:
          candidate_sha: ${{ inputs.candidate_sha }}
          staging_image_sha: ${{ inputs.staging_image_sha }}
          scoped_snapshot: ${{ inputs.scoped_snapshot }}
          scoped_image_version: ${{ inputs.scoped_image_version }}
          prepared_app_digest: ${{ inputs.prepared_app_digest }}
          prepared_run_id: ${{ inputs.prepared_run_id }}
          prepared_agata_digest: ${{ inputs.prepared_agata_digest }}
          prepared_miniapp_digest: ${{ inputs.prepared_miniapp_digest }}
          prepared_eros_digest: ${{ inputs.prepared_eros_digest }}
