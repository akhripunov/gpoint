name: GPoint Core Deploy (manual)

on:
  push:
    branches: [dev]
    paths:
      - apps/api/**
      - apps/worker/**
      - apps/bot/**
      - packages/**
      - config/deploy.yml
      - config/deploy.eros-api.yml
      - infra/production/Gpoint.Dockerfile
      - scripts/docker_dependency_manifests.py
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/gpoint-ci.yml
    permissions:
      contents: read

  build:
    needs: test
    if: >-
      github.actor == github.repository_owner &&
      (
        github.ref == 'refs/heads/main' ||
        (
          github.ref == 'refs/heads/dev' &&
          github.event_name == 'push' &&
          contains(github.event.head_commit.message || '', '[GPOINT-BUILD-VERIFY]')
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable Core image
        id: image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          file: infra/production/Gpoint.Dockerfile
          target: runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          tags: ghcr.io/akhripunov/gpoint-runtime:${{ github.ref == 'refs/heads/dev' && format('verify-{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Verify immutable BUILD digest, platform, SBOM, provenance, and source SHA
        env:
          IMAGE_REF: ghcr.io/akhripunov/gpoint-runtime
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CANDIDATE_SHA: ${{ github.sha }}
          SOURCE_LABEL: org.opencontainers.image.revision
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$IMAGE_REF@$IMAGE_DIGEST"
          docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/image-index.json"
          docker buildx imagetools inspect "$image" --format '{{json .SBOM.SPDX}}' > "$RUNNER_TEMP/image-sbom.json"
          docker buildx imagetools inspect "$image" --format '{{json .Provenance.SLSA}}' > "$RUNNER_TEMP/image-provenance.json"
          docker buildx imagetools inspect "$image" --format '{{json (index .Image "linux/amd64").Config.Labels}}' > "$RUNNER_TEMP/image-labels.json"
          python3 - "$RUNNER_TEMP/image-index.json" "$RUNNER_TEMP/image-sbom.json" "$RUNNER_TEMP/image-provenance.json" "$RUNNER_TEMP/image-labels.json" "$CANDIDATE_SHA" "$SOURCE_LABEL" <<'PY'
          import json, sys
          index_path, sbom_path, provenance_path, labels_path, sha, source_label = sys.argv[1:]
          index = json.load(open(index_path, encoding="utf-8"))
          manifests = index.get("manifests", [])
          assert any(m.get("platform", {}).get("os") == "linux" and m.get("platform", {}).get("architecture") == "amd64" for m in manifests), "linux/amd64 manifest missing"
          sbom = json.load(open(sbom_path, encoding="utf-8"))
          assert sbom and sbom.get("SPDXID") == "SPDXRef-DOCUMENT", "BuildKit SBOM missing"
          provenance = json.load(open(provenance_path, encoding="utf-8"))
          assert provenance and provenance.get("buildType"), "BuildKit provenance missing"
          labels = json.load(open(labels_path, encoding="utf-8"))
          assert labels.get(source_label) == sha, f"source SHA label mismatch: {source_label}"
          print("platform=linux/amd64 PASS")
          print("sbom=SPDX PASS")
          print("provenance=SLSA PASS")
          print(f"source_sha={sha} PASS")
          PY
          {
            echo '### Hosted Build verification'
            echo "- Candidate SHA: $CANDIDATE_SHA"
            echo "- Image: $image"
            echo "- Digest: $IMAGE_DIGEST"
            echo '- Platform: linux/amd64 — PASS'
            echo '- SBOM (SPDX): PASS'
            echo '- Provenance (SLSA): PASS'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      APP_DIGEST: ${{ needs.build.outputs.digest }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
      VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - name: Pull and verify pinned Kamal CLI image
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$KAMAL_IMAGE"
          docker image inspect "$KAMAL_IMAGE" --format '{{.Os}}/{{.Architecture}} {{json .RepoDigests}}' \
            | grep -F 'linux/amd64' | grep -F 'ghcr.io/basecamp/kamal@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625'
      - name: Verify exact main SHA and SSH host key
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          cat > "$HOME/.ssh/config" <<EOF
          Host $GPOINT_PRODUCTION_HOST
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
          echo "GPOINT_SSH_KEY=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "GPOINT_KNOWN_HOSTS_FILE=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Verify installed baseline and candidate image
        id: baseline
        run: |
          set -euo pipefail
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          baseline="$(ssh -T "root@$GPOINT_PRODUCTION_HOST" python3 - < scripts/verify-kamal-production-baseline.py)"
          core_sha="$(python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); print(d["source_sha"])' <<< "$baseline")"
          [[ "$core_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "BASELINE_CORE_SHA=$core_sha" >> "$GITHUB_ENV"
      - name: Prepare exact candidate image on production host
        id: prepare_image
        env:
          VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export APP_IMAGE="ghcr.io/akhripunov/gpoint-runtime@$APP_DIGEST"
          [[ "$APP_IMAGE" =~ ^ghcr\.io/akhripunov/gpoint-runtime@sha256:[0-9a-f]{64}$ ]]
          stage="/run/gpoint-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$stage" =~ ^/run/gpoint-core-[0-9]+-[0-9]+$ ]]
          ssh -T "root@$GPOINT_PRODUCTION_HOST" install -d -o root -g root -m 0700 "$stage/docker-config"
          printf '%s' "$GHCR_TOKEN" | ssh -T "root@$GPOINT_PRODUCTION_HOST" \
            "DOCKER_CONFIG='$stage/docker-config' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin" >/dev/null
          ssh -T "root@$GPOINT_PRODUCTION_HOST" bash -s -- "$stage" "$APP_IMAGE" "$CANDIDATE_SHA" <<'REMOTE_PULL'
          set -euo pipefail
          stage="$1" image="$2" candidate="$3"
          export DOCKER_CONFIG="$stage/docker-config"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$candidate"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | grep -F "$image" >/dev/null
          REMOTE_PULL
          echo "GPOINT_CORE_IMAGE=$APP_IMAGE" >> "$GITHUB_ENV"
          echo "GPOINT_CORE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Plan approved Prisma migrations from live inventory
        id: migration
        run: |
          set -euo pipefail
          live="$(ssh -T "root@$GPOINT_PRODUCTION_HOST" bash -s -- "$GPOINT_CORE_IMAGE" <<'REMOTE_DB'
          set -euo pipefail
          image="$1"
          docker run --rm --network shared_internal --env-file /opt/gpoint/env/production.env \
            --workdir /app/apps/api "$image" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const failed=await db.$queryRawUnsafe("SELECT count(*)::int AS n FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL");if(failed[0].n!==0)throw Error("unfinished migration exists");const rows=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const agata=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(agata.length!==1)throw Error("AGATA head is not singular");console.log("MIGRATIONS="+rows.map(x=>x.migration_name).join(","));console.log("CHECKSUMS="+rows.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("PRISMA_HEAD="+(rows.length?rows[rows.length-1].migration_name:"NONE"));console.log("AGATA_HEAD="+agata[0].version_num)}catch(e){console.error("PRISMA_PREFLIGHT_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()'
          REMOTE_DB
          )"
          applied="$(sed -n 's/^MIGRATIONS=//p' <<< "$live")"
          checksums="$(sed -n 's/^CHECKSUMS=//p' <<< "$live")"
          prisma_head="$(sed -n 's/^PRISMA_HEAD=//p' <<< "$live")"
          agata_head="$(sed -n 's/^AGATA_HEAD=//p' <<< "$live")"
          [[ -n "$applied" && -n "$checksums" ]]
          [[ "$prisma_head" =~ ^([0-9]{14}_[a-z0-9_]+|NONE)$ && "$agata_head" =~ ^[A-Za-z0-9_]+$ ]]
          plan="$(python3 scripts/prisma_migration_release_plan.py \
            --migrations-dir packages/db/prisma/migrations \
            --applied-migrations "$applied" --applied-checksums "$checksums" \
            --allowlist packages/db/prisma/production-approved-migrations.json \
            --baseline-sha "$BASELINE_CORE_SHA" --candidate-sha "$CANDIDATE_SHA")"
          apply="$(sed -n 's/^apply=//p' <<< "$plan")"
          pending="$(sed -n 's/^pending=//p' <<< "$plan")"
          [[ "$apply" == true || "$apply" == false ]]
          {
            echo "apply=$apply"
            echo "pending=$pending"
            echo "pending_checksums=$(sed -n 's/^pending_checksums=//p' <<< "$plan")"
            echo "applied=$applied"
            echo "checksums=$checksums"
            echo "prisma_head=$prisma_head"
            echo "agata_head=$agata_head"
          } >> "$GITHUB_OUTPUT"
      - name: Backup and restore before approved migration Apply
        if: steps.migration.outputs.apply == 'true'
        run: |
          set -euo pipefail
          stage="/run/gpoint-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -C scripts -cf - gpoint-scheduled-backup.py gpoint-backup-policy.py \
            | ssh -T "root@$GPOINT_PRODUCTION_HOST" "tar --no-same-owner -xf - -C '$stage'"
          output="$(ssh -T "root@$GPOINT_PRODUCTION_HOST" python3 "$stage/gpoint-scheduled-backup.py" --release-backup)"
          manifest="$(sed -n 's/^GPOINT_RELEASE_BACKUP_MANIFEST=//p' <<< "$output")"
          [[ "$manifest" =~ ^/opt/gpoint/backups/release/runs/[0-9a-f]{40}-[0-9]+-[0-9]+/manifest\.json$ ]]
          backup="$(ssh -T "root@$GPOINT_PRODUCTION_HOST" cat "$manifest")"
          python3 - "${{ steps.migration.outputs.prisma_head }}" "${{ steps.migration.outputs.agata_head }}" "$backup" <<'PY'
          import json, sys
          value = json.loads(sys.argv[3])
          if value.get("schema") != "gpoint-release-backup/v1" or value.get("status") != "PASS":
              raise SystemExit("release backup evidence is invalid")
          database = value.get("database", {})
          if database.get("prisma_head") != sys.argv[1] or database.get("agata_head") != sys.argv[2]:
              raise SystemExit("backup restore does not match the live schema baseline")
          PY
          ssh -T "root@$GPOINT_PRODUCTION_HOST" python3 "$stage/gpoint-backup-policy.py" freshness \
            --release-backup --manifest "$manifest" --max-age-hours 26 | grep -q '^GPOINT_BACKUP_FRESHNESS=PASS '
      - name: Apply approved migrations from the exact new image
        if: steps.migration.outputs.apply == 'true'
        run: |
          set -euo pipefail
          stage="/run/gpoint-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          ssh -T "root@$GPOINT_PRODUCTION_HOST" bash -s -- "$stage" "$GPOINT_CORE_IMAGE" \
            "${{ steps.migration.outputs.applied }}" "${{ steps.migration.outputs.checksums }}" \
            "${{ steps.migration.outputs.pending }}" "${{ steps.migration.outputs.pending_checksums }}" <<'REMOTE_APPLY'
          set -euo pipefail
          stage="$1" image="$2" applied="$3" checksums="$4" pending="$5" pending_checksums="$6"
          export DOCKER_CONFIG="$stage/docker-config"
          facts() {
            docker run --rm --network shared_internal --env-file /opt/gpoint/env/production.env \
              --workdir /app/apps/api "$image" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const failed=await db.$queryRawUnsafe("SELECT count(*)::int AS n FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL");if(failed[0].n!==0)throw Error("unfinished migration exists");const rows=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const agata=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(agata.length!==1)throw Error("AGATA head is not singular");console.log("MIGRATIONS="+rows.map(x=>x.migration_name).join(","));console.log("CHECKSUMS="+rows.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("AGATA_HEAD="+agata[0].version_num)}catch(e){console.error("PRISMA_VERIFY_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()'
          }
          before="$(facts)"
          test "$(sed -n 's/^MIGRATIONS=//p' <<< "$before")" = "$applied"
          test "$(sed -n 's/^CHECKSUMS=//p' <<< "$before")" = "$checksums"
          old_agata="$(sed -n 's/^AGATA_HEAD=//p' <<< "$before")"
          docker run --rm --network shared_internal --env-file /opt/gpoint/env/production.env \
            --workdir /app/packages/db "$image" pnpm exec prisma migrate deploy
          docker run --rm --network shared_internal --env-file /opt/gpoint/env/production.env \
            --workdir /app/packages/db "$image" pnpm exec prisma migrate status
          after="$(facts)"
          expected_migrations="$applied${applied:+,}$pending"
          expected_checksums="$checksums${checksums:+,}$pending_checksums"
          test "$(sed -n 's/^MIGRATIONS=//p' <<< "$after")" = "$expected_migrations"
          test "$(sed -n 's/^CHECKSUMS=//p' <<< "$after")" = "$expected_checksums"
          test "$(sed -n 's/^AGATA_HEAD=//p' <<< "$after")" = "$old_agata"
          REMOTE_APPLY
      - name: Stop Bot then deploy all Core roles with Kamal
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GPOINT_COMMIT_SHA: ${{ github.sha }}
          GPOINT_APP_SOURCE_SHA: ${{ github.sha }}
          GPOINT_KAMAL_EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
          GPOINT_KAMAL_SERVICE: gpoint-core
        run: |
          set -euo pipefail
          export GPOINT_PRODUCTION_HOST KAMAL_REGISTRY_PASSWORD GPOINT_COMMIT_SHA GPOINT_APP_SOURCE_SHA
          kamal() {
            docker run --rm --pull=never --platform linux/amd64 \
              --volume "$GITHUB_WORKSPACE:/workdir" \
              --volume "$HOME/.ssh:$HOME/.ssh:ro" \
              --workdir /workdir \
              --env GPOINT_COMMIT_SHA --env GPOINT_APP_SOURCE_SHA \
              --env KAMAL_REGISTRY_PASSWORD --env GPOINT_PRODUCTION_HOST \
              --env GPOINT_SSH_KEY --env GPOINT_KNOWN_HOSTS_FILE \
              --env GPOINT_KAMAL_EXPECTED_DIGEST --env GPOINT_KAMAL_SERVICE \
              "$KAMAL_IMAGE" "$@"
          }
          GPOINT_KAMAL_EXPECTED_DIGEST="$APP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core \
            kamal app stop --roles bot --config-file config/deploy.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$APP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core \
            kamal deploy --skip-push --version "$GPOINT_CORE_VERSION" --config-file config/deploy.yml
      - name: Runtime smoke and single-instance checks
        run: |
          set -euo pipefail
          for role in gpoint-core-api gpoint-core-worker gpoint-core-bot; do
            ssh -T "root@$GPOINT_PRODUCTION_HOST" bash -s -- "$role" "$GPOINT_CORE_VERSION" "$CANDIDATE_SHA" \
              < scripts/verify-kamal-role.sh
          done
          curl --fail --silent --show-error --max-time 15 https://gpoint.one/api/health/live >/dev/null
      - name: Remove temporary production registry credentials
        if: always() && env.GPOINT_PRODUCTION_HOST != ''
        run: |
          set -euo pipefail
          stage="/run/gpoint-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$stage" =~ ^/run/gpoint-core-[0-9]+-[0-9]+$ ]]
          ssh -T "root@$GPOINT_PRODUCTION_HOST" rm -rf -- "$stage"
