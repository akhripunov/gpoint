          MINIAPP_DIGEST: ${{ steps.evidence.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          kamal() {
            docker run --rm --volume "$GITHUB_WORKSPACE/rollback-source:/workdir" --volume "$HOME/.ssh:/root/.ssh:ro" --volume "$HOME/.ssh:$HOME/.ssh:ro" --workdir /workdir \
              --env GPOINT_COMMIT_SHA --env GPOINT_APP_SOURCE_SHA --env GPOINT_PRODUCTION_HOST --env GPOINT_SSH_KEY \
              --env GPOINT_KNOWN_HOSTS_FILE --env KAMAL_REGISTRY_PASSWORD --env GPOINT_KAMAL_EXPECTED_DIGEST \
              --env GPOINT_KAMAL_SERVICE --env KAMAL_ROLES \
              ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625 "$@"
          }
          verify_role() {
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$1" "$TARGET_VERSION" "$TARGET_SHA" \
              < "$GITHUB_WORKSPACE/scripts/verify-kamal-role.sh"
          }
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=worker kamal app stop --roles worker --config-file config/deploy.yml
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$CORE_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=worker kamal rollback "$TARGET_VERSION" --roles worker --config-file config/deploy.yml
          verify_role gpoint-core-worker
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=bot kamal app stop --roles bot --config-file config/deploy.yml
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$CORE_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=bot kamal rollback "$TARGET_VERSION" --roles bot --config-file config/deploy.yml
          verify_role gpoint-core-bot
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=memory-worker kamal app stop --roles memory-worker --config-file config/deploy.agata.yml
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=memory-worker kamal rollback "$TARGET_VERSION" --roles memory-worker --config-file config/deploy.agata.yml
          verify_role gpoint-agata-memory-worker
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$MINIAPP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-miniapp KAMAL_ROLES=web kamal rollback "$TARGET_VERSION" --roles web --config-file config/deploy.miniapp.yml
          verify_role gpoint-miniapp-web
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=api kamal rollback "$TARGET_VERSION" --roles api --config-file config/deploy.agata.yml
          verify_role gpoint-agata-api
          GPOINT_COMMIT_SHA="$TARGET_SHA" GPOINT_APP_SOURCE_SHA="$TARGET_SHA" GPOINT_KAMAL_EXPECTED_DIGEST="$CORE_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=api kamal rollback "$TARGET_VERSION" --roles api --config-file config/deploy.yml
          verify_role gpoint-core-api
      - name: Verify rollback Runtime and preserve databases before SUCCESS
        id: verify
        env:
          TARGET_SHA: ${{ inputs.rollback_target_sha }}
          TARGET_VERSION: ${{ steps.evidence.outputs.version }}
          CORE_DIGEST: ${{ steps.evidence.outputs.core_digest }}
          AGATA_DIGEST: ${{ steps.evidence.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ steps.evidence.outputs.miniapp_digest }}
          DB_CONTAINER_ID: ${{ steps.baseline.outputs.DB_CONTAINER_ID }}
          REDIS_CONTAINER_ID: ${{ steps.baseline.outputs.REDIS_CONTAINER_ID }}
          DB_MOUNTS_SHA256: ${{ steps.baseline.outputs.DB_MOUNTS_SHA256 }}
          REDIS_MOUNTS_SHA256: ${{ steps.baseline.outputs.REDIS_MOUNTS_SHA256 }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          curl --retry 8 --retry-connrefused --retry-delay 3 --fail --silent --show-error https://gpoint.one/api/health/live | grep -F '"status":"ok"' >/dev/null
          for path in / /creators; do curl --retry 5 --retry-connrefused --retry-delay 2 --fail --silent --show-error "https://gpoint.one$path" | grep -F '<div id="root">' >/dev/null; done
          media_body="$RUNNER_TEMP/gpoint-rollback/media-route.json"
          media_status="$(curl --retry 5 --retry-connrefused --retry-delay 2 --silent --show-error --output "$media_body" --write-out '%{http_code}' https://gpoint.one/media/assets/kamal-route-verification-missing)"
          test "$media_status" = 404 && grep -Fq '"message":"media not found"' "$media_body"
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$TARGET_SHA" "$TARGET_VERSION" "$CORE_DIGEST" "$AGATA_DIGEST" "$MINIAPP_DIGEST" "$DB_CONTAINER_ID" "$REDIS_CONTAINER_ID" "$DB_MOUNTS_SHA256" "$REDIS_MOUNTS_SHA256" <<'REMOTE'
          set -euo pipefail
          sha="$1"; version="$2"; dbid="$6"; redisid="$7"; dbmount="$8"; redismount="$9"
          test "$(docker inspect --format '{{.Id}}' shared_postgres_1)" = "$dbid"
          test "$(docker inspect --format '{{.Id}}' shared_redis_1)" = "$redisid"
          test "$(docker inspect --format '{{.State.Running}}' shared_postgres_1)" = true
          test "$(docker inspect --format '{{.State.Running}}' shared_redis_1)" = true
          test "$(docker inspect --format '{{.State.Running}}' kamal-proxy)" = true
          test "$(docker ps -q --filter 'name=^/kamal-proxy$' | wc -l | tr -d ' ')" = 1
          for item in "gpoint-core-api|ghcr.io/akhripunov/gpoint-runtime@$3" "gpoint-core-worker|ghcr.io/akhripunov/gpoint-runtime@$3" "gpoint-core-bot|ghcr.io/akhripunov/gpoint-runtime@$3" "gpoint-agata-api|ghcr.io/akhripunov/gpoint-agata-runtime@$4" "gpoint-agata-memory-worker|ghcr.io/akhripunov/gpoint-agata-runtime@$4" "gpoint-miniapp-web|ghcr.io/akhripunov/gpoint-miniapp@$5"; do
            IFS='|' read -r prefix expected <<< "$item"
            name="$prefix-$version"
            test "$(docker ps -q --filter "name=^/${prefix}-" | wc -l | tr -d ' ')" = 1
            test "$(docker ps -q --filter "name=^/$name$" | wc -l | tr -d ' ')" = 1
            test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$name")" = "$sha"
            image="$(docker inspect --format '{{.Image}}' "$name")"; docker image inspect "$image" --format '{{json .RepoDigests}}' | grep -F "$expected" >/dev/null
          done
          fingerprint() { docker inspect "$1" --format '{{json .Mounts}}' | python3 -c 'import hashlib,json,sys; a=json.load(sys.stdin); r=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a),key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert r and all(x["Source"] and x["Destination"] for x in r); print(hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":")).encode()).hexdigest())'; }
          test "$(fingerprint shared_postgres_1)" = "$dbmount"
          test "$(fingerprint shared_redis_1)" = "$redismount"
          docker exec "gpoint-core-api-$version" node -e "fetch('http://127.0.0.1:3000/health/live').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
          test "$(docker exec "gpoint-core-api-$version" node -p 'process.env.RELEASE_SHA || ""')" = "$TARGET_SHA"
          test "$(docker exec "gpoint-core-worker-$version" node -p 'process.env.RELEASE_SHA || ""')" = "$TARGET_SHA"
          test "$(docker exec "gpoint-core-bot-$version" node -p 'process.env.RELEASE_SHA || ""')" = "$TARGET_SHA"
          docker top "gpoint-core-worker-$version" -eo pid,args | grep -F "apps/worker/dist/main.js"
          docker top "gpoint-core-bot-$version" -eo pid,args | grep -F "apps/bot/dist/main.js"
          docker exec "gpoint-agata-api-$version" python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3).status==200"
          docker exec "gpoint-agata-memory-worker-$version" python -m app.memory.worker --healthcheck
          test "$(docker exec "gpoint-agata-api-$version" python -c 'import os; print(os.environ.get("RELEASE_SHA", ""))')" = "$TARGET_SHA"
          test "$(docker exec "gpoint-agata-memory-worker-$version" python -c 'import os; print(os.environ.get("RELEASE_SHA", ""))')" = "$TARGET_SHA"
          docker exec "gpoint-miniapp-web-$version" wget --spider --quiet http://127.0.0.1/
          docker exec "gpoint-core-api-$version" node -e 'const fs=require("node:fs");const p="/data/media/.gpoint-rollback-"+require("node:crypto").randomUUID();let created=false;try{fs.writeFileSync(p,"ok",{flag:"wx"});created=true;if(fs.readFileSync(p,"utf8")!=="ok")process.exit(1)}finally{if(created)fs.unlinkSync(p)}'
          media_mounts="$(docker inspect "gpoint-core-api-$version" --format '{{json .Mounts}}')"
          python3 - "$media_mounts" <<'PY'
          import json,sys
          rows=[m for m in json.loads(sys.argv[1]) if m.get('Destination') == '/data/media']
          if len(rows)!=1 or rows[0].get('Type')!='bind' or rows[0].get('Source')!='/opt/gpoint/media' or rows[0].get('RW') is not True: raise SystemExit('media mount identity changed')
          PY
          docker exec kamal-proxy kamal-proxy list | grep -F 'gpoint-miniapp' >/dev/null
          docker exec kamal-proxy kamal-proxy list | grep -F 'gpoint-core' >/dev/null
          runtime_db="$(docker exec --workdir /app/apps/api "gpoint-core-api-$version" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const r=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const a=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(a.length!==1)throw Error("AGATA head not singular");console.log("PRISMA_HEAD="+(r.length?r[r.length-1].migration_name:"NONE"));console.log("PRISMA_MIGRATIONS="+r.map(x=>x.migration_name).join(","));console.log("PRISMA_CHECKSUMS="+r.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("AGATA_HEAD="+a[0].version_num)}catch(e){console.error("POST_ROLLBACK_DB_VERIFY_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          printf '%s\n' "$runtime_db"
          echo ROLLBACK_RUNTIME_VERIFY=PASS
          REMOTE
          )"
          grep -Fq 'ROLLBACK_RUNTIME_VERIFY=PASS' <<< "$facts"
          python3 "$GITHUB_WORKSPACE/scripts/verify-kamal-migration-parity.py" \
            --prisma-directory "$GITHUB_WORKSPACE/rollback-source/packages/db/prisma/migrations" \
            --prisma-current-migrations "$(sed -n 's/^PRISMA_MIGRATIONS=//p' <<< "$facts")" \
            --prisma-current-checksums "$(sed -n 's/^PRISMA_CHECKSUMS=//p' <<< "$facts")" \
            --prisma-current-head "$(sed -n 's/^PRISMA_HEAD=//p' <<< "$facts")" \
            --agata-directory "$GITHUB_WORKSPACE/rollback-source/services/agata/migrations/versions" \
            --agata-current-head "$(sed -n 's/^AGATA_HEAD=//p' <<< "$facts")"
          id="$ROLLBACK_DEPLOYMENT_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success -f environment=production -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Kamal rollback SUCCESS SHA $TARGET_SHA" >/dev/null
          echo "GPOINT_ROLLBACK_VERIFY=PASS SHA=$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark failed partial rollback for read-only recovery
        if: always() && steps.deployment.outputs.id != '' && steps.verify.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          APPLY_OUTCOME: ${{ steps.rollback_apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          echo "RECOVERY_REQUIRED: rollback apply/verify did not PASS; no automatic rollback or second Apply. Confirm live topology read-only before another production mutation." >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=failure -f environment=production -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Kamal rollback FAILED/RECOVERY_REQUIRED" >/dev/null

  backup_maintenance:
    name: Install or update scheduled VPS backups
    needs: [workspace, python]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.backup_maintenance == true && needs.workspace.outputs.mode == 'BACKUP_MAINTENANCE'
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact current main and explicit owner authorization
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          OWNER_ACTOR: ${{ github.actor }}
          OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVE_PRODUCTION" = true
          test "$OWNER_ACTOR" = "$REPOSITORY_OWNER"
          test "$OWNER_TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$GITHUB_SHA"
      - name: Install verified VPS SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          [[ "$GPOINT_PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host ${GPOINT_PRODUCTION_HOST}
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Install and enable scheduled VPS backups
        run: |
          set -euo pipefail
          release="/opt/gpoint/backup-releases/$CANDIDATE_SHA"
          stage="/run/gpoint-backup-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$stage" "$release" <<'REMOTE_SETUP'
          set -euo pipefail
          [[ "$1" =~ ^/run/gpoint-backup-install-[0-9]+-[0-9]+$ ]]
          [[ "$2" =~ ^/opt/gpoint/backup-releases/[0-9a-f]{40}$ ]]
          test ! -e "$1"
          install -d -o root -g root -m 0700 "$1"
          REMOTE_SETUP
          tar -czf "$RUNNER_TEMP/gpoint-vps-backup.tar.gz" scripts/gpoint-scheduled-backup.py scripts/gpoint-backup-policy.py scripts/gpoint-media-tree.py scripts/agata-production-migration.py scripts/verify-gpoint-scheduled-backup-restore.sh systemd/gpoint-backup.service systemd/gpoint-backup.timer
          scp -p "$RUNNER_TEMP/gpoint-vps-backup.tar.gz" "root@${GPOINT_PRODUCTION_HOST}:$stage/payload.tar.gz"
          archive_sha="$(sha256sum "$RUNNER_TEMP/gpoint-vps-backup.tar.gz" | awk '{print $1}')"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$stage" "$release" "$archive_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE_INSTALL'
          set -euo pipefail
          stage="$1"; release="$2"; expected_sha="$3"; run_id="$4"; attempt="$5"
          [[ "$stage" == "/run/gpoint-backup-install-${run_id}-${attempt}" ]]
          [[ "$release" =~ ^/opt/gpoint/backup-releases/[0-9a-f]{40}$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$stage/payload.tar.gz" | awk '{print $1}')" = "$expected_sha"
          test -f /opt/gpoint/env/gpoint-backup.agekey && test ! -L /opt/gpoint/env/gpoint-backup.agekey
          test "$(stat -c '%a:%u' /opt/gpoint/env/gpoint-backup.agekey)" = 600:0
          test ! -e "$release"
          install -d -o root -g root -m 0700 "$release"
          tar -xzf "$stage/payload.tar.gz" -C "$release" --no-same-owner
          find "$release" -type d -exec chmod 0755 {} +
          chmod 0755 "$release/scripts/gpoint-scheduled-backup.py" "$release/scripts/gpoint-backup-policy.py" "$release/scripts/gpoint-media-tree.py" "$release/scripts/agata-production-migration.py" "$release/scripts/verify-gpoint-scheduled-backup-restore.sh"
          ln -s "$release" "/opt/gpoint/.backup-current-${run_id}-${attempt}"
          mv -Tf "/opt/gpoint/.backup-current-${run_id}-${attempt}" /opt/gpoint/gpoint-backup-current
          install -m 0644 "$release/systemd/gpoint-backup.service" /etc/systemd/system/gpoint-backup.service
          install -m 0644 "$release/systemd/gpoint-backup.timer" /etc/systemd/system/gpoint-backup.timer
          systemctl daemon-reload
          systemctl enable --now gpoint-backup.timer
          systemctl start gpoint-backup.service
          for _ in $(seq 1 10800); do
            state="$(systemctl show gpoint-backup.service --property=ActiveState --value)"
            [[ "$state" == inactive ]] && break
            [[ "$state" == failed ]] && { journalctl -u gpoint-backup.service -n 30 --no-pager; exit 1; }
            sleep 10
          done
          test "$(systemctl is-enabled gpoint-backup.timer)" = enabled
          systemctl is-active --quiet gpoint-backup.timer
          python3 /opt/gpoint/gpoint-backup-current/scripts/gpoint-backup-policy.py freshness --manifest /opt/gpoint/backups/scheduled/latest.json --max-age-hours 26
          echo GPOINT_VPS_BACKUP_TIMER=PASS
          rm -rf -- "$stage"
          REMOTE_INSTALL
          echo GPOINT_VPS_BACKUP_INSTALL=PASS >> "$GITHUB_STEP_SUMMARY"

  migration_rehearsal:
    name: Isolated existing-backup migration rehearsal
    needs: [workspace, python, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.migration_rehearsal == true
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact main-only owner initiated rehearsal
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          OWNER_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVE_PRODUCTION" = false
          test "$OWNER_ACTOR" = "$REPOSITORY_OWNER"
      - name: Install verified Kamal SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          [[ "$GPOINT_PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host ${GPOINT_PRODUCTION_HOST}
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Rehearse migrations against existing encrypted VPS backup
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          APP_IMAGE_BYTES: ${{ needs.build.outputs.app_image_bytes }}
          AGATA_IMAGE_BYTES: ${{ needs.build.outputs.agata_image_bytes }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AGATA_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$APP_IMAGE_BYTES" =~ ^[0-9]+$ && "$AGATA_IMAGE_BYTES" =~ ^[0-9]+$ ]]
          app_image="ghcr.io/akhripunov/gpoint-runtime@$APP_DIGEST"
          agata_image="ghcr.io/akhripunov/gpoint-agata-runtime@$AGATA_DIGEST"
          queue_sha="$(sha256sum packages/db/prisma/migrations/20261016120000_eros_worker_queue/migration.sql | awk '{print $1}')"
          mapping_sha="$(sha256sum packages/db/prisma/migrations/20261020153000_eros_external_relationship_mapping/migration.sql | awk '{print $1}')"
          state_sha="$(sha256sum packages/db/prisma/migrations/20261022110000_eros_gpoint_message_state/migration.sql | awk '{print $1}')"
          agata_sha="$(sha256sum services/agata/migrations/versions/0012_eros_memory_disclosure.py | awk '{print $1}')"
