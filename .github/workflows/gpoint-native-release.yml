            python3 /opt/gpoint/gpoint-backup-current/scripts/gpoint-backup-policy.py freshness \
            --manifest /opt/gpoint/backups/scheduled/latest.json --max-age-hours 26)"
          grep -q '^GPOINT_BACKUP_FRESHNESS=PASS ' <<< "$backup_policy"
          backup_manifest="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" cat /opt/gpoint/backups/scheduled/latest.json)"
          python3 - "$BASELINE_PRISMA_HEAD" "$BASELINE_AGATA_HEAD" "$backup_manifest" <<'PY'
