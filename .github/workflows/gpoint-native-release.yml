          prisma_checksums="$(sed -n 's/^PRISMA_CHECKSUMS=//p' <<< "$runtime_db")"
          agata_head="$(sed -n 's/^AGATA_HEAD=//p' <<< "$runtime_db")"
          test -n "$prisma_head" && test -n "$prisma_migrations" && test -n "$prisma_checksums" && test -n "$agata_head"
          test "$prisma_migrations" = "$expected_prisma_migrations" || { echo 'Prisma applied migration inventory changed during ordinary deploy' >&2; exit 1; }
          test "$prisma_checksums" = "$expected_prisma_checksums" || { echo 'Prisma applied checksums changed during ordinary deploy' >&2; exit 1; }
          test "$prisma_head" = "$expected_prisma_head" || { echo 'Prisma head changed during ordinary deploy' >&2; exit 1; }
          test "$agata_head" = "$expected_agata_head" || { echo 'AGATA head changed during ordinary deploy' >&2; exit 1; }
