        run: |
          set -euo pipefail
          if [[ "$APPLY" == false ]]; then
            {
              echo "prisma_head=$BASELINE_PRISMA_HEAD"
              echo "prisma_migrations=$BASELINE_PRISMA_MIGRATIONS"
              echo "prisma_checksums=$BASELINE_PRISMA_CHECKSUMS"
              echo "agata_head=$BASELINE_AGATA_HEAD"
