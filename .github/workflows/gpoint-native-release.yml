name: GPoint Native Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      approve_production:
        description: I authorize this exact candidate SHA on GPoint production
        required: true
        default: false
        type: boolean
      migration_rehearsal:
        description: Restore the existing verified VPS backup and rehearse pending migrations in an isolated database only
        required: true
        default: false
        type: boolean
      backup_maintenance:
        description: Install or update the scheduled VPS backup service only
        required: true
        default: false
        type: boolean
      use_prepared_images:
        description: Reuse exact GHCR digests from a successful GPOINT-ARTIFACT-PREPARE run for this SHA
        required: true
        default: false
        type: boolean
      deploy_layer7_staging:
        description: Deploy only to the fixed, isolated Layer7 staging VPS using a verified prior Build run
        required: true
        default: false
        type: boolean
      approve_layer7_staging:
        description: I authorize this exact candidate SHA on the isolated Layer7 staging VPS
        required: true
        default: false
        type: boolean
      staging_image_sha:
        description: Exact source SHA represented by the prepared images to deploy on Layer7 staging
        required: false
        type: string
      prepared_run_id:
        description: Run ID of the successful GPOINT-ARTIFACT-PREPARE run for this exact SHA
        required: false
        type: string
      prepared_app_digest:
        description: Prepared GHCR digest for CORE, when included in the candidate scope
        required: false
        type: string
      prepared_agata_digest:
        description: Prepared GHCR digest for AGATA, when included in the candidate scope
        required: false
        type: string
      prepared_miniapp_digest:
        description: Prepared GHCR digest for MINIAPP, when included in the candidate scope
        required: false
        type: string
      prepared_eros_digest:
        description: Prepared GHCR digest for EROS, when included in the candidate scope
        required: false
        type: string
      rollback:
        description: Roll back to a previously verified successful Native production release
        required: true
        default: false
        type: boolean
      rollback_eros:
        description: Also roll back the Eros image after isolated SQLx compatibility verification
        required: true
        default: false
        type: boolean
      rollback_target_sha:
        description: Exact target source SHA from a successful Native production deployment
        required: false
        type: string
      rollback_deployment_id:
        description: Exact successful GitHub production Deployment ID for the target SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gpoint-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (${{ matrix.suite }})
    # Both matrix legs run the same fail-closed intent step with identical event inputs.
    outputs:
      mode: ${{ steps.intent.outputs.mode }}
      deploy: ${{ steps.intent.outputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, python]
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: gpoint
          POSTGRES_USER: gpoint
          POSTGRES_PASSWORD: gpoint_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpoint -d gpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint
      SHADOW_DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint_shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed unless the event and complete path set allow a release
        id: intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          REQUESTED_SHA: ${{ inputs.candidate_sha || github.sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          MIGRATION_REHEARSAL: ${{ inputs.migration_rehearsal || false }}
          BACKUP_MAINTENANCE: ${{ inputs.backup_maintenance || false }}
          ROLLBACK: ${{ inputs.rollback || false }}
          ROLLBACK_EROS: ${{ inputs.rollback_eros || false }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production || false }}
          USE_PREPARED_IMAGES: ${{ inputs.use_prepared_images || false }}
          LAYER7_STAGING: ${{ inputs.deploy_layer7_staging || false }}
          APPROVE_LAYER7_STAGING: ${{ inputs.approve_layer7_staging || false }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT_NAME" --ref "$EVENT_REF" --sha "$EVENT_SHA"
            --before "$EVENT_BEFORE"
            --candidate-sha "$REQUESTED_SHA" --actor "$EVENT_ACTOR"
            --triggering-actor "$EVENT_TRIGGERING_ACTOR"
            --repository-owner "$REPOSITORY_OWNER")
          [[ -n "$EVENT_COMMIT_MESSAGE" ]] && args+=(--commit-message "$EVENT_COMMIT_MESSAGE")
          [[ "$MIGRATION_REHEARSAL" == true ]] && args+=(--migration-rehearsal)
          [[ "$BACKUP_MAINTENANCE" == true ]] && args+=(--backup-maintenance)
          [[ "$ROLLBACK" == true ]] && args+=(--rollback)
          [[ "$ROLLBACK_EROS" == true ]] && args+=(--rollback-eros)
          [[ "$APPROVE_PRODUCTION" == true ]] && args+=(--approve-production)
          [[ "$USE_PREPARED_IMAGES" == true ]] && args+=(--use-prepared-images)
          [[ "$LAYER7_STAGING" == true ]] && args+=(--layer7-staging)
          [[ "$APPROVE_LAYER7_STAGING" == true ]] && args+=(--approve-layer7-staging)
          python3 scripts/native_release_intent.py "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Seed pinned Go 1.25.3 in Actions tool cache
        if: matrix.suite == 'workspace'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-1.25.3-linux-x64.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/actions/go-versions/releases/assets/303957986 \
            --output "$archive"
          echo "1b6c5c84f587ab036ca904638a39cf4bd272d1e8d439eb9c8bc60f91793e0765  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TOOL_CACHE/go/1.25.3/x64"
          tar -xzf "$archive" -C "$RUNNER_TOOL_CACHE/go/1.25.3/x64"
          test "$("$RUNNER_TOOL_CACHE/go/1.25.3/x64/bin/go" version)" = 'go version go1.25.3 linux/amd64'
          touch "$RUNNER_TOOL_CACHE/go/1.25.3/x64.complete"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: matrix.suite == 'workspace'
        with:
          go-version: '1.25.3'
      - name: Validate GitHub Actions workflow
        if: matrix.suite == 'workspace'
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          .github/workflows/gpoint-native-release.yml
          .github/workflows/gpoint-first-kamal-cutover.yml
      - name: Validate pinned Kamal configs and shared proxy routing
        if: matrix.suite == 'workspace'
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          ./scripts/check-kamal-configs.sh
          ./scripts/test-kamal-proxy-integration.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: matrix.suite == 'workspace'
        with:
          platforms: linux/amd64
      - name: Build stock Eros and run isolated SQLx and synthetic conversation E2E
        if: matrix.suite == 'workspace'
        env:
          EROS_UPSTREAM_SHA: d1a140083321687212fb7b17c09cc0c3c9639f5e
        run: |
          set -euo pipefail
          image="gpoint-eros:stock-$EROS_UPSTREAM_SHA"
          docker buildx build --platform linux/amd64 --load \
            --file docker/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/etherfunlab/eros-engine \
            --label "org.opencontainers.image.revision=$EROS_UPSTREAM_SHA" \
            --label "com.gpoint.eros.upstream-revision=$EROS_UPSTREAM_SHA" \
            --label "com.gpoint.source.revision=$GITHUB_SHA" \
            --label com.gpoint.eros.patch-set.sha256=none \
            --tag "$image" \
            "https://github.com/etherfunlab/eros-engine.git#$EROS_UPSTREAM_SHA"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EROS_UPSTREAM_SHA"
          bash services/eros-engine/run-local-e2e.sh "$image"
          test_container="$(docker create "$image")"
          trap 'docker rm -f "$test_container" >/dev/null 2>&1 || true' EXIT
          python3 scripts/verify-eros-runtime-labels.py "$test_container" "$EROS_UPSTREAM_SHA" none
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: matrix.suite == 'workspace'
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.suite == 'workspace'
        with:
          node-version: 22
          cache: pnpm
      - name: Verify pinned pnpm
        if: matrix.suite == 'workspace'
        run: test "$(pnpm --version)" = "9.15.0"
      - name: Install workspace dependencies
        if: matrix.suite == 'workspace'
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and apply test migrations
        if: matrix.suite == 'workspace'
        run: |
          pnpm --filter @gpoint/db exec prisma generate
          pnpm --filter @gpoint/db exec prisma migrate deploy
          command -v createdb
          createdb --maintenance-db="$DATABASE_URL" --owner=gpoint gpoint_shadow
          pnpm --filter @gpoint/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
          pnpm --filter @gpoint/db exec prisma migrate deploy
          pnpm --filter @gpoint/db exec prisma migrate status
      - name: Build and typecheck workspace
        if: matrix.suite == 'workspace'
        run: |
          pnpm -r build
          pnpm -r typecheck
      - name: Run workspace tests
        if: matrix.suite == 'workspace'
        run: pnpm -r --if-present test
      - name: Run canonical release and static-parent tests
        if: matrix.suite == 'workspace'
        run: |
          pnpm test:release
          node --test scripts/release-component-bundle-v4.test.mjs scripts/release-static-v4.test.mjs
      - name: Install Playwright Chromium
        if: matrix.suite == 'workspace'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Mini App end-to-end tests
        if: matrix.suite == 'workspace'
        run: pnpm test:e2e

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: matrix.suite == 'python'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Install Python test dependencies
        if: matrix.suite == 'python'
        run: unset DATABASE_URL SHADOW_DATABASE_URL; python -m pip install './services/agata[test]' './services/gsales[test]' pyyaml
      - name: Test Native image read-back validation
        if: matrix.suite == 'python'
        run: |
          unset DATABASE_URL SHADOW_DATABASE_URL
          python tests/test_native_image_readback.py
          python tests/test_native_image_attestation.py
          python tests/test_native_eros_image.py
      - name: Install pinned ORAS for release evidence round-trip test
        if: matrix.suite == 'python'
        run: |
          set -euo pipefail
          unset DATABASE_URL SHADOW_DATABASE_URL
          archive="$RUNNER_TEMP/oras_1.3.0_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/oras-1.3.0"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --header 'Accept: application/octet-stream' \
            https://api.github.com/repos/oras-project/oras/releases/assets/290827355 \
            --output "$archive"
          printf '%s  %s\n' \
            '6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64' "$archive" \
            | sha256sum --check --status
          install -d "$install_dir"
          tar -xzf "$archive" -C "$install_dir" oras
          chmod 0755 "$install_dir/oras"
          "$install_dir/oras" version | grep -E 'Version:[[:space:]]+1\.3\.0([[:space:]]|$)' >/dev/null
          echo "ORAS_1_3_BIN=$install_dir/oras" >> "$GITHUB_ENV"
      - name: Run workflow, Native First and Kamal boundary tests
        if: matrix.suite == 'python'
        run: >-
          unset DATABASE_URL SHADOW_DATABASE_URL; python -m pytest -q
          tests/test_deploy_evidence_workflow.py
          tests/test_layer7_staging_workflow.py
          tests/test_layer7_staging_env.py
          tests/test_native_build_boundary.py
          tests/test_native_build_scope.py
          tests/test_native_release_intent.py
          tests/test_native_prepared_run.py
          tests/test_release_pre_push_mode.py
          tests/test_native_environment_deployment.py
          tests/test_native_prisma_apply_boundary.py
          tests/test_prisma_migration_release_plan.py
          tests/test_eros_pilot_no_agata_transfer.py
          tests/test_gpoint_scheduled_backup.py
          tests/test_agata_production_migration.py
          tests/test_agata_migration_receipt.py
          tests/test_kamal_native_automatic_release.py
          tests/test_eros_native_database_workflow.py
          tests/test_layer7_ollama_verifier.py
          tests/test_verify_kamal_production_baseline.py
          tests/test_native_rollback_evidence.py
          tests/test_kamal_release_config.py
          tests/test_kamal_cutover_owner.py
          tests/test_kamal_cutover_credentials.py
          tests/test_kamal_cutover_package.py
          tests/test_start_kamal_cutover_owner.py
          tests/test_kamal_production_manifest.py
          tests/test_kamal_ordinary_manifest.py
          tests/test_release_assets.py
          tests/test_gpoint_release_trigger_graph.py
      - name: Run isolated PostgreSQL 16 migration and integration suites
        if: matrix.suite == 'python'
        run: |
          unset DATABASE_URL SHADOW_DATABASE_URL
          python tests/integration/gpoint-chat-schema-docker.py --image pgvector/pgvector:0.8.6-pg16
          python services/gsales/tests/run_postgres.py

  build:
    name: Build and publish immutable images
    needs: [tests]
    if: needs.tests.outputs.mode == 'DEPLOY' || needs.tests.outputs.mode == 'REHEARSAL' || needs.tests.outputs.mode == 'ARTIFACT_PREPARE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      deployments: read
      actions: read
    outputs:
      app_digest: ${{ steps.app.outputs.digest || steps.prepared.outputs.app_digest }}
      agata_digest: ${{ steps.agata.outputs.digest || steps.prepared.outputs.agata_digest }}
      miniapp_digest: ${{ steps.miniapp.outputs.digest || steps.prepared.outputs.miniapp_digest }}
      eros_digest: ${{ steps.eros.outputs.digest || steps.prepared.outputs.eros_digest }}
      image_version: ${{ steps.image_version.outputs.image_version }}
      build_components: ${{ steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components }}
      baseline_mode: ${{ steps.build_scope.outputs.status || steps.rehearsal_scope.outputs.status }}
      baseline_sources: ${{ steps.build_scope.outputs.baseline_sources || steps.rehearsal_scope.outputs.baseline_sources }}
      deploy_scope: ${{ steps.build_scope.outputs.deploy_scope || steps.rehearsal_scope.outputs.deploy_scope }}
      app_image_bytes: ${{ steps.image_readback.outputs.app_image_bytes }}
      agata_image_bytes: ${{ steps.image_readback.outputs.agata_image_bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact production component build scope
        id: build_scope
        if: needs.tests.outputs.mode == 'DEPLOY' || needs.tests.outputs.mode == 'ARTIFACT_PREPARE'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          args=(--candidate-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--push-before "$EVENT_BEFORE")
          fi
          python3 scripts/resolve_native_build_scope.py "${args[@]}" \
            | tee "$RUNNER_TEMP/gpoint-build-scope.json"
          python3 - "$RUNNER_TEMP/gpoint-build-scope.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value.get("status") not in {"VERIFIED", "BOOTSTRAP_FULL", "VERIFY_ONLY"}:
              raise SystemExit("production component build scope is not verified")
          print("status=" + value["status"])
          print("build_components=" + json.dumps(value["build_components"], separators=(",", ":")))
          print("deploy_scope=" + value["deploy_scope"])
          print("baseline_sources=" + json.dumps(value.get("baseline_sources", {}), sort_keys=True, separators=(",", ":")))
          PY
      - name: Set full image scope for isolated migration rehearsal
        id: rehearsal_scope
        if: needs.tests.outputs.mode == 'REHEARSAL'
        run: |
          printf 'status=REHEARSAL\nbuild_components=["CORE","AGATA"]\ndeploy_scope=UNRESOLVED\nbaseline_sources={}\n' >> "$GITHUB_OUTPUT"
      - name: Validate exact prepared image digests
        id: prepared
        if: needs.tests.outputs.mode == 'DEPLOY' && inputs.use_prepared_images == true
        env:
          BUILD_COMPONENTS: ${{ steps.build_scope.outputs.build_components }}
          PREPARED_APP_DIGEST: ${{ inputs.prepared_app_digest }}
          PREPARED_AGATA_DIGEST: ${{ inputs.prepared_agata_digest }}
          PREPARED_MINIAPP_DIGEST: ${{ inputs.prepared_miniapp_digest }}
          PREPARED_EROS_DIGEST: ${{ inputs.prepared_eros_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from native_release_intent import validate_prepared_image_digests
          components = json.loads(os.environ["BUILD_COMPONENTS"])
          supplied = {component: os.environ[name] for component, name in {
              "CORE": "PREPARED_APP_DIGEST", "AGATA": "PREPARED_AGATA_DIGEST",
              "MINIAPP": "PREPARED_MINIAPP_DIGEST", "EROS": "PREPARED_EROS_DIGEST",
          }.items() if os.environ[name]}
          values = validate_prepared_image_digests(components, supplied)
          outputs = {"CORE": "app_digest", "AGATA": "agata_digest",
                     "MINIAPP": "miniapp_digest", "EROS": "eros_digest"}
          for component, digest in values.items():
              print(f"{outputs[component]}={digest}")
          PY
      - name: Reject unused prepared image digest inputs
        if: needs.tests.outputs.mode == 'DEPLOY' && inputs.use_prepared_images != true
        env:
          PREPARED_INPUTS: ${{ inputs.prepared_run_id }},${{ inputs.prepared_app_digest }},${{ inputs.prepared_agata_digest }},${{ inputs.prepared_miniapp_digest }},${{ inputs.prepared_eros_digest }}
        run: |
          test -z "${PREPARED_INPUTS//,/}" || {
            echo 'prepared image inputs require use_prepared_images=true' >&2; exit 1;
          }
      - name: Verify successful prepared run and its exact component digests
        id: prepared_run
        if: needs.tests.outputs.mode == 'DEPLOY' && inputs.use_prepared_images == true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          CANDIDATE_SHA: ${{ github.sha }}
          BUILD_COMPONENTS: ${{ steps.build_scope.outputs.build_components }}
          PREPARED_APP_DIGEST: ${{ inputs.prepared_app_digest }}
          PREPARED_AGATA_DIGEST: ${{ inputs.prepared_agata_digest }}
          PREPARED_MINIAPP_DIGEST: ${{ inputs.prepared_miniapp_digest }}
          PREPARED_EROS_DIGEST: ${{ inputs.prepared_eros_digest }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'prepared_run_id must be a positive run ID' >&2; exit 1; }
          run_json="$RUNNER_TEMP/prepared-run.json"
          jobs_json="$RUNNER_TEMP/prepared-jobs.json"
          commit_json="$RUNNER_TEMP/prepared-commit.json"
          logs="$RUNNER_TEMP/prepared-build-logs.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_RUN_ID" > "$run_json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_RUN_ID/jobs?per_page=100" > "$jobs_json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA" > "$commit_json"
          build_job_id="$(python3 - "$jobs_json" <<'PY'
          import json, sys
          jobs = json.load(open(sys.argv[1], encoding='utf-8')).get('jobs', [])
          matches = [job for job in jobs if job.get('name') == 'Build and publish immutable images']
          if len(matches) != 1 or not isinstance(matches[0].get('id'), int):
              raise SystemExit('prepared run must contain exactly one Native Build job')
          print(matches[0]['id'])
          PY
          )"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$build_job_id/logs" \
            --output "$logs"
          python3 scripts/verify_native_prepared_run.py \
            --run "$run_json" --jobs "$jobs_json" --commit "$commit_json" --logs "$logs" \
            --candidate-sha "$CANDIDATE_SHA" --run-id "$PREPARED_RUN_ID" \
            --output "$GITHUB_OUTPUT" \
            --digests "$(python3 - <<'PY'
          import json, os
          supplied = {'CORE': 'PREPARED_APP_DIGEST', 'AGATA': 'PREPARED_AGATA_DIGEST',
                      'MINIAPP': 'PREPARED_MINIAPP_DIGEST', 'EROS': 'PREPARED_EROS_DIGEST'}
          components = json.loads(os.environ['BUILD_COMPONENTS'])
          print(json.dumps({component: os.environ[name] for component, name in supplied.items()
                            if component in components and os.environ[name]}, sort_keys=True))
          PY
          )"
      - name: Select exact immutable image version
        id: image_version
        if: needs.tests.outputs.mode == 'DEPLOY'
        env:
          USE_PREPARED_IMAGES: ${{ inputs.use_prepared_images }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_IMAGE_VERSION: ${{ steps.prepared_run.outputs.image_version }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$USE_PREPARED_IMAGES" == true ]]; then
            [[ "$PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREPARED_IMAGE_VERSION" =~ ^${CANDIDATE_SHA}-${PREPARED_RUN_ID}-[1-9][0-9]*$ ]] || {
              echo 'prepared image version does not match candidate SHA and prepared run ID' >&2; exit 1;
            }
            image_version="$PREPARED_IMAGE_VERSION"
          else
            image_version="${CANDIDATE_SHA}-${CURRENT_RUN_ID}-${CURRENT_RUN_ATTEMPT}"
          fi
          printf 'image_version=%s\n' "$image_version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.build_scope.outputs.build_components != '[]' || steps.rehearsal_scope.outputs.build_components != '[]'
        with:
          platforms: linux/amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: steps.build_scope.outputs.build_components != '[]' || steps.rehearsal_scope.outputs.build_components != '[]'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create dependency-manifest build context
        if: contains(fromJSON(steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components), 'CORE') || contains(fromJSON(steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components), 'MINIAPP')
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - name: Build and publish immutable runtime image
        if: contains(fromJSON(steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components), 'CORE') && inputs.use_prepared_images != true
        id: app
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          target: runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-core
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable Mini App image
        if: contains(fromJSON(steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components), 'MINIAPP') && inputs.use_prepared_images != true
        id: miniapp
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          target: miniapp-runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-miniapp
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-miniapp,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable AGATA image
        if: contains(fromJSON(steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components), 'AGATA') && inputs.use_prepared_images != true
        id: agata
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}:services/agata
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-agata
          cache-from: type=gha,scope=gpoint-agata-runtime
          cache-to: type=gha,scope=gpoint-agata-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish stock Eros image
        if: contains(fromJSON(steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components), 'EROS') && inputs.use_prepared_images != true
        id: eros
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/etherfunlab/eros-engine.git#d1a140083321687212fb7b17c09cc0c3c9639f5e
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-eros:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-eros:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/etherfunlab/eros-engine
            org.opencontainers.image.revision=d1a140083321687212fb7b17c09cc0c3c9639f5e
            com.gpoint.source.revision=${{ github.sha }}
            com.gpoint.eros.upstream-revision=d1a140083321687212fb7b17c09cc0c3c9639f5e
            com.gpoint.eros.patch-set.sha256=none
          cache-from: type=gha,scope=gpoint-eros-stock
          cache-to: type=gha,scope=gpoint-eros-stock,mode=max
          sbom: true
          provenance: mode=max
      - name: Validate immutable image identity and expose digests
        if: steps.build_scope.outputs.build_components != '[]' || steps.rehearsal_scope.outputs.build_components != '[]'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest || steps.prepared.outputs.app_digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest || steps.prepared.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest || steps.prepared.outputs.miniapp_digest }}
          EROS_DIGEST: ${{ steps.eros.outputs.digest || steps.prepared.outputs.eros_digest }}
          BUILD_COMPONENTS: ${{ steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['CANDIDATE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate SHA is not exact')
          components = set(__import__('json').loads(os.environ['BUILD_COMPONENTS']))
          for component, name in {'CORE': 'APP_DIGEST', 'AGATA': 'AGATA_DIGEST', 'MINIAPP': 'MINIAPP_DIGEST', 'EROS': 'EROS_DIGEST'}.items():
              if component in components and not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable OCI digest')
          for component, name in {'CORE': 'APP_DIGEST', 'AGATA': 'AGATA_DIGEST', 'MINIAPP': 'MINIAPP_DIGEST', 'EROS': 'EROS_DIGEST'}.items():
              if component in components:
                  image = "ghcr.io/akhripunov/" + ("gpoint-runtime" if component == "CORE" else "gpoint-agata-runtime" if component == "AGATA" else "gpoint-miniapp" if component == "MINIAPP" else "gpoint-eros") + "@" + os.environ[name]
                  line = f"GPOINT_IMAGE_DIGEST {component} {image}"
                  print(line)
                  print(f"{component}_IMAGE={image}", file=open(os.environ['GITHUB_STEP_SUMMARY'], 'a'))
          PY
      - name: Read back exact published images and verify candidate identity
        id: image_readback
        if: steps.build_scope.outputs.build_components != '[]' || steps.rehearsal_scope.outputs.build_components != '[]'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APP_DIGEST: ${{ steps.app.outputs.digest || steps.prepared.outputs.app_digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest || steps.prepared.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest || steps.prepared.outputs.miniapp_digest }}
          EROS_DIGEST: ${{ steps.eros.outputs.digest || steps.prepared.outputs.eros_digest }}
          REUSE_PREPARED_IMAGES: ${{ inputs.use_prepared_images || false }}
          BUILD_COMPONENTS: ${{ steps.build_scope.outputs.build_components || steps.rehearsal_scope.outputs.build_components }}
        run: |
          set -euo pipefail
          for role in $(python3 -c 'import json,sys; print(" ".join({"CORE":"app","AGATA":"agata","MINIAPP":"miniapp","EROS":"eros"}[x] for x in json.loads(sys.argv[1])) )' "$BUILD_COMPONENTS"); do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) image=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
              miniapp) image=ghcr.io/akhripunov/gpoint-miniapp; digest="$MINIAPP_DIGEST" ;;
              eros) image=ghcr.io/akhripunov/gpoint-eros; digest="$EROS_DIGEST" ;;
            esac
            docker pull --platform linux/amd64 "$image@$digest"
            if [[ "$REUSE_PREPARED_IMAGES" != true ]]; then
              docker pull --platform linux/amd64 "$image:$IMAGE_VERSION"
              docker image inspect "$image:$IMAGE_VERSION" --format '{{json .RepoDigests}}' | grep -F "$image@$digest" >/dev/null
            fi
            docker image inspect --format '{{json .}}' "$image@$digest" > "$RUNNER_TEMP/$role-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-provenance.json"
            if [[ "$role" == eros ]]; then
              python3 scripts/verify_native_eros_image.py \
                "$RUNNER_TEMP/$role-image.json" "$RUNNER_TEMP/$role-sbom.json" \
                "$RUNNER_TEMP/$role-provenance.json" "$digest" "$CANDIDATE_SHA"
            else
              python3 scripts/verify_native_image_readback.py \
                "$RUNNER_TEMP/$role-image.json" "$image" "$digest" "$CANDIDATE_SHA"
              python3 scripts/verify_native_image_attestation.py \
                "$RUNNER_TEMP/$role-sbom.json" "$RUNNER_TEMP/$role-provenance.json" \
                "$CANDIDATE_SHA" https://github.com/akhripunov/gpoint.git
            fi
          done
          for role in $(python3 -c 'import json,sys; print(" ".join({"CORE":"app","AGATA":"agata"}[x] for x in json.loads(sys.argv[1]) if x in {"CORE","AGATA"}))' "$BUILD_COMPONENTS"); do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) image=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
            esac
            image_bytes="$(docker image inspect "$image@$digest" --format '{{.Size}}')"
            [[ "$image_bytes" =~ ^[0-9]+$ ]]
            echo "${role}_image_bytes=$image_bytes" >> "$GITHUB_OUTPUT"
          done

  deploy:
    name: Kamal production Deploy and Verify
    needs: [tests, build]
    if: needs.tests.outputs.deploy == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.migration_rehearsal != true && inputs.backup_maintenance != true))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.verify.outputs.environment_url }}
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      actions: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      IMAGE_VERSION: ${{ needs.build.outputs.image_version }}
      GPOINT_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      GPOINT_APP_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GPOINT_SSH_KEY: /root/.ssh/id_ed25519
      GPOINT_KNOWN_HOSTS_FILE: /root/.ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact SHA, current main and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production || false }}
          OWNER_APPROVAL_ACTOR: ${{ github.actor }}
          OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER_REPOSITORY: ${{ github.repository_owner }}
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$APPROVE_PRODUCTION" = true
          elif [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo 'unsupported production release event' >&2; exit 1
          fi
          test "$OWNER_APPROVAL_ACTOR" = "$OWNER_REPOSITORY" || {
            echo 'production release actor must match the repository owner' >&2; exit 1;
          }
          test "$OWNER_TRIGGERING_ACTOR" = "$OWNER_REPOSITORY" || {
            echo 'production release triggering actor must match the repository owner' >&2; exit 1;
          }
          test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REQUESTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Install pinned AGATA Alembic graph dependencies
        run: python -m pip install ./services/agata
      - name: Install verified Kamal SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          [[ "$GPOINT_PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host ${GPOINT_PRODUCTION_HOST}
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Pull and verify pinned Kamal CLI image
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$KAMAL_IMAGE"
          echo "KAMAL_IMAGE_PULL=PASS PLATFORM=linux/amd64 DIGEST=sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625"
      - name: Read live application version and containers with Kamal
        id: kamal_inventory
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          kamal() {
            docker run --rm \
              --pull=never \
              --platform linux/amd64 \
              --volume "$GITHUB_WORKSPACE:/workdir" \
              --volume "$HOME/.ssh:/root/.ssh:ro" \
              --volume "$HOME/.ssh:$HOME/.ssh:ro" \
              --workdir /workdir \
              --env GPOINT_COMMIT_SHA \
              --env GPOINT_APP_SOURCE_SHA \
              --env KAMAL_REGISTRY_PASSWORD \
              --env GPOINT_PRODUCTION_HOST \
              --env GPOINT_SSH_KEY \
              --env GPOINT_KNOWN_HOSTS_FILE \
              "$KAMAL_IMAGE" "$@"
          }
          for config in config/deploy.yml config/deploy.agata.yml config/deploy.miniapp.yml; do
            case "$config" in
              config/deploy.yml)
                version_output=core_version
                roles=(gpoint-core-api gpoint-core-worker gpoint-core-bot)
                ;;
              config/deploy.agata.yml)
                version_output=agata_version
                roles=(gpoint-agata-api gpoint-agata-memory-worker)
                ;;
              config/deploy.miniapp.yml)
                version_output=miniapp_version
                roles=(gpoint-miniapp-web)
                ;;
            esac
            if version_text="$(kamal app version --config-file "$config" 2>&1)"; then
              version_status=0
            else
              version_status=$?
            fi
            if [[ "$version_status" != 0 ]]; then
              safe_error="$(printf '%s' "$version_text" | python3 -c '
          import os, re, sys
          message = sys.stdin.read()
          for name in ("GPOINT_PRODUCTION_HOST", "KAMAL_REGISTRY_PASSWORD"):
              secret = os.environ.get(name)
              if secret:
                  message = message.replace(secret, "[redacted]")
          message = re.sub(r"(?i)\b(password|token|secret|authorization)\b\s*[:=]\s*\S+", r"\1=[redacted]", message)
          message = re.sub(r"-----BEGIN [^-]+-----.*?-----END [^-]+-----", "[redacted]", message, flags=re.S)
          message = re.sub(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", "[redacted-ip]", message)
          lines = message.splitlines()[-12:]
          print(" | ".join(" ".join(line.split()) for line in lines)[-1800:])
          ')"
              [[ -n "$safe_error" ]] || safe_error="no command output"
              echo "Kamal app version command failed for $config (exit=$version_status): $safe_error" >&2
              exit "$version_status"
            fi
            mapfile -t versions < <(grep -Eo '[0-9a-f]{40}-[0-9]+-[0-9]+' <<< "$version_text" | sort -u)
            if [[ "${#versions[@]}" != 1 ]]; then
              echo "Kamal inventory could not resolve one exact current version for $config (matches=${#versions[@]})." >&2
              exit 1
            fi
            version="${versions[0]}"
            details="$(kamal app details --config-file "$config")"
            containers="$(kamal app containers --config-file "$config")"
            if [[ -z "$details" || -z "$containers" ]]; then
              echo "Kamal inventory returned empty details or container output for $config." >&2
              exit 1
            fi
            for role in "${roles[@]}"; do
              if ! grep -F -- "$role-$version" <<< "$details" >/dev/null; then
                echo "Kamal inventory details do not include expected role/version: $role-$version." >&2
                exit 1
              fi
              if ! grep -F -- "$role-$version" <<< "$containers" >/dev/null; then
                echo "Kamal inventory containers do not include expected role/version: $role-$version." >&2
                exit 1
              fi
            done
            printf '%s=%s\n' "$version_output" "$version" >> "$GITHUB_OUTPUT"
            {
              printf '### Kamal inventory: %s\n\n' "$config"
              printf 'Current version:\n\n\140\140\140text\n%s\n\140\140\140\n\nContainers:\n\n\140\140\140text\n%s\n\140\140\140\n\nDetails:\n\n\140\140\140text\n%s\n\140\140\140\n\n' \
                "$version" "$containers" "$details"
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Verify installed Kamal topology before ordinary release
        id: topology
        env:
          KAMAL_CORE_VERSION: ${{ steps.kamal_inventory.outputs.core_version }}
          KAMAL_AGATA_VERSION: ${{ steps.kamal_inventory.outputs.agata_version }}
          KAMAL_MINIAPP_VERSION: ${{ steps.kamal_inventory.outputs.miniapp_version }}
        run: |
          set -euo pipefail
          role_inventory="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - < "$GITHUB_WORKSPACE/scripts/verify-kamal-production-baseline.py")"
          python3 - "$role_inventory" <<'PY'
          import json, os, re, sys
          roles = json.loads(sys.argv[1])["roles"]
          for role, expected in {
              "gpoint-core-api": os.environ["KAMAL_CORE_VERSION"],
              "gpoint-agata-api": os.environ["KAMAL_AGATA_VERSION"],
              "gpoint-miniapp-web": os.environ["KAMAL_MINIAPP_VERSION"],
          }.items():
              if not re.fullmatch(r"[0-9a-f]{40}-[0-9]+-[0-9]+", expected):
                  raise SystemExit("Kamal-reported runtime version is malformed")
              if roles[role]["version"] != expected:
                  raise SystemExit("Kamal CLI version differs from verified running role inventory")
          PY
          baseline_values="$(python3 -c 'import json,re,sys; d=json.loads(sys.argv[1]); roles=d["roles"]; base={"gpoint-core-api","gpoint-core-worker","gpoint-core-bot","gpoint-agata-api","gpoint-agata-memory-worker","gpoint-miniapp-web"}; eros={"gpoint-eros-pilot-engine","gpoint-eros-relay-relay"}; assert set(roles) in (base,base|eros); core=roles["gpoint-core-api"]; v=core["version"]; s=core["source_sha"]; assert re.fullmatch(r"[0-9a-f]{40}-[0-9]+-[0-9]+",v); assert re.fullmatch(r"[0-9a-f]{40}",s); engine=roles.get("gpoint-eros-pilot-engine"); es=engine["source_sha"] if engine else s; ev=engine["version"] if engine else "ABSENT"; print(v+"\t"+s+"\t"+ev+"\t"+es+"\t"+str(bool(engine)).lower())' "$role_inventory")"
          IFS=$'\t' read -r baseline_version baseline_source_sha eros_version eros_source_sha eros_installed <<< "$baseline_values"
          test -n "$baseline_version" && test -n "$baseline_source_sha"
          [[ "$eros_installed" == true || "$eros_installed" == false ]]
          if [[ "$eros_installed" == true ]]; then
            [[ "$eros_version" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
            for pair in "config/deploy.eros.yml|gpoint-eros-pilot-engine" "config/deploy.eros-relay.yml|gpoint-eros-relay-relay"; do
              IFS='|' read -r config expected <<< "$pair"
              output="$(docker run --rm --pull=never --platform linux/amd64 --volume "$GITHUB_WORKSPACE:/workdir" --volume "$HOME/.ssh:/root/.ssh:ro" --workdir /workdir --env GPOINT_COMMIT_SHA --env GPOINT_APP_SOURCE_SHA --env GPOINT_PRODUCTION_HOST --env GPOINT_SSH_KEY --env GPOINT_KNOWN_HOSTS_FILE --env KAMAL_REGISTRY_PASSWORD ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625 app version --config-file "$config")"
              grep -F "$expected-$eros_version" <<< "$output" >/dev/null
            done
          else
            test "$eros_version" = ABSENT
          fi
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$baseline_version" "$baseline_source_sha" <<'REMOTE'
          set -euo pipefail
