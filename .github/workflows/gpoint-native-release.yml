          test "$APPLY" = true
          [[ "$APP_IMAGE" =~ ^ghcr\.io/akhripunov/gpoint-runtime@sha256:[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_PRISMA_HEAD" =~ ^[0-9]{14}_[a-z0-9_]+$ ]]
          [[ "$BASELINE_AGATA_HEAD" =~ ^[A-Za-z0-9_]+$ ]]
