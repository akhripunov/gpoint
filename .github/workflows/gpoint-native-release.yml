          expected_checksums="$baseline_checksums,$pending_checksums"
          expected_head="${pending##*,}"
          expected_head="${expected_head%%=*}"
          test "$prisma_migrations" = "$expected_migrations" || { echo 'post-Apply Prisma migration inventory differs from the authorized pending set' >&2; exit 1; }
          test "$prisma_checksums" = "$expected_checksums" || { echo 'post-Apply Prisma checksums differ from the authorized pending set' >&2; exit 1; }
          test "$prisma_head" = "$expected_head" || { echo 'post-Apply Prisma head differs from the exact candidate plan' >&2; exit 1; }
