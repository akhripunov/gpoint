name: GPoint Native Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      mode:
        description: Select a read-only preflight or exact-SHA production Deploy
        required: true
        type: choice
        options:
          - preflight
          - production
      approve_production:
        description: I authorize this exact candidate SHA on GPoint production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gpoint-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workspace:
    name: Workspace, Prisma and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: gpoint
          POSTGRES_USER: gpoint
          POSTGRES_PASSWORD: gpoint_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpoint -d gpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.3'
      - name: Validate GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/gpoint-native-release.yml
      - name: Validate pinned Kamal configs and shared proxy routing
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          docker run --rm --volume "$GITHUB_WORKSPACE:/workdir" --workdir /workdir \
            --env GPOINT_COMMIT_SHA="$GITHUB_SHA" \
            --env GPOINT_SSH_KEY=/tmp/not-used-by-config-check \
            --env GPOINT_KNOWN_HOSTS_FILE=/dev/null \
            --env KAMAL_REGISTRY_PASSWORD=config-validation-placeholder \
            "$KAMAL_IMAGE" config --config-file config/deploy.yml >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workdir" --workdir /workdir \
            --env GPOINT_COMMIT_SHA="$GITHUB_SHA" \
            --env GPOINT_SSH_KEY=/tmp/not-used-by-config-check \
            --env GPOINT_KNOWN_HOSTS_FILE=/dev/null \
            --env KAMAL_REGISTRY_PASSWORD=config-validation-placeholder \
            "$KAMAL_IMAGE" config --config-file config/deploy.agata.yml >/dev/null
          docker run --rm --volume "$GITHUB_WORKSPACE:/workdir" --workdir /workdir \
            --env GPOINT_COMMIT_SHA="$GITHUB_SHA" \
            --env GPOINT_SSH_KEY=/tmp/not-used-by-config-check \
            --env GPOINT_KNOWN_HOSTS_FILE=/dev/null \
            --env KAMAL_REGISTRY_PASSWORD=config-validation-placeholder \
            "$KAMAL_IMAGE" config --config-file config/deploy.miniapp.yml >/dev/null
          ./scripts/test-kamal-proxy-integration.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Verify pinned pnpm
        run: test "$(pnpm --version)" = "9.15.0"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and apply test migrations
        run: |
          pnpm --filter @gpoint/db exec prisma generate
          pnpm --filter @gpoint/db exec prisma migrate deploy
      - name: Build and typecheck workspace
        run: |
          pnpm -r build
          pnpm -r typecheck
      - name: Run workspace tests
        run: pnpm -r --if-present test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Mini App end-to-end tests
        run: pnpm test:e2e

  python:
    name: Python, PostgreSQL 16 and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Install Python test dependencies
        run: python -m pip install './services/agata[test]' './services/gsales[test]'
      - name: Test Native image read-back validation
        run: |
          python tests/test_native_image_readback.py
          python tests/test_native_image_attestation.py
      - name: Run isolated PostgreSQL 16 migration and integration suites
        run: python services/gsales/tests/run_postgres.py

  build:
    name: Build and publish immutable images
    needs: [workspace, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      agata_digest: ${{ steps.agata.outputs.digest }}
      gsales_digest: ${{ steps.gsales.outputs.digest }}
      miniapp_digest: ${{ steps.miniapp.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          platforms: linux/amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - name: Build and publish immutable runtime image
        id: app
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable Mini App image
        id: miniapp
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          target: miniapp-runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-miniapp,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable AGATA image
        id: agata
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}:services/agata
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-agata-runtime
          cache-to: type=gha,scope=gpoint-agata-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable GSales image without starting it
        id: gsales
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}:services/gsales
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-g-sales-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-g-sales-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-g-sales-runtime
          cache-to: type=gha,scope=gpoint-g-sales-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Validate immutable image identity and expose digests
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          GSALES_DIGEST: ${{ steps.gsales.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['CANDIDATE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate SHA is not exact')
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'GSALES_DIGEST', 'MINIAPP_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable OCI digest')
          PY
      - name: Read back exact published images and verify candidate identity
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          GSALES_DIGEST: ${{ steps.gsales.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
        run: |
          set -euo pipefail
          for role in app agata gsales miniapp; do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) image=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
              gsales) image=ghcr.io/akhripunov/gpoint-g-sales-runtime; digest="$GSALES_DIGEST" ;;
              miniapp) image=ghcr.io/akhripunov/gpoint-miniapp; digest="$MINIAPP_DIGEST" ;;
            esac
            docker pull --platform linux/amd64 "$image@$digest"
            docker pull --platform linux/amd64 "$image:$IMAGE_VERSION"
            docker image inspect "$image:$IMAGE_VERSION" --format '{{json .RepoDigests}}' | grep -Fq "$image@$digest"
            docker image inspect --format '{{json .}}' "$image@$digest" > "$RUNNER_TEMP/$role-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-provenance.json"
            python3 scripts/verify_native_image_readback.py \
              "$RUNNER_TEMP/$role-image.json" "$image" "$digest" "$CANDIDATE_SHA"
            python3 scripts/verify_native_image_attestation.py \
              "$RUNNER_TEMP/$role-sbom.json" "$RUNNER_TEMP/$role-provenance.json" \
              "$CANDIDATE_SHA" https://github.com/akhripunov/gpoint.git
          done

  deploy:
    name: Kamal production Deploy and Verify
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      IMAGE_VERSION: ${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      GPOINT_COMMIT_SHA: ${{ inputs.candidate_sha }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GPOINT_SSH_KEY: /root/.ssh/id_ed25519
      GPOINT_KNOWN_HOSTS_FILE: /root/.ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Reject a candidate that differs from the requested exact SHA
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
          printf '%s\n' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Recheck owner authorization and current main for production mode
        if: inputs.mode == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          OWNER_APPROVAL_ACTOR: ${{ github.actor }}
          OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER_REPOSITORY: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$APPROVE_PRODUCTION" = true
          test "$OWNER_APPROVAL_ACTOR" = "$OWNER_REPOSITORY"
          test "$OWNER_TRIGGERING_ACTOR" = "$OWNER_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
      - name: Verify immutable image outputs for the requested candidate
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          GSALES_DIGEST: ${{ needs.build.outputs.gsales_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          python3 - <<'PY'
          import os, re
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'GSALES_DIGEST', 'MINIAPP_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable digest')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              for name in ('APP_DIGEST', 'AGATA_DIGEST', 'GSALES_DIGEST', 'MINIAPP_DIGEST'):
                  summary.write(f"- {name}: `{os.environ[name]}`\n")
          PY
      - name: State that production Apply is not authorized in preflight mode
        if: inputs.mode == 'preflight'
        run: |
          test "${{ inputs.mode }}" = preflight
          echo 'PRODUCTION_APPLY=NOT_AUTHORIZED' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify GHCR candidate tags resolve to the exact digests
        if: inputs.mode == 'production'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for item in \
            "ghcr.io/akhripunov/gpoint-runtime|$APP_DIGEST" \
            "ghcr.io/akhripunov/gpoint-agata-runtime|$AGATA_DIGEST" \
            "ghcr.io/akhripunov/gpoint-miniapp|$MINIAPP_DIGEST"; do
            IFS='|' read -r repository digest <<< "$item"
            docker pull --platform linux/amd64 "$repository@$digest"
            docker pull --platform linux/amd64 "$repository:$IMAGE_VERSION"
            actual="$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .RepoDigests 0}}')"
            test "$actual" = "$repository@$digest"
            source_sha="$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$source_sha" = "$CANDIDATE_SHA"
          done
      - name: Install verified Kamal SSH credentials
        if: inputs.mode == 'production'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host 38.180.110.92
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Block unsafe first cutover and preserve stopped GSales
        if: inputs.mode == 'production'
        run: |
          set -euo pipefail
          ssh -T root@38.180.110.92 bash -s <<'REMOTE'
          set -euo pipefail
          for service in api worker bot agata-api agata-memory-worker; do
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              name="$(docker inspect --format '{{.Name}}' "$id" | sed 's#^/##')"
              running="$(docker inspect --format '{{.State.Running}}' "$id")"
              if [[ "$running" == true ]]; then
                echo "Active legacy GPoint service $name requires the approved first-cutover inventory, backup/restore and migration procedure." >&2
                exit 1
              fi
            done < <(docker ps -aq --filter "label=com.docker.compose.service=$service")
          done
          for service in gsales-api gsales-agata-api gsales-agata-memory-worker; do
            ids="$(docker ps -aq --filter "label=com.docker.compose.service=$service")"
            test -n "$ids" || { echo "Expected stopped GSales service is missing: $service" >&2; exit 1; }
            while IFS= read -r id; do
              test "$(docker inspect --format '{{.State.Running}}' "$id")" = false
            done <<< "$ids"
          done
          REMOTE
      - name: Create exact-SHA in-progress GitHub Deployment
        if: inputs.mode == 'production'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "$CANDIDATE_SHA" '{ref:$ref, task:"deploy", environment:"production", auto_merge:false, required_contexts:[]}')"
          deployment_id="$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - <<<"$payload" --jq .id)"
          test "$deployment_id" -gt 0
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=in_progress -f environment=production \
            -f description="Kamal Deploy started after Native First CI/Build PASS" >/dev/null
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Deploy request-serving Kamal roles
        if: inputs.mode == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          kamal() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workdir" \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$HOME/.ssh:/root/.ssh:ro" \
              --volume "$HOME/.docker:/root/.docker:ro" \
              --workdir /workdir \
              --env GPOINT_COMMIT_SHA --env GPOINT_SSH_KEY \
              --env GPOINT_KNOWN_HOSTS_FILE --env KAMAL_REGISTRY_PASSWORD \
              --env GPOINT_KAMAL_SERVICE --env GPOINT_KAMAL_EXPECTED_DIGEST --env KAMAL_ROLES \
              ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625 \
              "$@"
          }
          kamal config --config-file config/deploy.yml >/dev/null
          kamal config --config-file config/deploy.agata.yml >/dev/null
          kamal config --config-file config/deploy.miniapp.yml >/dev/null
          GPOINT_KAMAL_EXPECTED_DIGEST="$APP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=api \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles api --config-file config/deploy.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=api \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles api --config-file config/deploy.agata.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$MINIAPP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-miniapp KAMAL_ROLES=web \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles web --config-file config/deploy.miniapp.yml
      - name: Apply candidate Caddyfile after request-serving roles are deployed
        if: inputs.mode == 'production'
        run: |
          set -euo pipefail
          caddy_sha="$(sha256sum infra/production/Caddyfile | awk '{print $1}')"
          remote_file="/tmp/gpoint-caddy-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_script="${remote_file}.apply.sh"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${ssh_opts[@]}" scripts/apply-kamal-caddy.sh "root@38.180.110.92:$remote_script"
          scp "${ssh_opts[@]}" infra/production/Caddyfile "root@38.180.110.92:$remote_file"
          ssh -T "${ssh_opts[@]}" root@38.180.110.92 bash "$remote_script" \
            "$CANDIDATE_SHA" "$caddy_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$remote_file"
      - name: Verify request-serving routes before starting consumers
        if: inputs.mode == 'production'
        run: |
          set -euo pipefail
          curl --retry 12 --retry-connrefused --retry-delay 5 --fail --silent --show-error \
            https://gpoint.amiora.one/api/health/live | grep -Fq '"status":"ok"'
          for path in / /creators; do
            curl --retry 6 --retry-connrefused --retry-delay 2 --fail --silent --show-error \
              "https://gpoint.amiora.one$path" | grep -Fq '<div id="root">'
          done
      - name: Start Kamal consumers after request-serving verification
        if: inputs.mode == 'production'
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
        run: |
          set -euo pipefail
          kamal() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workdir" \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$HOME/.ssh:/root/.ssh:ro" \
              --volume "$HOME/.docker:/root/.docker:ro" \
              --workdir /workdir \
              --env GPOINT_COMMIT_SHA --env GPOINT_SSH_KEY \
              --env GPOINT_KNOWN_HOSTS_FILE --env KAMAL_REGISTRY_PASSWORD \
              --env GPOINT_KAMAL_SERVICE --env GPOINT_KAMAL_EXPECTED_DIGEST --env KAMAL_ROLES \
              ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625 \
              "$@"
          }
          GPOINT_KAMAL_EXPECTED_DIGEST="$APP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=worker,bot \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles worker,bot --config-file config/deploy.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=memory-worker \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles memory-worker --config-file config/deploy.agata.yml
      - name: Verify public routes and exact running services
        if: inputs.mode == 'production'
        id: verify
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          curl --retry 12 --retry-connrefused --retry-delay 5 --fail --silent --show-error https://gpoint.amiora.one/api/health/live | grep -Fq '"status":"ok"'
          for path in / /creators; do
            curl --retry 6 --retry-connrefused --retry-delay 2 --fail --silent --show-error "https://gpoint.amiora.one$path" | grep -Fq '<div id="root">'
          done
          ssh -T root@38.180.110.92 bash -s -- "$CANDIDATE_SHA" "$IMAGE_VERSION" "$APP_DIGEST" "$AGATA_DIGEST" "$MINIAPP_DIGEST" <<'REMOTE'
          set -euo pipefail
          sha="$1"; version="$2"; app="$3"; agata="$4"; miniapp="$5"
          for item in \
            "gpoint-core|api|ghcr.io/akhripunov/gpoint-runtime|$app" \
            "gpoint-core|worker|ghcr.io/akhripunov/gpoint-runtime|$app" \
            "gpoint-core|bot|ghcr.io/akhripunov/gpoint-runtime|$app" \
            "gpoint-agata|api|ghcr.io/akhripunov/gpoint-agata-runtime|$agata" \
            "gpoint-agata|memory-worker|ghcr.io/akhripunov/gpoint-agata-runtime|$agata" \
            "gpoint-miniapp|web|ghcr.io/akhripunov/gpoint-miniapp|$miniapp"; do
            IFS='|' read -r service role repository digest <<< "$item"
            container="$service-$role-$version"
            docker inspect "$container" >/dev/null
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$container")" = "$sha"
            image_id="$(docker inspect --format '{{.Image}}' "$container")"
            docker image inspect "$image_id" --format '{{json .RepoDigests}}' | grep -Fq "$repository@$digest"
            case "$service:$role" in
              gpoint-core:api)
                mounts="$(docker inspect --format '{{json .Mounts}}' "$container")"
                grep -Fq '/opt/gpoint/media' <<< "$mounts"
                echo 'GPOINT_KAMAL_MOUNT_CHECK=PASS'
                api_aliases="$(docker inspect --format '{{json (index .NetworkSettings.Networks "gpoint_app").Aliases}}' "$container")"
                networks="$(docker inspect --format '{{json .NetworkSettings.Networks}}' "$container")"
                grep -Fq 'shared_internal' <<< "$networks"
                grep -Eq '"api"' <<< "$api_aliases"
                echo 'GPOINT_KAMAL_NETWORK_ALIAS_CHECK=PASS'
                docker exec "$container" node -e "fetch('http://127.0.0.1:3000/health/live').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))" ;;
              gpoint-core:worker) docker top "$container" | grep -Fq 'apps/worker/dist/main.js' ;;
              gpoint-core:bot) docker top "$container" | grep -Fq 'apps/bot/dist/main.js' ;;
              gpoint-agata:api)
                aliases="$(docker inspect --format '{{json (index .NetworkSettings.Networks "shared_internal").Aliases}}' "$container")"
                grep -Eq '"agata-api"' <<< "$aliases"
                docker exec "$container" python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3); assert r.status == 200" ;;
              gpoint-agata:memory-worker) docker exec "$container" python -m app.memory.worker --healthcheck ;;
              gpoint-miniapp:web) docker exec "$container" wget --spider --quiet http://127.0.0.1/ ;;
            esac
          done
          REMOTE
          echo "GPOINT_KAMAL_VERIFY=PASS SHA=$CANDIDATE_SHA"
      - name: Record GitHub Deployment result against the same attempt
        if: always() && inputs.mode == 'production' && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$DEPLOY_JOB_STATUS" == success && "$VERIFY_OUTCOME" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -f environment=production \
            -f description="Kamal $state for exact SHA $CANDIDATE_SHA" >/dev/null
