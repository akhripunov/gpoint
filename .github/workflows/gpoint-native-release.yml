          set -euo pipefail
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$TARGET_SHA" "$TARGET_VERSION" "$CORE_DIGEST" "$AGATA_DIGEST" "$MINIAPP_DIGEST" <<'REMOTE'
          set -euo pipefail
          sha="$1"; version="$2"; core="ghcr.io/akhripunov/gpoint-runtime@$3"; agata="ghcr.io/akhripunov/gpoint-agata-runtime@$4"; miniapp="ghcr.io/akhripunov/gpoint-miniapp@$5"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$version" == "$sha"-* ]]
