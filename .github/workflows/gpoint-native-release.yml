name: GPoint Native Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      approve_production:
        description: I authorize this exact candidate SHA on GPoint production
        required: true
        default: false
        type: boolean
      migration_rehearsal:
        description: Restore the existing verified VPS backup and rehearse pending migrations in an isolated database only
        required: true
        default: false
        type: boolean
      backup_maintenance:
        description: Install or update the scheduled VPS backup service only
        required: true
        default: false
        type: boolean
      rollback:
        description: Roll back to a previously verified successful Native production release
        required: true
        default: false
        type: boolean
      rollback_target_sha:
        description: Exact target source SHA from a successful Native production deployment
        required: false
        type: string
      rollback_deployment_id:
        description: Exact successful GitHub production Deployment ID for the target SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gpoint-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workspace:
    name: Workspace, Prisma and Playwright
    outputs:
      mode: ${{ steps.intent.outputs.mode }}
      deploy: ${{ steps.intent.outputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: gpoint
          POSTGRES_USER: gpoint
          POSTGRES_PASSWORD: gpoint_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpoint -d gpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed unless the event and complete path set allow a release
        id: intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          REQUESTED_SHA: ${{ inputs.candidate_sha || github.sha }}
          EVENT_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          MIGRATION_REHEARSAL: ${{ inputs.migration_rehearsal || false }}
          BACKUP_MAINTENANCE: ${{ inputs.backup_maintenance || false }}
          ROLLBACK: ${{ inputs.rollback || false }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production || false }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT_NAME" --ref "$EVENT_REF" --sha "$EVENT_SHA"
            --before "$EVENT_BEFORE"
            --candidate-sha "$REQUESTED_SHA" --actor "$EVENT_ACTOR"
            --repository-owner "$REPOSITORY_OWNER")
          [[ "$MIGRATION_REHEARSAL" == true ]] && args+=(--migration-rehearsal)
          [[ "$BACKUP_MAINTENANCE" == true ]] && args+=(--backup-maintenance)
          [[ "$ROLLBACK" == true ]] && args+=(--rollback)
          [[ "$APPROVE_PRODUCTION" == true ]] && args+=(--approve-production)
          python3 scripts/native_release_intent.py "${args[@]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.3'
      - name: Validate GitHub Actions workflow
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          .github/workflows/gpoint-native-release.yml
          .github/workflows/gpoint-first-kamal-cutover.yml
      - name: Validate pinned Kamal configs and shared proxy routing
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          ./scripts/check-kamal-configs.sh
          ./scripts/test-kamal-proxy-integration.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Verify pinned pnpm
        run: test "$(pnpm --version)" = "9.15.0"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and apply test migrations
        run: |
          pnpm --filter @gpoint/db exec prisma generate
          pnpm --filter @gpoint/db exec prisma migrate deploy
      - name: Build and typecheck workspace
        run: |
          pnpm -r build
          pnpm -r typecheck
      - name: Run workspace tests
        run: pnpm -r --if-present test
      - name: Run canonical release and static-parent tests
        run: |
          pnpm test:release
          node --test scripts/release-component-bundle-v4.test.mjs scripts/release-static-v4.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Mini App end-to-end tests
        run: pnpm test:e2e

  python:
    name: Python, PostgreSQL 16 and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Install Python test dependencies
        run: python -m pip install './services/agata[test]' './services/gsales[test]' pyyaml
      - name: Test Native image read-back validation
        run: |
          python tests/test_native_image_readback.py
          python tests/test_native_image_attestation.py
      - name: Install pinned ORAS for release evidence round-trip test
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oras_1.3.0_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/oras-1.3.0"
          curl --fail --silent --show-error --location \
            https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64' "$archive" \
            | sha256sum --check --status
          install -d "$install_dir"
          tar -xzf "$archive" -C "$install_dir" oras
          chmod 0755 "$install_dir/oras"
          "$install_dir/oras" version | grep -E 'Version:[[:space:]]+1\.3\.0([[:space:]]|$)' >/dev/null
          echo "ORAS_1_3_BIN=$install_dir/oras" >> "$GITHUB_ENV"
      - name: Run workflow, Native First and Kamal boundary tests
        run: >-
          python -m pytest -q
          tests/test_deploy_evidence_workflow.py
          tests/test_native_build_boundary.py
          tests/test_native_release_intent.py
          tests/test_gpoint_scheduled_backup.py
          tests/test_agata_production_migration.py
          tests/test_agata_migration_receipt.py
          tests/test_kamal_native_automatic_release.py
          tests/test_verify_kamal_production_baseline.py
          tests/test_native_rollback_evidence.py
          tests/test_kamal_release_config.py
          tests/test_kamal_cutover_owner.py
          tests/test_kamal_cutover_credentials.py
          tests/test_kamal_cutover_package.py
          tests/test_start_kamal_cutover_owner.py
          tests/test_kamal_production_manifest.py
          tests/test_kamal_ordinary_manifest.py
          tests/test_release_assets.py
          tests/test_gpoint_release_trigger_graph.py
      - name: Run isolated PostgreSQL 16 migration and integration suites
        run: python services/gsales/tests/run_postgres.py

  build:
    name: Build and publish immutable images
    needs: [workspace, python]
    if: needs.workspace.outputs.mode == 'DEPLOY' || needs.workspace.outputs.mode == 'REHEARSAL'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      agata_digest: ${{ steps.agata.outputs.digest }}
      miniapp_digest: ${{ steps.miniapp.outputs.digest }}
      app_image_bytes: ${{ steps.image_readback.outputs.app_image_bytes }}
      agata_image_bytes: ${{ steps.image_readback.outputs.agata_image_bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          platforms: linux/amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - name: Build and publish immutable runtime image
        id: app
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          target: runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-core
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable Mini App image
        id: miniapp
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          target: miniapp-runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-miniapp
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-miniapp,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable AGATA image
        id: agata
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}:services/agata
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}
            ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-agata
          cache-from: type=gha,scope=gpoint-agata-runtime
          cache-to: type=gha,scope=gpoint-agata-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Validate immutable image identity and expose digests
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['CANDIDATE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate SHA is not exact')
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'MINIAPP_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable OCI digest')
          PY
      - name: Read back exact published images and verify candidate identity
        id: image_readback
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          MINIAPP_DIGEST: ${{ steps.miniapp.outputs.digest }}
        run: |
          set -euo pipefail
          for role in app agata miniapp; do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) image=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
              miniapp) image=ghcr.io/akhripunov/gpoint-miniapp; digest="$MINIAPP_DIGEST" ;;
            esac
            docker pull --platform linux/amd64 "$image@$digest"
            docker pull --platform linux/amd64 "$image:$IMAGE_VERSION"
            docker image inspect "$image:$IMAGE_VERSION" --format '{{json .RepoDigests}}' | grep -F "$image@$digest" >/dev/null
            docker image inspect --format '{{json .}}' "$image@$digest" > "$RUNNER_TEMP/$role-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-provenance.json"
            python3 scripts/verify_native_image_readback.py \
              "$RUNNER_TEMP/$role-image.json" "$image" "$digest" "$CANDIDATE_SHA"
            python3 scripts/verify_native_image_attestation.py \
              "$RUNNER_TEMP/$role-sbom.json" "$RUNNER_TEMP/$role-provenance.json" \
              "$CANDIDATE_SHA" https://github.com/akhripunov/gpoint.git
          done
          for role in app agata; do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) image=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
            esac
            image_bytes="$(docker image inspect "$image@$digest" --format '{{.Size}}')"
            [[ "$image_bytes" =~ ^[0-9]+$ ]]
            echo "${role}_image_bytes=$image_bytes" >> "$GITHUB_OUTPUT"
          done

  deploy:
    name: Kamal production Deploy and Verify
    needs: [workspace, python, build]
    if: needs.workspace.outputs.deploy == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.migration_rehearsal != true && inputs.backup_maintenance != true))
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      IMAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      GPOINT_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      GPOINT_APP_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GPOINT_SSH_KEY: /root/.ssh/id_ed25519
      GPOINT_KNOWN_HOSTS_FILE: /root/.ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact SHA, current main and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production || false }}
          OWNER_APPROVAL_ACTOR: ${{ github.actor }}
          OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER_REPOSITORY: ${{ github.repository_owner }}
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$APPROVE_PRODUCTION" = true
            test "$OWNER_APPROVAL_ACTOR" = "$OWNER_REPOSITORY"
            test "$OWNER_TRIGGERING_ACTOR" = "$OWNER_REPOSITORY"
          elif [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo 'unsupported production release event' >&2; exit 1
          fi
          test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REQUESTED_SHA"
      - name: Verify immutable image outputs for the requested candidate
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          python3 - <<'PY'
          import os, re
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'MINIAPP_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable digest')
          PY
      - name: Verify GHCR candidate tags resolve to exact amd64 digests
        id: imageverify
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for item in \
            "ghcr.io/akhripunov/gpoint-runtime|$APP_DIGEST" \
            "ghcr.io/akhripunov/gpoint-agata-runtime|$AGATA_DIGEST" \
            "ghcr.io/akhripunov/gpoint-miniapp|$MINIAPP_DIGEST"; do
            IFS='|' read -r repository digest <<< "$item"
            docker pull --platform linux/amd64 "$repository@$digest"
            docker pull --platform linux/amd64 "$repository:$IMAGE_VERSION"
            actual="$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .RepoDigests 0}}')"
            test "$actual" = "$repository@$digest"
            source_sha="$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$source_sha" = "$CANDIDATE_SHA"
          done
      - name: Install verified Kamal SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          [[ "$GPOINT_PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host ${GPOINT_PRODUCTION_HOST}
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Verify installed Kamal topology before ordinary release
        id: topology
        run: |
          set -euo pipefail
          role_inventory="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - < "$GITHUB_WORKSPACE/scripts/verify-kamal-production-baseline.py")"
          baseline_values="$(python3 -c 'import json,re,sys; d=json.loads(sys.argv[1]); assert set(d["roles"]) == {"gpoint-core-api","gpoint-core-worker","gpoint-core-bot","gpoint-agata-api","gpoint-agata-memory-worker","gpoint-miniapp-web"}; v=d["version"]; s=d["source_sha"]; assert re.fullmatch(r"[0-9a-f]{40}-[0-9]+-[0-9]+",v); assert re.fullmatch(r"[0-9a-f]{40}",s); print(v+"\t"+s)' "$role_inventory")"
          IFS=$'\t' read -r baseline_version baseline_source_sha <<< "$baseline_values"
          test -n "$baseline_version" && test -n "$baseline_source_sha"
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$baseline_version" "$baseline_source_sha" <<'REMOTE'
          set -euo pipefail
          baseline_version="$1"
          baseline_source_sha="$2"
          if systemctl is-active --quiet caddy; then
            echo 'Caddy must be inactive after the first Kamal cutover' >&2; exit 1
          fi
          test "$(docker inspect --format '{{.State.Running}}' kamal-proxy)" = true
          test "$(docker inspect --format '{{.State.Running}}' shared_postgres_1)" = true
          test "$(docker inspect --format '{{.State.Running}}' shared_redis_1)" = true
          for service in api worker bot agata-api agata-memory-worker; do
            ids="$(docker ps -aq --filter label=com.docker.compose.project=compose --filter "label=com.docker.compose.service=$service")"
            test -n "$ids" || { echo "expected stopped legacy Compose service is missing: $service" >&2; exit 1; }
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              test "$(docker inspect --format '{{.State.Running}}' "$id")" = false || {
                echo "legacy Compose service is still active: $service" >&2; exit 1;
              }
            done <<< "$ids"
          done
          [[ "$baseline_version" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$baseline_source_sha" =~ ^[0-9a-f]{40}$ ]]
          db_id="$(docker inspect --format '{{.Id}}' shared_postgres_1)"
          redis_id="$(docker inspect --format '{{.Id}}' shared_redis_1)"
          db_mounts="$(docker inspect shared_postgres_1 --format '{{json .Mounts}}')"
          redis_mounts="$(docker inspect shared_redis_1 --format '{{json .Mounts}}')"
          db_mounts_sha="$(python3 -c 'import hashlib,json,sys; a=json.loads(sys.argv[1]); rows=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a), key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert rows and all(x["Source"] and x["Destination"] for x in rows); print(hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest())' "$db_mounts")"
          redis_mounts_sha="$(python3 -c 'import hashlib,json,sys; a=json.loads(sys.argv[1]); rows=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a), key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert rows and all(x["Source"] and x["Destination"] for x in rows); print(hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest())' "$redis_mounts")"
          echo "DB_CONTAINER_ID=$db_id"
          echo "REDIS_CONTAINER_ID=$redis_id"
          echo "GPOINT_BASELINE_ROLE_VERSION=$baseline_version"
          echo "GPOINT_BASELINE_ROLE_SOURCE_SHA=$baseline_source_sha"
          echo "DB_MOUNTS_SHA256=$db_mounts_sha"
          echo "REDIS_MOUNTS_SHA256=$redis_mounts_sha"
          REMOTE
          )"
          grep -Eq '^DB_CONTAINER_ID=[0-9a-f]{64}$' <<< "$facts"
          grep -Eq '^REDIS_CONTAINER_ID=[0-9a-f]{64}$' <<< "$facts"
          grep -Eq '^GPOINT_BASELINE_ROLE_VERSION=[0-9a-f]{40}-[0-9]+-[0-9]+$' <<< "$facts"
          grep -Eq '^GPOINT_BASELINE_ROLE_SOURCE_SHA=[0-9a-f]{40}$' <<< "$facts"
          grep -Eq '^DB_MOUNTS_SHA256=[0-9a-f]{64}$' <<< "$facts"
          grep -Eq '^REDIS_MOUNTS_SHA256=[0-9a-f]{64}$' <<< "$facts"
          printf 'GPOINT_BASELINE_ROLE_INVENTORY=%s\n' "$role_inventory" >> "$GITHUB_OUTPUT"
          while IFS='=' read -r key value; do
            case "$key" in
              DB_CONTAINER_ID|REDIS_CONTAINER_ID|GPOINT_BASELINE_ROLE_VERSION|GPOINT_BASELINE_ROLE_SOURCE_SHA|DB_MOUNTS_SHA256|REDIS_MOUNTS_SHA256) printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT" ;;
              *) echo 'unexpected topology fact' >&2; exit 1 ;;
            esac
          done <<< "$facts"
      - name: Verify candidate compatibility with the live database baseline
        id: migration_baseline
        env:
          GH_TOKEN: ${{ github.token }}
          APP_IMAGE: ghcr.io/akhripunov/gpoint-runtime@${{ needs.build.outputs.app_digest }}
          AGATA_IMAGE: ghcr.io/akhripunov/gpoint-agata-runtime@${{ needs.build.outputs.agata_digest }}
          BASELINE_SOURCE_SHA: ${{ steps.topology.outputs.GPOINT_BASELINE_ROLE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$APP_IMAGE" "$AGATA_IMAGE" <<'REMOTE'
          set -euo pipefail
          app_image="$1"; agata_image="$2"
          api_image="$(docker inspect --format '{{.Config.Image}}' "$(docker ps -q --filter 'name=^/gpoint-core-api-' | head -1)")"
          test -n "$api_image"
          current="$(docker run --rm --network shared_internal --env-file /opt/gpoint/env/production.env --workdir /app/apps/api "$api_image" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const failed=await db.$queryRawUnsafe("SELECT count(*)::int AS count FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL");if(failed[0].count!==0)throw Error("unfinished Prisma migration exists");const rows=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const head=rows.length?rows[rows.length-1].migration_name:"NONE";const a=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(a.length!==1)throw Error("AGATA head is not singular");console.log("PRISMA_HEAD="+head);console.log("PRISMA_MIGRATIONS="+rows.map(x=>x.migration_name).join(","));console.log("PRISMA_CHECKSUMS="+rows.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("AGATA_HEAD="+a[0].version_num)}catch(e){console.error("READ_ONLY_DATABASE_BASELINE_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          printf '%s\n' "$current"
          REMOTE
          )"
          prisma_head="$(sed -n 's/^PRISMA_HEAD=//p' <<< "$facts")"
          prisma_migrations="$(sed -n 's/^PRISMA_MIGRATIONS=//p' <<< "$facts")"
          prisma_checksums="$(sed -n 's/^PRISMA_CHECKSUMS=//p' <<< "$facts")"
          agata_head="$(sed -n 's/^AGATA_HEAD=//p' <<< "$facts")"
          test -n "$prisma_head" && test -n "$prisma_migrations" && test -n "$agata_head"
          test -n "$prisma_checksums"
          [[ "$BASELINE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$agata_head" =~ ^[A-Za-z0-9_]+$ ]]
          agata_checksums=""
          if [[ "$agata_head" == agata0012 ]] && ! git cat-file -e "$BASELINE_SOURCE_SHA:services/agata/migrations/versions/0012_eros_memory_disclosure.py" 2>/dev/null; then
            mapfile -t receipt_sources < <(git rev-list --first-parent --max-count=64 "$CANDIDATE_SHA")
            receipt_proof="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - --read-agata-ancestor-receipt \
              "$agata_head" "${receipt_sources[@]}" \
              < "$GITHUB_WORKSPACE/scripts/verify-kamal-migration-parity.py")"
            [[ "$receipt_proof" =~ ^([0-9a-f]{40}):(agata0012=([0-9a-f]{64}))$ ]]
            receipt_source="${BASH_REMATCH[1]}"; agata_checksums="${BASH_REMATCH[2]}"; receipt_checksum="${BASH_REMATCH[3]}"
            git merge-base --is-ancestor "$receipt_source" "$CANDIDATE_SHA"
            migration_path=services/agata/migrations/versions/0012_eros_memory_disclosure.py
            test "$(git show "$receipt_source:$migration_path" | sha256sum | cut -d' ' -f1)" = "$receipt_checksum"
            test "$(sha256sum "$migration_path" | cut -d' ' -f1)" = "$receipt_checksum"
          fi
          python3 scripts/verify-kamal-migration-parity.py \
            --policy compatible \
            --repo-root "$GITHUB_WORKSPACE" \
            --baseline-source-sha "$BASELINE_SOURCE_SHA" \
            --candidate-source-sha "$CANDIDATE_SHA" \
            --prisma-directory packages/db/prisma/migrations \
            --prisma-current-migrations "$prisma_migrations" \
            --prisma-current-checksums "$prisma_checksums" \
            --prisma-current-head "$prisma_head" \
            --agata-directory services/agata/migrations/versions \
            --agata-current-head "$agata_head" \
            --agata-current-checksums "$agata_checksums"
          {
            echo "prisma_head=$prisma_head"
            echo "prisma_migrations=$prisma_migrations"
            echo "prisma_checksums=$prisma_checksums"
            echo "agata_head=$agata_head"
          } >> "$GITHUB_OUTPUT"
      - name: Create exact-SHA in-progress GitHub Deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "$CANDIDATE_SHA" '{ref:$ref, task:"deploy", environment:"production", auto_merge:false, required_contexts:[]}')"
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - <<<"$payload" --jq .id)"
          test "$id" -gt 0
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=in_progress -f environment=production -f description="Kamal deploy in progress for exact SHA $CANDIDATE_SHA" >/dev/null
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy exact immutable images with stock Kamal
        id: kamal_apply
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
        run: |
          set -euo pipefail
          kamal() {
            docker run --rm --volume "$GITHUB_WORKSPACE:/workdir" --volume "$HOME/.ssh:/root/.ssh:ro" --volume "$HOME/.ssh:$HOME/.ssh:ro" \
              --workdir /workdir --env GPOINT_COMMIT_SHA --env GPOINT_APP_SOURCE_SHA --env GPOINT_PRODUCTION_HOST \
              --env GPOINT_SSH_KEY --env GPOINT_KNOWN_HOSTS_FILE --env KAMAL_REGISTRY_PASSWORD \
              --env GPOINT_KAMAL_EXPECTED_DIGEST --env GPOINT_KAMAL_SERVICE --env KAMAL_ROLES \
              ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625 "$@"
          }
          GPOINT_KAMAL_EXPECTED_DIGEST="$APP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=api \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles api --config-file config/deploy.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=api \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles api --config-file config/deploy.agata.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$MINIAPP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-miniapp KAMAL_ROLES=web \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles web --config-file config/deploy.miniapp.yml
          verify_single_running_role() {
            ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$@" \
              < "$GITHUB_WORKSPACE/scripts/verify-kamal-role.sh"
          }
          GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=worker kamal app stop --roles worker --config-file config/deploy.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$APP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=worker \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles worker --config-file config/deploy.yml
          verify_single_running_role gpoint-core-worker "$IMAGE_VERSION" "$GPOINT_COMMIT_SHA"
          GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=bot kamal app stop --roles bot --config-file config/deploy.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$APP_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-core KAMAL_ROLES=bot \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles bot --config-file config/deploy.yml
          verify_single_running_role gpoint-core-bot "$IMAGE_VERSION" "$GPOINT_COMMIT_SHA"
          GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=memory-worker kamal app stop --roles memory-worker --config-file config/deploy.agata.yml
          GPOINT_KAMAL_EXPECTED_DIGEST="$AGATA_DIGEST" GPOINT_KAMAL_SERVICE=gpoint-agata KAMAL_ROLES=memory-worker \
            kamal deploy --skip-push --version "$IMAGE_VERSION" --roles memory-worker --config-file config/deploy.agata.yml
          verify_single_running_role gpoint-agata-memory-worker "$IMAGE_VERSION" "$GPOINT_COMMIT_SHA"
      - name: Verify public routes and exact running services
        id: verify
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
          DB_CONTAINER_ID: ${{ steps.topology.outputs.DB_CONTAINER_ID }}
          REDIS_CONTAINER_ID: ${{ steps.topology.outputs.REDIS_CONTAINER_ID }}
          DB_MOUNTS_SHA256: ${{ steps.topology.outputs.DB_MOUNTS_SHA256 }}
          REDIS_MOUNTS_SHA256: ${{ steps.topology.outputs.REDIS_MOUNTS_SHA256 }}
          BASELINE_ROLE_VERSION: ${{ steps.topology.outputs.GPOINT_BASELINE_ROLE_VERSION }}
          BASELINE_ROLE_SOURCE_SHA: ${{ steps.topology.outputs.GPOINT_BASELINE_ROLE_SOURCE_SHA }}
          BASELINE_PRISMA_HEAD: ${{ steps.migration_baseline.outputs.prisma_head }}
          BASELINE_PRISMA_MIGRATIONS: ${{ steps.migration_baseline.outputs.prisma_migrations }}
          BASELINE_PRISMA_CHECKSUMS: ${{ steps.migration_baseline.outputs.prisma_checksums }}
          BASELINE_AGATA_HEAD: ${{ steps.migration_baseline.outputs.agata_head }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          curl --retry 12 --retry-connrefused --retry-delay 5 --fail --silent --show-error https://gpoint.one/api/health/live | grep -F '"status":"ok"' >/dev/null
          for path in / /creators; do
            curl --retry 6 --retry-connrefused --retry-delay 2 --fail --silent --show-error "https://gpoint.one$path" | grep -F '<div id="root">' >/dev/null
          done
          media_body="$RUNNER_TEMP/gpoint-media-route-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          media_status="$(curl --retry 6 --retry-connrefused --retry-delay 2 --silent --show-error \
            --output "$media_body" --write-out '%{http_code}' \
            https://gpoint.one/media/assets/kamal-route-verification-missing)"
          test "$media_status" = 404
          grep -Fq '"message":"media not found"' "$media_body"
          writer_remote="/run/gpoint-ordinary-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$writer_remote" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE_WRITER_CHECK'
          set -euo pipefail
          [[ "$1" == "/run/gpoint-ordinary-manifest-${2}-${3}.py" ]]
          [[ "$2" =~ ^[0-9]+$ && "$3" =~ ^[0-9]+$ ]]
          test ! -e "$1"
          REMOTE_WRITER_CHECK
          scp -p scripts/write-kamal-production-manifest.py "root@${GPOINT_PRODUCTION_HOST}:$writer_remote"
          writer_sha="$(sha256sum scripts/write-kamal-production-manifest.py | awk '{print $1}')"
          remote_writer_sha="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" sha256sum "$writer_remote" | awk '{print $1}')"
          test "$writer_sha" = "$remote_writer_sha"
          test -n "$BASELINE_PRISMA_HEAD" && test -n "$BASELINE_PRISMA_MIGRATIONS" && test -n "$BASELINE_PRISMA_CHECKSUMS" && test -n "$BASELINE_AGATA_HEAD"
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$CANDIDATE_SHA" "$IMAGE_VERSION" "$APP_DIGEST" "$AGATA_DIGEST" "$MINIAPP_DIGEST" "$DB_CONTAINER_ID" "$REDIS_CONTAINER_ID" "$DEPLOYMENT_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$writer_remote" "$BASELINE_PRISMA_MIGRATIONS" "$BASELINE_PRISMA_CHECKSUMS" "$BASELINE_PRISMA_HEAD" "$BASELINE_AGATA_HEAD" "$BASELINE_ROLE_VERSION" "$BASELINE_ROLE_SOURCE_SHA" "$DB_MOUNTS_SHA256" "$REDIS_MOUNTS_SHA256" <<'REMOTE'
          set -euo pipefail
          sha="$1"; version="$2"; app="$3"; agata="$4"; miniapp="$5"; db_id="$6"; redis_id="$7"; deployment_id="$8"; run_id="$9"; attempt="${10}"; writer="${11}"
          expected_prisma_migrations="${12}"; expected_prisma_checksums="${13}"; expected_prisma_head="${14}"; expected_agata_head="${15}"
          BASELINE_ROLE_VERSION="${16}"; BASELINE_ROLE_SOURCE_SHA="${17}"; DB_MOUNTS_SHA256="${18}"; REDIS_MOUNTS_SHA256="${19}"
          [[ "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]]
          [[ "$writer" == "/run/gpoint-ordinary-manifest-${run_id}-${attempt}.py" ]]
          test -s "$writer"
          test "$(docker inspect --format '{{.Id}}' shared_postgres_1)" = "$db_id"
          test "$(docker inspect --format '{{.Id}}' shared_redis_1)" = "$redis_id"
          test "$(docker inspect --format '{{.State.Running}}' shared_postgres_1)" = true
          test "$(docker inspect --format '{{.State.Running}}' shared_redis_1)" = true
          [[ "$BASELINE_ROLE_VERSION" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$BASELINE_ROLE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DB_MOUNTS_SHA256" =~ ^[0-9a-f]{64}$ && "$REDIS_MOUNTS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          db_mounts_sha="$(docker inspect shared_postgres_1 --format '{{json .Mounts}}' | python3 -c 'import hashlib,json,sys; a=json.load(sys.stdin); rows=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a), key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert rows and all(x["Source"] and x["Destination"] for x in rows); print(hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          redis_mounts_sha="$(docker inspect shared_redis_1 --format '{{json .Mounts}}' | python3 -c 'import hashlib,json,sys; a=json.load(sys.stdin); rows=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a), key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert rows and all(x["Source"] and x["Destination"] for x in rows); print(hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          test "$db_mounts_sha" = "$DB_MOUNTS_SHA256" || { echo 'PostgreSQL persistence identity changed during Kamal apply' >&2; exit 1; }
          test "$redis_mounts_sha" = "$REDIS_MOUNTS_SHA256" || { echo 'Redis persistence identity changed during Kamal apply' >&2; exit 1; }
          test "$(docker inspect --format '{{.State.Running}}' kamal-proxy)" = true
          test "$(docker ps -q --filter 'name=^/kamal-proxy$' | wc -l | tr -d ' ')" = 1
          test "$(docker ps -q --filter label=com.docker.compose.project=shared --filter label=com.docker.compose.service=postgres | wc -l | tr -d ' ')" = 1
          test "$(docker ps -q --filter label=com.docker.compose.project=shared --filter label=com.docker.compose.service=redis | wc -l | tr -d ' ')" = 1
          if systemctl is-active --quiet caddy; then echo 'Caddy is active on ordinary Kamal topology' >&2; exit 1; fi
          for item in \
            "gpoint-core-api|ghcr.io/akhripunov/gpoint-runtime|$app" \
            "gpoint-core-worker|ghcr.io/akhripunov/gpoint-runtime|$app" \
            "gpoint-core-bot|ghcr.io/akhripunov/gpoint-runtime|$app" \
            "gpoint-agata-api|ghcr.io/akhripunov/gpoint-agata-runtime|$agata" \
            "gpoint-agata-memory-worker|ghcr.io/akhripunov/gpoint-agata-runtime|$agata" \
            "gpoint-miniapp-web|ghcr.io/akhripunov/gpoint-miniapp|$miniapp"; do
            IFS='|' read -r prefix repository digest <<< "$item"
            container="$(docker ps -q --filter "name=^/${prefix}-${version}$")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$container")" = "$sha"
            image_id="$(docker inspect --format '{{.Image}}' "$container")"
            docker image inspect "$image_id" --format '{{json .RepoDigests}}' | grep -F "$repository@$digest" >/dev/null
            running_count="$(docker ps -q --filter "name=^/${prefix}-" | wc -l | tr -d ' ')"
            test "$running_count" = 1 || { echo "duplicate running Kamal role: $prefix" >&2; exit 1; }
          done
          docker exec kamal-proxy kamal-proxy list | grep -F 'gpoint-miniapp' >/dev/null
          docker exec kamal-proxy kamal-proxy list | grep -F 'gpoint-core' >/dev/null
          docker inspect shared_postgres_1 --format '{{range .Mounts}}{{.Type}} {{.Name}} {{.Source}} {{.Destination}}{{"\n"}}{{end}}' | grep . >/dev/null
          docker inspect shared_redis_1 --format '{{range .Mounts}}{{.Type}} {{.Name}} {{.Source}} {{.Destination}}{{"\n"}}{{end}}' | grep . >/dev/null
          db_mounts="$(docker inspect shared_postgres_1 --format '{{json .Mounts}}')"
          redis_mounts="$(docker inspect shared_redis_1 --format '{{json .Mounts}}')"
          python3 - "$db_mounts" "$redis_mounts" <<'PY'
          import json, sys
          for name, raw in zip(('PostgreSQL', 'Redis'), sys.argv[1:]):
              mounts=json.loads(raw)
              if not mounts or any(not item.get('Source') or not item.get('Destination') for item in mounts):
                  raise SystemExit(f'{name} persistent mount inventory is incomplete')
              if not any(item.get('Type') in ('volume', 'bind') for item in mounts):
                  raise SystemExit(f'{name} has no persistent volume or bind mount')
          PY
          docker exec "gpoint-core-api-$version" node -e "fetch('http://127.0.0.1:3000/health/live').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"
          docker top "gpoint-core-worker-$version" -eo pid,args | grep -F "apps/worker/dist/main.js"
          docker top "gpoint-core-bot-$version" -eo pid,args | grep -F "apps/bot/dist/main.js"
          docker exec "gpoint-agata-api-$version" python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3); assert r.status == 200"
          docker exec "gpoint-agata-memory-worker-$version" python -m app.memory.worker --healthcheck
          docker exec "gpoint-miniapp-web-$version" wget --spider --quiet http://127.0.0.1/
          docker exec "gpoint-core-api-$version" node -e 'const fs=require("node:fs");const crypto=require("node:crypto");const p="/data/media/.gpoint-runtime-verify-"+crypto.randomUUID();let created=false;try{fs.writeFileSync(p,"gpoint-media-read-write-pass",{flag:"wx"});created=true;if(fs.readFileSync(p,"utf8")!=="gpoint-media-read-write-pass")process.exit(1)}finally{if(created)fs.unlinkSync(p)}'
          media_mounts="$(docker inspect "gpoint-core-api-$version" --format '{{json .Mounts}}')"
          python3 - "$media_mounts" <<'PY'
          import json, sys
          mounts=json.loads(sys.argv[1])
          rows=[m for m in mounts if m.get('Destination') == '/data/media']
          if len(rows)!=1 or rows[0].get('Type')!='bind' or rows[0].get('Source')!='/opt/gpoint/media' or rows[0].get('RW') is not True:
              raise SystemExit('Kamal Core API does not have the exact writable GPoint media bind mount')
          PY
          proxy_networks="$(docker inspect kamal-proxy --format '{{json .NetworkSettings.Networks}}')"
          core_networks="$(docker inspect "gpoint-core-api-$version" --format '{{json .NetworkSettings.Networks}}')"
          miniapp_networks="$(docker inspect "gpoint-miniapp-web-$version" --format '{{json .NetworkSettings.Networks}}')"
          python3 - "$proxy_networks" "$core_networks" "$miniapp_networks" <<'PY'
          import json, sys
          proxy, core, miniapp = (set(json.loads(value)) for value in sys.argv[1:])
          if not proxy.intersection(core) or not proxy.intersection(miniapp):
              raise SystemExit('Kamal Proxy is not connected to both Core API and Mini App networks')
          PY
          runtime_db="$(docker exec --workdir /app/apps/api "gpoint-core-api-$version" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const failed=await db.$queryRawUnsafe("SELECT count(*)::int AS count FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL");if(failed[0].count!==0)throw Error("unfinished Prisma migration exists");const rows=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const head=rows.length?rows[rows.length-1].migration_name:"NONE";const a=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(a.length!==1)throw Error("AGATA head is not singular");console.log("PRISMA_HEAD="+head);console.log("PRISMA_MIGRATIONS="+rows.map(x=>x.migration_name).join(","));console.log("PRISMA_CHECKSUMS="+rows.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("AGATA_HEAD="+a[0].version_num)}catch(e){console.error("POST_DEPLOY_DATABASE_VERIFY_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          prisma_head="$(sed -n 's/^PRISMA_HEAD=//p' <<< "$runtime_db")"
