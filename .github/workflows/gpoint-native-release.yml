              *) echo 'unexpected topology fact' >&2; exit 1 ;;
            esac
          done <<< "$facts"
      - name: Plan exact component-scoped Kamal update from live baseline
        id: component_plan
        env:
          BASELINE_ROLE_INVENTORY: ${{ steps.topology.outputs.GPOINT_BASELINE_ROLE_INVENTORY }}
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
          EROS_DIGEST: ${{ needs.build.outputs.eros_digest }}
          BUILD_COMPONENTS: ${{ needs.build.outputs.build_components }}
          BASELINE_MODE: ${{ needs.build.outputs.baseline_mode }}
          BUILD_BASELINE_SOURCES: ${{ needs.build.outputs.baseline_sources }}
          BUILD_DEPLOY_SCOPE: ${{ needs.build.outputs.deploy_scope }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from native_release_intent import COMPONENT_ROLES, classify_component_scope, expected_runtime_inventory_b64

          candidate = os.environ["CANDIDATE_SHA"]
          baseline = json.loads(os.environ["BASELINE_ROLE_INVENTORY"])
          scope = classify_component_scope(Path.cwd(), candidate, baseline)
          builds = set(json.loads(os.environ["BUILD_COMPONENTS"]))
          scope_components = set(scope["scope"].split("+")) - {"NONE"}
          if not scope_components.issubset(builds):
              raise SystemExit("fresh live component scope is missing a prebuilt candidate image")
          live_sources = {
              component: baseline["roles"][roles[0]]["source_sha"]
              for component, roles in COMPONENT_ROLES.items()
          }
          live_sources["EROS"] = (baseline["roles"]["gpoint-eros-pilot-engine"]["source_sha"]
                                  if "gpoint-eros-pilot-engine" in baseline["roles"]
                                  else live_sources["CORE"])
          mode = os.environ["BASELINE_MODE"]
          if mode == "VERIFIED":
              expected_sources = json.loads(os.environ["BUILD_BASELINE_SOURCES"])
              if live_sources != expected_sources:
                  raise SystemExit("live production component sources changed after Build")
              if scope["scope"] != os.environ["BUILD_DEPLOY_SCOPE"]:
                  raise SystemExit("live production deploy scope differs from pre-build scope")
          elif mode == "BOOTSTRAP_FULL":
              if not set(COMPONENT_ROLES).issubset(builds):
                  raise SystemExit("bootstrap release must build every GPoint runtime image")
          elif mode == "VERIFY_ONLY":
              if builds or scope["scope"] != "NONE":
                  raise SystemExit("verify-only candidate has a changed live runtime component")
          else:
              raise SystemExit("production component baseline mode is unsupported")
          effective = {}
          names = {"CORE": ("APP_DIGEST", "app_digest", "ghcr.io/akhripunov/gpoint-runtime"),
                   "AGATA": ("AGATA_DIGEST", "agata_digest", "ghcr.io/akhripunov/gpoint-agata-runtime"),
                   "MINIAPP": ("MINIAPP_DIGEST", "miniapp_digest", "ghcr.io/akhripunov/gpoint-miniapp"),
                   "EROS": ("EROS_DIGEST", "eros_digest", "ghcr.io/akhripunov/gpoint-eros")}
          for component, (env_name, output_name, repository) in names.items():
              if component in scope_components or (component == "CORE" and "EROS" in scope_components):
                  digest = os.environ[env_name]
              elif component == "EROS" and "gpoint-eros-pilot-engine" not in baseline["roles"]:
                  digest = ""
              else:
                  role = ("gpoint-eros-pilot-engine" if component == "EROS" else COMPONENT_ROLES[component][0])
                  digest = baseline["roles"][role]["repo_digest"].removeprefix(repository + "@")
              if component == "EROS" and component not in scope_components:
                  effective[output_name] = digest
                  continue
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit("effective runtime component digest is invalid")
              effective[output_name] = digest
          expected = expected_runtime_inventory_b64(
              scope["scope"], baseline, candidate, os.environ["IMAGE_VERSION"],
              effective["app_digest"], effective["agata_digest"], effective["miniapp_digest"],
              eros_digest=effective["eros_digest"],
          )
          print("scope=" + str(scope["scope"]))
          print("reason=" + str(scope["reason"]))
          print("deploy_core=" + str(scope["deploy_core"]).lower())
          print("deploy_agata=" + str(scope["deploy_agata"]).lower())
          print("deploy_miniapp=" + str(scope["deploy_miniapp"]).lower())
          print("deploy_eros=" + str(scope["deploy_eros"]).lower())
          print("eros_bootstrap=" + str(scope["eros_bootstrap"]).lower())
          print("expected_role_identities_b64=" + expected)
          print("migration_app_digest=" + (os.environ["APP_DIGEST"] if "CORE" in builds else effective["app_digest"]))
          core_api = json.loads(base64.b64decode(expected))["roles"]["gpoint-core-api"]
          print("core_api_version=" + core_api["version"])
          print("core_api_source_sha=" + core_api["sourceSha"])
          for output, digest in effective.items():
              print(output + "=" + digest)
          print("build_components=" + json.dumps(sorted(builds), separators=(",", ":")))
          PY
      - name: Verify immutable candidate images selected for the live scope
        if: steps.component_plan.outputs.build_components != '[]'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          MINIAPP_DIGEST: ${{ needs.build.outputs.miniapp_digest }}
          EROS_DIGEST: ${{ needs.build.outputs.eros_digest }}
          BUILD_COMPONENTS: ${{ steps.component_plan.outputs.build_components }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for item in $(python3 -c 'import json,sys; names={"CORE":"app","AGATA":"agata","MINIAPP":"miniapp","EROS":"eros"}; print(" ".join(names[x] for x in json.loads(sys.argv[1])))' "$BUILD_COMPONENTS"); do
            case "$item" in
              app) repository=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) repository=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
              miniapp) repository=ghcr.io/akhripunov/gpoint-miniapp; digest="$MINIAPP_DIGEST" ;;
              eros) repository=ghcr.io/akhripunov/gpoint-eros; digest="$EROS_DIGEST" ;;
            esac
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull --platform linux/amd64 "$repository@$digest"
            docker pull --platform linux/amd64 "$repository:$IMAGE_VERSION"
            test "$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .RepoDigests 0}}')" = "$repository@$digest"
            if [[ "$item" == eros ]]; then
              test "$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .Config.Labels "com.gpoint.source.revision"}}')" = "$CANDIDATE_SHA"
              test "$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = d1a140083321687212fb7b17c09cc0c3c9639f5e
            else
              test "$(docker image inspect "$repository:$IMAGE_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$CANDIDATE_SHA"
            fi
          done
      - name: Verify candidate compatibility with the live database baseline
        id: migration_baseline
        env:
          GH_TOKEN: ${{ github.token }}
          APP_IMAGE: ghcr.io/akhripunov/gpoint-runtime@${{ steps.component_plan.outputs.app_digest }}
          AGATA_IMAGE: ghcr.io/akhripunov/gpoint-agata-runtime@${{ steps.component_plan.outputs.agata_digest }}
          BASELINE_SOURCE_SHA: ${{ steps.topology.outputs.GPOINT_BASELINE_ROLE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          facts="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" bash -s -- "$APP_IMAGE" "$AGATA_IMAGE" <<'REMOTE'
          set -euo pipefail
          app_image="$1"; agata_image="$2"
          api_image="$(docker inspect --format '{{.Config.Image}}' "$(docker ps -q --filter 'name=^/gpoint-core-api-' | head -1)")"
          test -n "$api_image"
          current="$(docker run --rm --network shared_internal --env-file /opt/gpoint/env/production.env --workdir /app/apps/api "$api_image" node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{try{const failed=await db.$queryRawUnsafe("SELECT count(*)::int AS count FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL");if(failed[0].count!==0)throw Error("unfinished Prisma migration exists");const rows=await db.$queryRawUnsafe("SELECT migration_name,checksum FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name");const head=rows.length?rows[rows.length-1].migration_name:"NONE";const a=await db.$queryRawUnsafe("SELECT version_num FROM agata.alembic_version");if(a.length!==1)throw Error("AGATA head is not singular");console.log("PRISMA_HEAD="+head);console.log("PRISMA_MIGRATIONS="+rows.map(x=>x.migration_name).join(","));console.log("PRISMA_CHECKSUMS="+rows.map(x=>x.migration_name+"="+x.checksum).join(","));console.log("AGATA_HEAD="+a[0].version_num)}catch(e){console.error("READ_ONLY_DATABASE_BASELINE_FAILED="+e.name);process.exitCode=1}finally{await db.$disconnect()}})()')"
          printf '%s\n' "$current"
          REMOTE
          )"
          prisma_head="$(sed -n 's/^PRISMA_HEAD=//p' <<< "$facts")"
          prisma_migrations="$(sed -n 's/^PRISMA_MIGRATIONS=//p' <<< "$facts")"
          prisma_checksums="$(sed -n 's/^PRISMA_CHECKSUMS=//p' <<< "$facts")"
          agata_head="$(sed -n 's/^AGATA_HEAD=//p' <<< "$facts")"
          test -n "$prisma_head" && test -n "$prisma_migrations" && test -n "$agata_head"
          test -n "$prisma_checksums"
          [[ "$BASELINE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$agata_head" =~ ^[A-Za-z0-9_]+$ ]]
          agata_checksums=""
          if [[ "$agata_head" == agata0012 ]] && ! git cat-file -e "$BASELINE_SOURCE_SHA:services/agata/migrations/versions/0012_eros_memory_disclosure.py" 2>/dev/null; then
            mapfile -t receipt_sources < <(git rev-list --first-parent --max-count=64 "$CANDIDATE_SHA")
            receipt_proof="$(ssh -T "root@${GPOINT_PRODUCTION_HOST}" python3 - --read-agata-ancestor-receipt \
              "$agata_head" "${receipt_sources[@]}" \
              < "$GITHUB_WORKSPACE/scripts/verify-kamal-migration-parity.py")"
            [[ "$receipt_proof" =~ ^([0-9a-f]{40}):(agata0012=([0-9a-f]{64}))$ ]]
            receipt_source="${BASH_REMATCH[1]}"; agata_checksums="${BASH_REMATCH[2]}"; receipt_checksum="${BASH_REMATCH[3]}"
            git merge-base --is-ancestor "$receipt_source" "$CANDIDATE_SHA"
            migration_path=services/agata/migrations/versions/0012_eros_memory_disclosure.py
            test "$(git show "$receipt_source:$migration_path" | sha256sum | cut -d' ' -f1)" = "$receipt_checksum"
            test "$(sha256sum "$migration_path" | cut -d' ' -f1)" = "$receipt_checksum"
          fi
          python3 scripts/verify-kamal-migration-parity.py \
            --policy compatible \
            --require-no-agata-pending \
            --repo-root "$GITHUB_WORKSPACE" \
            --baseline-source-sha "$BASELINE_SOURCE_SHA" \
            --candidate-source-sha "$CANDIDATE_SHA" \
            --prisma-directory packages/db/prisma/migrations \
            --prisma-current-migrations "$prisma_migrations" \
            --prisma-current-checksums "$prisma_checksums" \
            --prisma-current-head "$prisma_head" \
            --agata-directory services/agata/migrations/versions \
            --agata-current-head "$agata_head" \
            --agata-current-checksums "$agata_checksums"
          {
            echo "prisma_head=$prisma_head"
            echo "prisma_migrations=$prisma_migrations"
            echo "prisma_checksums=$prisma_checksums"
            echo "agata_head=$agata_head"
          } >> "$GITHUB_OUTPUT"
      - name: Plan the exact approved Prisma migration set
        id: migration_plan
        env:
          LIVE_MIGRATIONS: ${{ steps.migration_baseline.outputs.prisma_migrations }}
          LIVE_CHECKSUMS: ${{ steps.migration_baseline.outputs.prisma_checksums }}
          LIVE_COMPONENT_SCOPE: ${{ steps.component_plan.outputs.scope }}
          BUILD_BASELINE_MODE: ${{ needs.build.outputs.baseline_mode }}
        run: |
          set -euo pipefail
          plan="$(python3 scripts/prisma_migration_release_plan.py \
            --migrations-dir packages/db/prisma/migrations \
            --applied-migrations "$LIVE_MIGRATIONS" \
            --applied-checksums "$LIVE_CHECKSUMS" \
            --allowlist packages/db/prisma/production-approved-migrations.json)"
          grep -qx 'PRISMA_RELEASE_PLAN=PASS' <<< "$plan"
          apply="$(sed -n 's/^apply=//p' <<< "$plan")"
          pending="$(sed -n 's/^pending=//p' <<< "$plan")"
