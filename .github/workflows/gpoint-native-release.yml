          PENDING_MIGRATIONS: ${{ steps.migration_plan.outputs.pending_prisma_migrations }}
          PENDING_CHECKSUMS: ${{ steps.migration_plan.outputs.pending_prisma_checksums }}
          BASELINE_PRISMA_HEAD: ${{ steps.migration_baseline.outputs.prisma_head }}
          BASELINE_PRISMA_MIGRATIONS: ${{ steps.migration_baseline.outputs.prisma_migrations }}
          BASELINE_PRISMA_CHECKSUMS: ${{ steps.migration_baseline.outputs.prisma_checksums }}
          BASELINE_AGATA_HEAD: ${{ steps.migration_baseline.outputs.agata_head }}
          PENDING_PRISMA_MIGRATIONS: ${{ steps.migration_plan.outputs.pending_prisma_migrations }}
