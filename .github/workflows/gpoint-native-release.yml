              }
            done <<< "$ids"
          done
          [[ "$baseline_version" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$baseline_source_sha" =~ ^[0-9a-f]{40}$ ]]
          db_id="$(docker inspect --format '{{.Id}}' shared_postgres_1)"
          redis_id="$(docker inspect --format '{{.Id}}' shared_redis_1)"
          db_mounts="$(docker inspect shared_postgres_1 --format '{{json .Mounts}}')"
          redis_mounts="$(docker inspect shared_redis_1 --format '{{json .Mounts}}')"
          db_mounts_sha="$(python3 -c 'import hashlib,json,sys; a=json.loads(sys.argv[1]); rows=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a), key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert rows and all(x["Source"] and x["Destination"] for x in rows); print(hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest())' "$db_mounts")"
          redis_mounts_sha="$(python3 -c 'import hashlib,json,sys; a=json.loads(sys.argv[1]); rows=sorted(({k:m.get(k) for k in ("Type","Name","Source","Destination","RW")} for m in a), key=lambda x:(x["Destination"] or "",x["Source"] or "")); assert rows and all(x["Source"] and x["Destination"] for x in rows); print(hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest())' "$redis_mounts")"
          echo "DB_CONTAINER_ID=$db_id"
          echo "REDIS_CONTAINER_ID=$redis_id"
          echo "GPOINT_BASELINE_ROLE_VERSION=$baseline_version"
          echo "GPOINT_BASELINE_ROLE_SOURCE_SHA=$baseline_source_sha"
          echo "DB_MOUNTS_SHA256=$db_mounts_sha"
          echo "REDIS_MOUNTS_SHA256=$redis_mounts_sha"
          REMOTE
          )"
          grep -Eq '^DB_CONTAINER_ID=[0-9a-f]{64}$' <<< "$facts"
          grep -Eq '^REDIS_CONTAINER_ID=[0-9a-f]{64}$' <<< "$facts"
          grep -Eq '^GPOINT_BASELINE_ROLE_VERSION=[0-9a-f]{40}-[0-9]+-[0-9]+$' <<< "$facts"
          grep -Eq '^GPOINT_BASELINE_ROLE_SOURCE_SHA=[0-9a-f]{40}$' <<< "$facts"
          grep -Eq '^DB_MOUNTS_SHA256=[0-9a-f]{64}$' <<< "$facts"
          grep -Eq '^REDIS_MOUNTS_SHA256=[0-9a-f]{64}$' <<< "$facts"
          printf 'GPOINT_BASELINE_ROLE_INVENTORY=%s\n' "$role_inventory" >> "$GITHUB_OUTPUT"
