name: GPoint Native Release

on:
  push:
    branches:
      - codex/me52-native-first-reconstruction
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      mode:
        description: Select a read-only preflight; production apply is outside this workflow's current authorization
        required: true
        type: choice
        options:
          - preflight

permissions:
  contents: read

concurrency:
  group: gpoint-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workspace:
    name: Workspace, Prisma and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: gpoint
          POSTGRES_USER: gpoint
          POSTGRES_PASSWORD: gpoint_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpoint -d gpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gpoint:gpoint_dev_only@127.0.0.1:5432/gpoint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.3'
      - name: Validate GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/gpoint-native-release.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and apply test migrations
        run: |
          pnpm --filter @gpoint/db exec prisma generate
          pnpm --filter @gpoint/db exec prisma migrate deploy
      - name: Build and typecheck workspace
        run: |
          pnpm -r build
          pnpm -r typecheck
      - name: Run workspace tests
        run: pnpm -r --if-present test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Mini App end-to-end tests
        run: pnpm test:e2e

  python:
    name: Python, PostgreSQL 16 and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agata/pyproject.toml
      - name: Install Python test dependencies
        run: python -m pip install './services/agata[test]' './services/gsales[test]'
      - name: Run isolated PostgreSQL 16 migration and integration suites
        run: python services/gsales/tests/run_postgres.py

  build:
    name: Build and publish immutable images
    needs: [workspace, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      agata_digest: ${{ steps.agata.outputs.digest }}
      gsales_digest: ${{ steps.gsales.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          platforms: linux/amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - name: Build and publish immutable runtime image
        id: app
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}
          file: infra/production/Gpoint.Dockerfile
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          tags: ghcr.io/akhripunov/gpoint-runtime:${{ github.sha }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-runtime
          cache-to: type=gha,scope=gpoint-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable AGATA image
        id: agata
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}:services/agata
          platforms: linux/amd64
          push: true
          tags: ghcr.io/akhripunov/gpoint-agata-runtime:${{ github.sha }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-agata-runtime
          cache-to: type=gha,scope=gpoint-agata-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable GSales image without starting it
        id: gsales
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: https://github.com/akhripunov/gpoint.git#${{ github.sha }}:services/gsales
          platforms: linux/amd64
          push: true
          tags: ghcr.io/akhripunov/gpoint-g-sales-runtime:${{ github.sha }}
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
          cache-from: type=gha,scope=gpoint-g-sales-runtime
          cache-to: type=gha,scope=gpoint-g-sales-runtime,mode=max
          sbom: true
          provenance: mode=max
      - name: Validate immutable image identity and expose digests
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          GSALES_DIGEST: ${{ steps.gsales.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['CANDIDATE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate SHA is not exact')
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'GSALES_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable OCI digest')
          PY
      - name: Read back exact published images and verify candidate identity
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          AGATA_DIGEST: ${{ steps.agata.outputs.digest }}
          GSALES_DIGEST: ${{ steps.gsales.outputs.digest }}
        run: |
          set -euo pipefail
          for role in app agata gsales; do
            case "$role" in
              app) image=ghcr.io/akhripunov/gpoint-runtime; digest="$APP_DIGEST" ;;
              agata) image=ghcr.io/akhripunov/gpoint-agata-runtime; digest="$AGATA_DIGEST" ;;
              gsales) image=ghcr.io/akhripunov/gpoint-g-sales-runtime; digest="$GSALES_DIGEST" ;;
            esac
            docker pull --platform linux/amd64 "$image@$digest"
            docker image inspect --format '{{json .}}' "$image@$digest" > "$RUNNER_TEMP/$role-image.json"
            docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-sbom.json"
            docker buildx imagetools inspect --format '{{json .Provenance}}' \
              "$image@$digest" > "$RUNNER_TEMP/$role-provenance.json"
            python3 - "$RUNNER_TEMP/$role-image.json" "$image" "$digest" "$CANDIDATE_SHA" <<'PY'
          import json, sys
          path, image, digest, sha = sys.argv[1:]
          item = json.load(open(path, encoding='utf-8'))[0]
          expected = image + '@' + digest
          labels = item.get('Config', {}).get('Labels') or {}
          if expected not in item.get('RepoDigests', []):
              raise SystemExit('pulled image does not resolve to the published digest')
          if (item.get('Os') != 'linux' or item.get('Architecture') != 'amd64'
                  or labels.get('org.opencontainers.image.revision') != sha
                  or labels.get('org.opencontainers.image.source') != 'https://github.com/akhripunov/gpoint'):
              raise SystemExit('published image platform/source identity mismatch')
          print('IMAGE_READBACK=PASS ' + image + '@' + digest)
          PY
            python3 - "$RUNNER_TEMP/$role-sbom.json" "$RUNNER_TEMP/$role-provenance.json" "$CANDIDATE_SHA" <<'PY'
          import json, sys
          sbom = json.load(open(sys.argv[1], encoding='utf-8'))
          provenance = json.load(open(sys.argv[2], encoding='utf-8'))
          sha = sys.argv[3]
          if not isinstance(sbom, dict) or not sbom.get('packages'):
              raise SystemExit('published image SBOM is missing or empty')
          slsa = provenance.get('SLSA') if isinstance(provenance, dict) else None
          vcs = ((slsa or {}).get('metadata') or {}).get(
              'https://mobyproject.org/buildkit@v1#metadata', {}).get('vcs') or {}
          if not slsa or vcs.get('revision') != sha:
              raise SystemExit('published provenance does not bind the exact candidate SHA')
          if not any(host in vcs.get('source', '') for host in (
                  'github.com/akhripunov/gpoint', 'github.com:akhripunov/gpoint')):
              raise SystemExit('published image provenance is missing')
          print('IMAGE_ATTESTATIONS=PASS exact-source-revision=' + sha)
          PY
          done

  deploy:
    name: Production preflight (apply not enabled in this candidate)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Reject a candidate that differs from the requested exact SHA
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
          printf '%s\n' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Verify immutable image outputs for the requested candidate
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          AGATA_DIGEST: ${{ needs.build.outputs.agata_digest }}
          GSALES_DIGEST: ${{ needs.build.outputs.gsales_digest }}
        run: |
          python3 - <<'PY'
          import os, re
          for name in ('APP_DIGEST', 'AGATA_DIGEST', 'GSALES_DIGEST'):
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ[name]):
                  raise SystemExit(f'{name} is not an immutable digest')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              for name in ('APP_DIGEST', 'AGATA_DIGEST', 'GSALES_DIGEST'):
                  summary.write(f"- {name}: `{os.environ[name]}`\n")
          PY
      - name: State that this workflow is preflight-only
        run: |
          test "${{ inputs.mode }}" = preflight
          echo 'PRODUCTION_APPLY=NOT_AUTHORIZED' >> "$GITHUB_STEP_SUMMARY"
