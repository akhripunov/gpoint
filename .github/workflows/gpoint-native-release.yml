      - name: Deploy exact immutable images with stock Kamal 2 to Layer7 staging
        env:
          IMAGE_VERSION: ${{ steps.prepared.outputs.image_version }}
          CORE_DIGEST: ${{ inputs.prepared_app_digest }}
          MINIAPP_DIGEST: ${{ inputs.prepared_miniapp_digest }}
