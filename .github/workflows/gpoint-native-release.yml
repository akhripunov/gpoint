  layer7_staging:
    name: Protected Layer7 staging Kamal deploy and verify
    needs: [tests]
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.tests.result == 'success' && needs.tests.outputs.mode == 'LAYER7_STAGING' &&
      inputs.deploy_layer7_staging == true && inputs.approve_layer7_staging == true &&
      inputs.use_prepared_images == true && inputs.staging_image_sha != ''
    runs-on: [self-hosted, macOS]
    environment:
      name: layer7-staging
    concurrency:
      group: gpoint-layer7-staging
      cancel-in-progress: false
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
      actions: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ inputs.staging_image_sha }}
      GPOINT_COMMIT_SHA: ${{ inputs.staging_image_sha }}
      GPOINT_APP_SOURCE_SHA: ${{ inputs.staging_image_sha }}
      GPOINT_LAYER7_STAGING_HOST: 95.133.236.59
      GPOINT_KAMAL_TARGET_HOST: 95.133.236.59
      GPOINT_SSH_KEY: /root/.ssh/gpoint_layer7
      GPOINT_KNOWN_HOSTS_FILE: /root/.ssh/known_hosts
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      STAGING_ENV_BUNDLE: ${{ secrets.GPOINT_LAYER7_STAGING_APP_ENV }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
