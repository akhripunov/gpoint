name: GPoint Eros Pilot Tunnel Postcheck

on:
  workflow_run:
    workflows:
      - GPoint Native Release
    types:
      - completed
    branches:
      - main
      - codex/**

permissions:
  actions: read
  contents: read

jobs:
  detect-successful-pilot-apply:
    name: Detect successful protected Pilot Apply
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.actor.login == github.repository_owner
    outputs:
      apply_succeeded: ${{ steps.detect.outputs.apply_succeeded }}
    steps:
      - name: Find exact Native Pilot Apply job result
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_ACTOR: ${{ github.event.workflow_run.actor.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo 'apply_succeeded=false' >> "$GITHUB_OUTPUT"
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_BRANCH" = main
          test "$EVENT_ACTOR" = "$REPOSITORY_OWNER"
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - <<'PY'
          import json, os, urllib.request
          url=f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/jobs?per_page=100"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=20) as response:
              payload=json.load(response)
          matches=[job for job in payload.get('jobs',[]) if job.get('name')=='Protected Native Kamal synthetic Eros Pilot Apply']
          if len(matches)==1 and matches[0].get('conclusion')=='success':
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
                  output.write('apply_succeeded=true\n')
              print('EROS_PILOT_APPLY_JOB=PASS')
          else:
              print('EROS_PILOT_APPLY_JOB=NOT_SUCCESSFUL')
          PY

  verify-tunnel-after-workflow-completion:
    name: Verify persistent Mac Ollama tunnel after workflow completion
    needs: [detect-successful-pilot-apply]
    if: needs.detect-successful-pilot-apply.outputs.apply_succeeded == 'true'
    runs-on: [self-hosted, macOS, gpoint-production]
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify launchd and exact Qwen3 tags over the persistent loopback tunnel
        env:
          EROS_PILOT_EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash "$HOME/Library/Application Support/GPoint/Eros Pilot/eros-pilot-mac-tunnel-service.sh" verify
