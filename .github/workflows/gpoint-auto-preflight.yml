name: GPoint — Automatic release controller
run-name: Auto release GPoint ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["GPoint — Prepare"]
    types: [completed]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: gpoint-auto-release-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  dispatch-release:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.path == '.github/workflows/gpoint-prepare.yml'
    runs-on: [self-hosted, macOS, gpoint-production]
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
      packages: read
    steps:
      - name: Checkout trusted current main controller code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          # Authorization scope proof walks ancestry from the production baseline and source commits.
          fetch-depth: 0
      - name: Verify assigned runner before controller/API work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release-runner-readiness.mjs
      - name: Atomically dispatch authorized Deploy or leave exact-SHA approval path
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: node scripts/release-orchestrator.mjs
