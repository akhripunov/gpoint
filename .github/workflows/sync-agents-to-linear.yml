name: Sync AGENTS.md to Linear

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpoint-agents-linear-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, gpoint-production]
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/sync_agents_to_linear.py

      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Update existing Linear document and verify read-back
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_DOCUMENT_ID: ab911628-2575-42bf-a159-338cca0d9de8
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_agents_to_linear.py
