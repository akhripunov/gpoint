name: GPoint Mini App Deploy (manual)

on:
  push:
    branches: [dev]
    paths:
      - apps/miniapp/**
      - packages/**
      - config/deploy.miniapp.yml
      - infra/production/Gpoint.Dockerfile
      - infra/production/nginx-miniapp.conf
      - scripts/docker_dependency_manifests.py
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/gpoint-ci.yml
    permissions:
      contents: read

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable Mini App image
        id: image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          file: infra/production/Gpoint.Dockerfile
          target: miniapp-runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          tags: ghcr.io/akhripunov/gpoint-miniapp:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-miniapp
          cache-from: type=gha,scope=gpoint-miniapp
          cache-to: type=gha,scope=gpoint-miniapp,mode=max
          sbom: true
          provenance: mode=max

  verification_build:
    needs: test
    if: >-
      github.ref == 'refs/heads/dev' &&
      github.actor == github.repository_owner &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message || '', '[GPOINT-BUILD-VERIFY]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create dependency-manifest build context
        run: python3 scripts/docker_dependency_manifests.py "$RUNNER_TEMP/dependency-manifests"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verification Mini App image
        id: image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          file: infra/production/Gpoint.Dockerfile
          target: miniapp-runtime
          build-contexts: dependency-manifests=${{ runner.temp }}/dependency-manifests
          platforms: linux/amd64
          push: true
          build-args: GPOINT_BUILD_SHA=${{ github.sha }}
          tags: ghcr.io/akhripunov/gpoint-miniapp:verify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/akhripunov/gpoint
            service=gpoint-miniapp
          cache-from: type=gha,scope=gpoint-miniapp
          cache-to: type=gha,scope=gpoint-miniapp,mode=max
          sbom: true
          provenance: mode=max
      - name: Verify immutable image digest, platform, SBOM, and source provenance
        env:
          IMAGE_REF: ghcr.io/akhripunov/gpoint-miniapp
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$IMAGE_REF@$IMAGE_DIGEST"
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format '{{json .}}' > "$RUNNER_TEMP/image.json"
          docker buildx imagetools inspect "$image" --format '{{json .SBOM.SPDX}}' > "$RUNNER_TEMP/sbom.json"
          docker buildx imagetools inspect "$image" --format '{{json .Provenance}}' > "$RUNNER_TEMP/provenance.json"
          python3 scripts/verify_native_image_readback.py \
            "$RUNNER_TEMP/image.json" "$IMAGE_REF" "$IMAGE_DIGEST" "$CANDIDATE_SHA"
          python3 scripts/verify_native_image_attestation.py \
            "$RUNNER_TEMP/sbom.json" "$RUNNER_TEMP/provenance.json" "$CANDIDATE_SHA" \
            https://github.com/akhripunov/gpoint.git
  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: gpoint-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPOINT_PRODUCTION_HOST: ${{ secrets.GPOINT_KAMAL_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.GPOINT_KAMAL_SSH_PRIVATE_KEY }}
      VERIFIED_KNOWN_HOSTS: ${{ secrets.GPOINT_KAMAL_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pull and verify pinned Kamal CLI image
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$KAMAL_IMAGE"
          docker image inspect "$KAMAL_IMAGE" --format '{{.Os}}/{{.Architecture}} {{json .RepoDigests}}' \
            | grep -F 'linux/amd64' | grep -F 'ghcr.io/basecamp/kamal@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625'
      - name: Verify exact main SHA and SSH host key
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          test -n "$SSH_PRIVATE_KEY" && test -n "$VERIFIED_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$GPOINT_PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          cat > "$HOME/.ssh/config" <<EOF
          Host $GPOINT_PRODUCTION_HOST
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
          echo "GPOINT_SSH_KEY=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "GPOINT_KNOWN_HOSTS_FILE=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Pull and verify exact Mini App image
        id: prepare_image
        env:
          VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/akhripunov/gpoint-miniapp@$IMAGE_DIGEST"
          stage="/run/gpoint-miniapp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$stage" =~ ^/run/gpoint-miniapp-[0-9]+-[0-9]+$ ]]
          ssh -T "root@$GPOINT_PRODUCTION_HOST" install -d -o root -g root -m 0700 "$stage/docker-config"
          printf '%s' "$GHCR_TOKEN" | ssh -T "root@$GPOINT_PRODUCTION_HOST" \
            "DOCKER_CONFIG='$stage/docker-config' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin" >/dev/null
          ssh -T "root@$GPOINT_PRODUCTION_HOST" bash -s -- "$stage" "$image" "$CANDIDATE_SHA" <<'REMOTE'
          set -euo pipefail
          export DOCKER_CONFIG="$1/docker-config"
          image="$2" candidate="$3"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$candidate"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | grep -F "$image" >/dev/null
          REMOTE
          echo "GPOINT_MINIAPP_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "GPOINT_MINIAPP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Deploy Mini App with stock Kamal
        env:
          KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7a3893b47dd328955f86fbf9ba887d08d612b74f96867f077750a53312537625
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GPOINT_COMMIT_SHA: ${{ github.sha }}
          GPOINT_APP_SOURCE_SHA: ${{ github.sha }}
          GPOINT_KAMAL_SERVICE: gpoint-miniapp
          GPOINT_KAMAL_EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --pull=never --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workdir" \
            --volume "$HOME/.ssh:$HOME/.ssh:ro" \
            --workdir /workdir \
            --env GPOINT_COMMIT_SHA --env GPOINT_APP_SOURCE_SHA \
            --env KAMAL_REGISTRY_PASSWORD --env GPOINT_PRODUCTION_HOST \
            --env GPOINT_SSH_KEY --env GPOINT_KNOWN_HOSTS_FILE \
            --env GPOINT_KAMAL_EXPECTED_DIGEST --env GPOINT_KAMAL_SERVICE \
            "$KAMAL_IMAGE" deploy --skip-push --version "$GPOINT_MINIAPP_VERSION" \
            --config-file config/deploy.miniapp.yml
      - name: Verify Mini App role and public root
        run: |
          set -euo pipefail
          ssh -T "root@$GPOINT_PRODUCTION_HOST" bash -s -- gpoint-miniapp-web "$GPOINT_MINIAPP_VERSION" "$CANDIDATE_SHA" < scripts/verify-kamal-role.sh
          test "$(curl --fail --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' https://gpoint.one/)" = 200
      - name: Remove temporary production registry credentials
        if: always() && env.GPOINT_PRODUCTION_HOST != ''
        run: ssh -T "root@$GPOINT_PRODUCTION_HOST" rm -rf -- "/run/gpoint-miniapp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
