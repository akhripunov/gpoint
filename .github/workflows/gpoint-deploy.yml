name: GPoint — Deploy
run-name: GPoint ${{ inputs.mode }} ${{ inputs.candidate }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Exact 40-character SHA from successful GPoint — Prepare'
        required: true
        type: string
      mode:
        description: 'preflight; exact-SHA production; task-scoped-auto; recovery-diagnostics is read-only and records incident drift facts; recovery-finalization verifies the switched runtime, creates an authorized current backup, reconciles the exact tag, and appends ledger evidence without Apply or migrations'
        required: true
        default: preflight
        type: choice
        options: [preflight, production, task-scoped-auto, recovery-diagnostics, recovery-finalization]
      approve_production:
        description: 'I authorize this exact candidate on GPoint production'
        required: true
        default: false
        type: boolean
      prepare_run_id:
        description: 'Exact Prepare run dispatched by trusted automatic controller; blank only for diagnostics/recovery'
        required: false
        type: string
      prepare_run_attempt:
        description: 'Exact Prepare attempt paired with prepare_run_id'
        required: false
        type: string
      orchestrator_run_id:
        description: 'Automatic release controller run; telemetry only'
        required: false
        type: string
      task_authorization_id:
        description: 'Durable full-cycle TASK_SCOPED_AUTO authorization; optional in preflight and required for task-scoped-auto'
        required: false
        type: string
      image_transport:
        description: 'Use the Prepare transport, or explicitly select its verified archive fallback before deployment starts'
        required: true
        default: prepared
        type: choice
        options: [prepared, ghcr-oci, archive]
      recovery_failure_run_id:
        description: 'Original immutable post-switch failure run; ME-38 only'
        required: false
        default: '39010750184'
        type: string
      recovery_failure_run_attempt:
        description: 'Original immutable post-switch failure attempt; ME-38 only'
        required: false
        default: '1'
        type: string
      recovery_db_risk_accepted:
        description: 'I accept the unresolved historical database outcome for this exact candidate and baseline'
        required: false
        default: false
        type: boolean
      recovery_db_risk_baseline_sha:
        description: 'Exact historical production baseline covered by the separate DB-risk decision'
        required: false
        type: string
      recovery_db_risk_decision_id:
        description: 'Owner decision reference for accepting historical DB uncertainty'
        required: false
        type: string
      create_recovery_backup:
        description: 'Authorize a current protected GPoint backup before recovery metadata writes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: gpoint-production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      candidate: ${{ steps.select.outputs.candidate }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      orchestrator_run_id: ${{ steps.select.outputs.orchestrator_run_id }}
      network_retry_budget_used_seconds: ${{ steps.select.outputs.network_retry_budget_used_seconds }}
      task_authorization_id: ${{ steps.select.outputs.task_authorization_id }}
    steps:
      - name: Initialize shared retry budget
        shell: bash
        run: |
          echo "NETWORK_RETRY_BUDGET_STATE=$RUNNER_TEMP/gpoint-network-retry-budget-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf '0\n' > "$RUNNER_TEMP/gpoint-network-retry-budget-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify operator confirmation, current main and successful preparation
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          RELEASE_MODE: ${{ inputs.mode }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          PREPARE_RUN_ATTEMPT: ${{ inputs.prepare_run_attempt }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          TASK_AUTHORIZATION_ID: ${{ inputs.task_authorization_id }}
          RECOVERY_FAILURE_RUN_ID: ${{ inputs.recovery_failure_run_id }}
          RECOVERY_FAILURE_RUN_ATTEMPT: ${{ inputs.recovery_failure_run_attempt }}
          RECOVERY_DB_RISK_ACCEPTED: ${{ inputs.recovery_db_risk_accepted }}
          RECOVERY_DB_RISK_BASELINE_SHA: ${{ inputs.recovery_db_risk_baseline_sha }}
          RECOVERY_DB_RISK_DECISION_ID: ${{ inputs.recovery_db_risk_decision_id }}
          CREATE_RECOVERY_BACKUP: ${{ inputs.create_recovery_backup }}
        run: python scripts/select-release-run.py

  deploy:
    needs: validate
    if: inputs.mode != 'recovery-diagnostics'
    # Only a repository-scoped runner on the owner's Mac may receive this job.
    runs-on: [self-hosted, macOS, gpoint-production]
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
      packages: read
    outputs:
      preflight: ${{ steps.execute.outputs.preflight }}
      status: ${{ steps.execute.outputs.status }}
      execute_outcome: ${{ steps.execute.outcome }}
      cache_prevented_download: ${{ steps.cache.outputs.cache_prevented_download }}
      bundle_download_seconds: ${{ steps.cache.outputs.bundle_download_seconds }}
    env:
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate }}
      PREPARE_RUN_ID: ${{ needs.validate.outputs.run_id }}
      PREPARE_RUN_ATTEMPT: ${{ needs.validate.outputs.run_attempt }}
      PREPARE_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_MODE: ${{ inputs.mode }}
      APPROVE_PRODUCTION: ${{ inputs.approve_production }}
      TASK_AUTHORIZATION_ID: ${{ needs.validate.outputs.task_authorization_id }}
    steps:
      - name: Set private temporary evidence paths
        shell: bash
        run: |
          echo "GPOINT_RELEASE_EVIDENCE=$RUNNER_TEMP/gpoint-ledger-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "GPOINT_RELEASE_BUNDLE=$RUNNER_TEMP/gpoint-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "RELEASE_RESULT=$RUNNER_TEMP/gpoint-release-result-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
          echo "NETWORK_RETRY_BUDGET_STATE=$RUNNER_TEMP/gpoint-network-retry-budget-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf '%s\n' '${{ needs.validate.outputs.network_retry_budget_used_seconds }}' > "$RUNNER_TEMP/gpoint-network-retry-budget-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@v4
        with:
          # Recovery code must execute from the already integrated main SHA;
          # the production candidate remains pinned to the original incident.
          ref: ${{ inputs.mode == 'recovery-finalization' && github.sha || needs.validate.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify assigned runner before bundle or production checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-runner-readiness.mjs
      - name: Recheck current main and Prepare provenance on the Mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select-release-run.py
      - name: Restore or download the verified immutable artifact
        id: cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          GPOINT_RECOVERY_EXECUTOR_SHA: ${{ github.sha }}
          ARTIFACT_DESTINATION: ${{ env.GPOINT_RELEASE_BUNDLE }}
          IMAGE_TRANSPORT: ${{ inputs.image_transport }}
        run: python3 scripts/prepared_artifact_cache.py
      - name: Import original immutable post-switch failure evidence
        if: inputs.mode == 'recovery-finalization'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate }}
          RECOVERY_FAILURE_RUN_ID: ${{ inputs.recovery_failure_run_id }}
          RECOVERY_FAILURE_RUN_ATTEMPT: ${{ inputs.recovery_failure_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gpoint-recovery-failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 scripts/release_assets.py read-recovery-failure "$CANDIDATE_SHA" "$RECOVERY_FAILURE_RUN_ID" "$RECOVERY_FAILURE_RUN_ATTEMPT" "$evidence"
          chmod 600 "$evidence"
          echo "GPOINT_RECOVERY_FAILURE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - name: Verify receipt, canonical preflight, apply and persist evidence
        id: execute
        env:
          CACHE_PREVENTED_DOWNLOAD: ${{ steps.cache.outputs.cache_prevented_download }}
          BUNDLE_DOWNLOAD_SECONDS: ${{ steps.cache.outputs.bundle_download_seconds }}
          IMAGE_TRANSPORT: ${{ inputs.image_transport }}
          TASK_AUTHORIZATION_ID: ${{ needs.validate.outputs.task_authorization_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_READ_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ github.token }}
          GPOINT_RECOVERY_FAILURE_RUN_ID: ${{ inputs.recovery_failure_run_id }}
          GPOINT_RECOVERY_FAILURE_RUN_ATTEMPT: ${{ inputs.recovery_failure_run_attempt }}
          GPOINT_RECOVERY_DB_RISK_ACCEPTED: ${{ inputs.recovery_db_risk_accepted }}
          GPOINT_RECOVERY_DB_RISK_BASELINE_SHA: ${{ inputs.recovery_db_risk_baseline_sha }}
          GPOINT_RECOVERY_DB_RISK_DECISION_ID: ${{ inputs.recovery_db_risk_decision_id }}
          GPOINT_RECOVERY_DB_RISK_CANDIDATE_SHA: ${{ inputs.candidate }}
          GPOINT_RECOVERY_DB_RISK_ALLOWED_OPERATIONS: create_current_backup,backup_verify,production_tag_reconcile,append_recovery_manifest,ledger_state_write,read_only_verify
          GPOINT_RECOVERY_DB_RISK_FORBIDDEN_OPERATIONS: runtime_apply,database_migration,runtime_switch,rollback
          GPOINT_RECOVERY_CREATE_BACKUP: ${{ inputs.create_recovery_backup }}
          GPOINT_RECOVERY_EXECUTOR_SHA: ${{ github.sha }}
        run: node scripts/automated-release.mjs
      - name: Preserve release result and canonical manifests as immutable evidence
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_assets.py publish evidence

  recovery-diagnostics:
    needs: validate
    if: inputs.mode == 'recovery-diagnostics'
    runs-on: [self-hosted, macOS, gpoint-production]
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      status: ${{ steps.execute.outputs.status }}
      snapshot_sha256: ${{ steps.execute.outputs.snapshot_sha256 }}
      diagnostic_bundle: ${{ steps.package.outputs.recovery_diagnostic_bundle }}
    env:
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate }}
      PREPARE_RUN_ID: ${{ needs.validate.outputs.run_id }}
      PREPARE_RUN_ATTEMPT: ${{ needs.validate.outputs.run_attempt }}
      PREPARE_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
      RELEASE_MODE: recovery-diagnostics
      APPROVE_PRODUCTION: 'false'
      TASK_AUTHORIZATION_ID: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set read-only diagnostic artifact paths
        shell: bash
        run: |
          echo "GPOINT_RELEASE_EVIDENCE=$RUNNER_TEMP/gpoint-recovery-ledger-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "GPOINT_RELEASE_BUNDLE=$RUNNER_TEMP/gpoint-recovery-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "RELEASE_RESULT=$RUNNER_TEMP/gpoint-recovery-result-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
          echo "GPOINT_RECOVERY_SNAPSHOT_PATH=$RUNNER_TEMP/gpoint-recovery-snapshot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify assigned runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-runner-readiness.mjs
      - name: Verify original candidate and Prepare provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_FAILURE_RUN_ID: ${{ inputs.recovery_failure_run_id }}
          RECOVERY_FAILURE_RUN_ATTEMPT: ${{ inputs.recovery_failure_run_attempt }}
        run: python3 scripts/select-release-run.py
      - name: Restore verified immutable Prepare receipt
        id: cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: recovery-diagnostics
          GPOINT_RECOVERY_EXECUTOR_SHA: ${{ github.sha }}
          ARTIFACT_DESTINATION: ${{ env.GPOINT_RELEASE_BUNDLE }}
          IMAGE_TRANSPORT: ${{ inputs.image_transport }}
        run: python3 scripts/prepared_artifact_cache.py
      - name: Import immutable failure evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate }}
          RECOVERY_FAILURE_RUN_ID: ${{ inputs.recovery_failure_run_id }}
          RECOVERY_FAILURE_RUN_ATTEMPT: ${{ inputs.recovery_failure_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gpoint-recovery-failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 scripts/release_assets.py read-recovery-failure "$CANDIDATE_SHA" "$RECOVERY_FAILURE_RUN_ID" "$RECOVERY_FAILURE_RUN_ATTEMPT" "$evidence"
          chmod 600 "$evidence"
          echo "GPOINT_RECOVERY_FAILURE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - name: Collect recovery-only read-only snapshot
        id: execute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_READ_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ github.token }}
          IMAGE_TRANSPORT: ${{ inputs.image_transport }}
          CACHE_PREVENTED_DOWNLOAD: ${{ steps.cache.outputs.cache_prevented_download }}
          BUNDLE_DOWNLOAD_SECONDS: ${{ steps.cache.outputs.bundle_download_seconds }}
          GPOINT_RECOVERY_FAILURE_RUN_ID: ${{ inputs.recovery_failure_run_id }}
          GPOINT_RECOVERY_FAILURE_RUN_ATTEMPT: ${{ inputs.recovery_failure_run_attempt }}
          GPOINT_RECOVERY_EXECUTOR_SHA: ${{ github.sha }}
        run: node scripts/automated-release.mjs
      - name: Package bounded read-only diagnostic evidence for isolated publisher
        id: package
        if: always()
        env:
          GPOINT_RECOVERY_EXECUTOR_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GPOINT_RECOVERY_SNAPSHOT_PATH" && -f "$RELEASE_RESULT" && -f "$GPOINT_RECOVERY_DIAGNOSTIC_MANIFEST" ]]; then
            python3 scripts/release_assets.py package-recovery-diagnostics
          else
            echo 'RECOVERY_DIAGNOSTIC_BUNDLE=NOT_CREATED'
          fi

  publish-recovery-diagnostics:
    needs: [validate, recovery-diagnostics]
    if: always() && needs.validate.result == 'success' && needs.recovery-diagnostics.outputs.diagnostic_bundle != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN contents:write is repository-wide; the script's diagnostic
    # tag allowlist is not a credential boundary. Integration needs an enforced
    # ref protection or a separate narrowly scoped evidence publisher/repository.
    permissions:
      contents: write
    env:
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_DIAGNOSTICS_BUNDLE_B64: ${{ needs.recovery-diagnostics.outputs.diagnostic_bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish verified immutable recovery diagnostic Release
        run: python3 scripts/release_assets.py publish-recovery-diagnostics

  publish:
    permissions:
      contents: read
      actions: read
    needs: [validate, deploy]
    if: always() && github.ref == 'refs/heads/main' && inputs.mode != 'recovery-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpoint-linear-release
      cancel-in-progress: false
    env:
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate || inputs.candidate || github.sha }}
      RELEASE_MODE: ${{ inputs.mode }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Set publication evidence path
        shell: bash
        run: echo "RELEASE_RESULT=$RUNNER_TEMP/release-evidence/gpoint-release-result-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Measure release runner usage
        id: telemetry
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEMETRY_RUN_IDS: ${{ github.run_id }},${{ needs.validate.outputs.run_id }},${{ needs.validate.outputs.orchestrator_run_id }}
          CACHE_PREVENTED_DOWNLOAD: ${{ needs.deploy.outputs.cache_prevented_download || 'NO' }}
        run: |
          python3 scripts/release-telemetry.py
          cat "$GITHUB_OUTPUT" >> "$GITHUB_ENV"
      - name: Mark release telemetry unknown
        if: always() && steps.telemetry.outcome != 'success'
        shell: bash
        run: |
          {
            echo 'GITHUB_HOSTED_JOB_COUNT=UNKNOWN'
            echo 'GITHUB_HOSTED_RUNNER_SECONDS=UNKNOWN'
            echo 'SELF_HOSTED_JOB_COUNT=UNKNOWN'
            echo 'SELF_HOSTED_RUNNER_SECONDS=UNKNOWN'
            echo 'DUPLICATE_HOSTED_WORK_REMOVED=UNKNOWN'
            echo 'CACHE_PREVENTED_DOWNLOAD=UNKNOWN'
          } >> "$GITHUB_ENV"
      - name: Read saved release evidence
        if: needs.deploy.outputs.status != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_assets.py read-result
      - name: Publish preflight result to GPoint Linear
        if: always() && inputs.mode != 'recovery-finalization'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PHASE: preflight
          RELEASE_STATUS: ${{ inputs.mode == 'preflight' && needs.deploy.outputs.preflight == 'PLANNED' && 'READY_FOR_OWNER' || (needs.deploy.outputs.preflight == 'PLANNED' && 'PASS' || needs.deploy.outputs.preflight || 'BLOCKED') }}
        run: python3 scripts/publish-release-linear.py
      - name: Publish production result to GPoint Linear
        if: always() && (inputs.mode == 'production' || inputs.mode == 'task-scoped-auto' || inputs.mode == 'recovery-finalization') && needs.deploy.outputs.status != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PHASE: production
          RELEASE_STATUS: ${{ needs.deploy.outputs.execute_outcome == 'success' && needs.deploy.outputs.status || (needs.deploy.outputs.status == 'COMPLETE' && 'RECOVERY_REQUIRED' || needs.deploy.outputs.status || 'FAILED') }}
        run: python3 scripts/publish-release-linear.py
