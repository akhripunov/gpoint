name: Layer7 immutable deploy and runtime verify
description: Deploy the exact prepared Core image to Layer7 with stock Kamal 2 and verify it.
inputs:
  mode:
    required: false
    default: full
  eros_rehearsal:
    required: false
    default: ""
  github_token:
    required: true
  staging_env_bundle:
    required: false
    default: ""
  candidate_sha:
    required: true
  staging_image_sha:
    required: true
  scoped_image_version:
    required: false
  prepared_app_digest:
    required: true
  prepared_run_id:
    required: false
    default: ""
  prepared_agata_digest:
    required: false
    default: ""
  prepared_miniapp_digest:
    required: false
    default: ""
  prepared_eros_digest:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.mode != 'eros-prepare' && inputs.mode != 'core-config-prepare'
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: 3.3.13
    - name: Install pinned Kamal 2.12.0
      if: inputs.mode != 'eros-prepare' && inputs.mode != 'core-config-prepare'
      shell: bash
      run: |
        set -euo pipefail
        gem_root="$RUNNER_TEMP/kamal-gems"
        mkdir -p "$gem_root"
        GEM_HOME="$gem_root" GEM_PATH="$gem_root" gem install kamal --version 2.12.0 --no-document --install-dir "$gem_root"
        echo "GEM_HOME=$gem_root" >> "$GITHUB_ENV"
        echo "GEM_PATH=$gem_root" >> "$GITHUB_ENV"
        echo "$gem_root/bin" >> "$GITHUB_PATH"
        GEM_HOME="$gem_root" GEM_PATH="$gem_root" ruby -e 'abort unless Gem::Specification.find_by_name("kamal").version.to_s == "2.12.0"'
        GEM_HOME="$gem_root" GEM_PATH="$gem_root" "$gem_root/bin/kamal" help >/dev/null
    - name: Recheck owner dispatch, current main, and prepared image ancestry
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        OWNER_ACTOR: ${{ github.actor }}
        OWNER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
        REQUESTED_SHA: ${{ inputs.candidate_sha }}
        STAGING_IMAGE_SHA: ${{ inputs.staging_image_sha }}
        WORKFLOW_SHA: ${{ github.sha }}
        MODE: ${{ inputs.mode }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_REF" = refs/heads/main
        test "$OWNER_ACTOR" = "$REPOSITORY_OWNER"
        test "$OWNER_TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"
        [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
        [[ "$STAGING_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
        current_main="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
        test "$current_main" = "$WORKFLOW_SHA"
        case "$MODE" in
          eros-prepare|eros-deploy|core-config-prepare) test "$STAGING_IMAGE_SHA" = "$WORKFLOW_SHA"; exit 0 ;;
          full) ;;
          *) exit 1 ;;
        esac
        comparison="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$STAGING_IMAGE_SHA...$WORKFLOW_SHA")"
        python3 -c 'import json,sys; source=sys.argv[1]; value=json.load(sys.stdin); status=value.get("status"); merge_base=value.get("merge_base_commit",{}).get("sha"); sys.exit(0 if status in {"ahead","identical"} and merge_base == source else "prepared image SHA is not an ancestor of current main")' \
          "$STAGING_IMAGE_SHA" <<< "$comparison"
    - name: Detect the narrow Core and active Eros config scope
      id: protected_scope
      if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'core-config-prepare')
      env:
        IMAGE_BASE_SHA: ${{ inputs.staging_image_sha }}
      shell: bash
      run: |
        set -euo pipefail
        baseline="$RUNNER_TEMP/layer7-verified-baseline.json"
        scripts/layer7-transport.sh ssh "root@$GPOINT_LAYER7_STAGING_HOST" python3 - collect \
          < scripts/layer7_release_scope.py > "$baseline"
        api_source="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["roles"]["gpoint-core-api"]["source"])' "$baseline")"
        [[ "$api_source" =~ ^[0-9a-f]{40}$ ]]
        paths="$RUNNER_TEMP/layer7-candidate-paths.txt"
        git diff --name-only "$api_source" "$GITHUB_SHA" -- > "$paths"
        active_config=services/eros-engine/eros-layer7-staging-model-config.toml
        if ! grep -Fxq "$active_config" "$paths"; then
          echo 'narrow=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        grep -Fxq apps/api/src/eros-response-prompt.js "$paths"
        test "$IMAGE_BASE_SHA" = "$GITHUB_SHA"
        test "$(python3 scripts/layer7_release_scope.py plan "$GITHUB_SHA" "$baseline" --previous "$api_source")" = '["CORE"]'
        expected="$(git show "$api_source:$active_config" | sha256sum | cut -d ' ' -f 1)"
        actual="$(scripts/layer7-transport.sh ssh "root@$GPOINT_LAYER7_STAGING_HOST" \
          sha256sum /opt/gpoint/env/eros-layer7-staging-model-config.toml | awk '{print $1}')"
        test "$actual" = "$expected"
        engine_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["roles"]["gpoint-eros-pilot-engine"]["version"])' "$baseline")"
        engine_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["roles"]["gpoint-eros-pilot-engine"]["digest"])' "$baseline")"
        [[ "$engine_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        bot_enabled="$(python3 -c 'import json,sys; print(str("gpoint-core-bot" in json.load(open(sys.argv[1]))["roles"]).lower())' "$baseline")"
        printf 'narrow=true\nengine_version=%s\nengine_digest=%s\nprevious_config_sha=%s\nbot_enabled=%s\n' \
          "$engine_version" "$engine_digest" "$actual" "$bot_enabled" >> "$GITHUB_OUTPUT"
    - name: Verify exact successful Build run and immutable component digests
      if: github.event_name == 'workflow_dispatch'
      id: prepared
      env:
        GH_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.mode }}
        PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
        PREPARED_APP_DIGEST: ${{ inputs.prepared_app_digest }}
        PREPARED_AGATA_DIGEST: ${{ inputs.prepared_agata_digest }}
        PREPARED_MINIAPP_DIGEST: ${{ inputs.prepared_miniapp_digest }}
        PREPARED_EROS_DIGEST: ${{ inputs.prepared_eros_digest }}
        NARROW_SCOPE: ${{ steps.protected_scope.outputs.narrow }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "$PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
        scope_args=()
        if [[ "$MODE" == core-config-prepare ]]; then
          [[ "$NARROW_SCOPE" == true ]]
          [[ "$PREPARED_APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -z "$PREPARED_MINIAPP_DIGEST$PREPARED_EROS_DIGEST$PREPARED_AGATA_DIGEST" ]]
          scope_args=(--layer7-core-config)
        elif [[ "$MODE" == full ]]; then
          [[ "$PREPARED_APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$NARROW_SCOPE" == true ]]; then
            [[ -z "$PREPARED_MINIAPP_DIGEST$PREPARED_EROS_DIGEST$PREPARED_AGATA_DIGEST" ]]
            scope_args=(--layer7-core-config)
          else
            [[ "$PREPARED_MINIAPP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$PREPARED_EROS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
        else
          [[ "$MODE" == eros-prepare || "$MODE" == eros-deploy ]]
          [[ "$PREPARED_EROS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -z "$PREPARED_APP_DIGEST$PREPARED_MINIAPP_DIGEST$PREPARED_AGATA_DIGEST" ]]
          scope_args=(--layer7-eros)
        fi
        digests="$(python3 - <<'PY'
        import json, os
        values = {name: os.environ[var] for name, var in {
            "CORE": "PREPARED_APP_DIGEST", "MINIAPP": "PREPARED_MINIAPP_DIGEST",
            "EROS": "PREPARED_EROS_DIGEST", "AGATA": "PREPARED_AGATA_DIGEST",
        }.items() if os.environ[var]}
        print(json.dumps(values, separators=(",", ":")))
        PY
        )"
        run_json="$RUNNER_TEMP/layer7-staging-run.json"
        jobs_json="$RUNNER_TEMP/layer7-staging-jobs.json"
        commit_json="$RUNNER_TEMP/layer7-staging-commit.json"
        log_headers="$RUNNER_TEMP/layer7-staging-log-headers.txt"
        log_file="$RUNNER_TEMP/layer7-staging-build.log"
        curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_RUN_ID" -o "$run_json"
        curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_RUN_ID/jobs?per_page=100" -o "$jobs_json"
        curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA" -o "$commit_json"
        build_job_id="$(python3 - "$jobs_json" <<'PY'
        import json,sys
        jobs=json.load(open(sys.argv[1],encoding="utf-8")).get("jobs")
        found=[row["id"] for row in jobs or [] if row.get("name")=="Build and publish immutable images"]
        if len(found)!=1: raise SystemExit("prepared Build job identity is ambiguous")
        print(found[0])
        PY
        )"
        status="$(curl --silent --show-error -D "$log_headers" -o "$log_file" -w '%{http_code}' \
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$build_job_id/logs")"
        if [[ "$status" == 302 ]]; then
          log_url="$(python3 - "$log_headers" <<'PY'
        import sys
        from urllib.parse import urlsplit
        headers=open(sys.argv[1],encoding="latin-1").read().splitlines()
        locations=[line.split(":",1)[1].strip() for line in headers if line.lower().startswith("location:")]
        if len(locations)!=1: raise SystemExit("GitHub Build log redirect is missing or ambiguous")
        parts=urlsplit(locations[0])
        if parts.scheme!="https" or not parts.hostname or parts.username or parts.password:
            raise SystemExit("GitHub Build log redirect is not a safe HTTPS URL")
        print(locations[0])
        PY
          )"
          curl --fail --silent --show-error --proto '=https' "$log_url" -o "$log_file"
        elif [[ "$status" != 200 ]]; then
          echo "Unexpected GitHub job log HTTP status: $status" >&2
          exit 1
        fi
        python3 scripts/verify_native_prepared_run.py \
          --run "$run_json" --jobs "$jobs_json" --commit "$commit_json" --logs "$log_file" \
          --candidate-sha "$CANDIDATE_SHA" --run-id "$PREPARED_RUN_ID" --digests "$digests" \
          --output "$GITHUB_OUTPUT" "${scope_args[@]}"
        rm -f "$run_json" "$jobs_json" "$commit_json" "$log_headers" "$log_file"
        if [[ "$MODE" == core-config-prepare ]]; then
          echo "LAYER7_CORE_CONFIG_READINESS=PASS SHA=$CANDIDATE_SHA CORE_DIGEST=$PREPARED_APP_DIGEST CONFIG_SHA=$(sha256sum services/eros-engine/eros-layer7-staging-model-config.toml | awk '{print $1}') VPS_MUTATION=NONE APPLY=NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Verify pinned Layer7 host key and existing SSH access
      shell: bash
      run: |
        set -euo pipefail
        key="$GPOINT_SSH_KEY"
        test "$key" = "$RUNNER_TEMP/layer7/key"
        test -f "$key" && test ! -L "$key"
        test "$(stat -c '%a' "$key")" = 600
        test "$(ssh-keygen -lf infra/staging/layer7_known_hosts | awk '{print $2}')" = \
          SHA256:kFA7rNcjar68J6lmq25teS0uV6DVCmTx+t7I0xTof/U
        ssh-keygen -F "$GPOINT_LAYER7_STAGING_HOST" -f infra/staging/layer7_known_hosts >/dev/null
        # The single-quoted check expands on the remote host, not locally.
        # shellcheck disable=SC2016
        LAYER7_SSH_KEY="$key" "$GITHUB_WORKSPACE/scripts/layer7-transport.sh" ssh \
          "root@$GPOINT_LAYER7_STAGING_HOST" 'test "$(id -u)" = 0'
    - name: Rehearse or release only the Eros engine on Layer7
      if: inputs.mode == 'eros-prepare' || inputs.mode == 'eros-deploy'
      env:
        MODE: ${{ inputs.mode }}
        PREVIOUS_REHEARSAL: ${{ inputs.eros_rehearsal }}
        EROS_DIGEST: ${{ inputs.prepared_eros_digest }}
        IMAGE_VERSION: ${{ steps.prepared.outputs.image_version }}
        GH_TOKEN: ${{ inputs.github_token }}
      shell: bash
      run: |
        set -euo pipefail
        target="root@$GPOINT_LAYER7_STAGING_HOST"
        repository=ghcr.io/akhripunov/gpoint-eros
        image="$repository@$EROS_DIGEST"
        run_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        upstream="$(cat services/eros-engine/upstream.sha)"
        [[ "$upstream" =~ ^[0-9a-f]{40}$ && "$IMAGE_VERSION" == "$CANDIDATE_SHA-"* ]]
        transport=scripts/layer7-transport.sh
        baseline="$RUNNER_TEMP/layer7-eros-before.json"
        after="$RUNNER_TEMP/layer7-eros-after.json"
        collect() { "$transport" ssh "$target" python3 - collect < scripts/layer7_release_scope.py; }
        database() {
          "$transport" ssh "$target" python3 - --mode "$1" --candidate "$CANDIDATE_SHA" \
            --image "$image" --run-id "$2" < scripts/eros-native-database.py
        }
        collect > "$baseline"
        registry_config="/run/gpoint-ghcr-$run_id"
        trap '"$transport" ssh "$target" rm -rf -- "$registry_config"' EXIT
        "$transport" ssh "$target" install -d -m 0700 "$registry_config"
        printf '%s' "$GH_TOKEN" | "$transport" ssh "$target" \
          env "DOCKER_CONFIG=$registry_config" docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
        "$transport" ssh "$target" env "DOCKER_CONFIG=$registry_config" \
          docker pull --platform linux/amd64 "$repository:$IMAGE_VERSION" >/dev/null
        "$transport" ssh "$target" bash -s -- "$repository:$IMAGE_VERSION" "$image" "$CANDIDATE_SHA" "$upstream" <<'REMOTE'
        set -euo pipefail
        image_id="$(docker image inspect --format '{{.Id}}' "$1")"
        test "$image_id" = "$(docker image inspect --format '{{.Id}}' "$2")"
        test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$1")" = linux/amd64
        test "$(docker image inspect --format '{{index .Config.Labels "com.gpoint.source.revision"}}' "$1")" = "$3"
        test "$(docker image inspect --format '{{index .Config.Labels "com.gpoint.eros.upstream-revision"}}' "$1")" = "$4"
        test "$(docker image inspect --format '{{index .Config.Labels "com.gpoint.eros.patch-set.sha256"}}' "$1")" = none
        REMOTE
        if [[ "$MODE" == eros-prepare ]]; then
          test -z "$PREVIOUS_REHEARSAL"
          database prepare "$run_id"
          database verify-prepared "$run_id"
          collect > "$after"
          cmp "$baseline" "$after"
          echo "LAYER7_EROS_REHEARSAL=PASS SHA=$CANDIDATE_SHA DIGEST=$EROS_DIGEST RUN=$run_id" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        [[ "$PREVIOUS_REHEARSAL" =~ ^[0-9]+-[0-9]+$ ]]
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/${PREVIOUS_REHEARSAL%-*}/attempts/${PREVIOUS_REHEARSAL##*-}" |
          jq -e --arg sha "$CANDIDATE_SHA" '
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
            .path == ".github/workflows/gpoint-layer7-staging.yml" and .conclusion == "success" and
            .display_title == ("Layer7 eros-prepare " + $sha)' >/dev/null
        prepared="$(database verify-prepared "$PREVIOUS_REHEARSAL")"
        pending="$(sed -n 's/^EROS_SQLX_PENDING=//p' <<< "$prepared")"
        [[ "$pending" =~ ^[0-9]+$ ]]
        test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
        export GPOINT_KAMAL_SERVICE=gpoint-eros-pilot KAMAL_ROLES=engine
        export GPOINT_KAMAL_EXPECTED_DIGEST="$EROS_DIGEST"
        config=config/deploy.layer7-staging.eros.yml
        model=services/eros-engine/eros-layer7-staging-model-config.toml
        model_sha="$(sha256sum "$model" | cut -d ' ' -f 1)"
        model_target=/opt/gpoint/env/eros-layer7-staging-model-config.toml
        "$transport" ssh "$target" test -f "$model_target"
        "$transport" ssh "$target" test ! -L "$model_target"
        # Before any possible downtime, check that the role can be reached by stock Kamal.
        kamal app version --roles engine --config-file "$config"
        if (( pending > 0 )); then
          "$transport" ssh "$target" bash -s <<'REMOTE'
        set -euo pipefail
        queue_count="$(docker exec shared_postgres_1 sh -ec \
          'exec psql -XqAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d gpoint_staging -c "$1"' sh \
          "SELECT count(*) FROM engine.eros_inference_jobs WHERE status IN ('PENDING','RUNNING')")"
        test "$queue_count" = 0 || { echo 'Layer7 Eros inference queue is not drained' >&2; exit 1; }
        REMOTE
          kamal app stop --roles engine --config-file "$config"
          "$transport" ssh "$target" bash -s <<'REMOTE'
        set -euo pipefail
        connections="$(docker exec shared_postgres_1 sh -ec \
          'exec psql -XqAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -c "$1"' sh \
          "SELECT count(*) FROM pg_stat_activity WHERE datname = 'eros' AND backend_type = 'client backend'")"
        test "$connections" = 0 || { echo 'Layer7 Eros database still has clients' >&2; exit 1; }
        REMOTE
          database prepare "$run_id"
          database apply "$run_id"
        else
          run_id="$PREVIOUS_REHEARSAL"
        fi
        staged_model="/run/gpoint-eros-model-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.toml"
        "$transport" scp "$model" "$target:$staged_model"
        "$transport" ssh "$target" bash -s -- "$staged_model" "$model_target" "$model_sha" <<'REMOTE'
        set -euo pipefail
        staged="$1" target="$2" expected_sha="$3"
        temp="$(mktemp /opt/gpoint/env/.eros-model.XXXXXX)"
        trap 'rm -f -- "$temp" "$staged"' EXIT
        test -f "$target" && test ! -L "$target"
        install -o "$(stat -c %u "$target")" -g "$(stat -c %g "$target")" \
          -m "$(stat -c %a "$target")" "$staged" "$temp"
        printf '%s  %s\n' "$expected_sha" "$temp" | sha256sum -c
        mv -T -- "$temp" "$target"
        REMOTE
        kamal redeploy --skip-push --version "$IMAGE_VERSION" --roles engine --config-file "$config"
        database verify-applied "$run_id"
        collect > "$after"
        python3 scripts/layer7_release_scope.py verify --eros "$baseline" "$after" \
          "$CANDIDATE_SHA" "$IMAGE_VERSION" "$EROS_DIGEST"
        api_version="$(jq -er '.roles["gpoint-core-api"].version' "$after")"
        "$transport" ssh "$target" docker exec "gpoint-eros-pilot-engine-$IMAGE_VERSION" \
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/healthz >/dev/null
        "$transport" ssh "$target" docker exec -i "gpoint-core-api-$api_version" node --input-type=module - <<'JS'
        const url = new URL('/healthz', process.env.EROS_SERVICE_URL ?? '');
        if (url.hostname !== 'gpoint-eros' || !(await fetch(url, { signal: AbortSignal.timeout(5000) })).ok)
          throw new Error('Core API cannot reach the Layer7 Eros engine');
        JS
        echo "LAYER7_EROS_RUNTIME_VERIFY=PASS SHA=$CANDIDATE_SHA DIGEST=$EROS_DIGEST UPSTREAM=$upstream" >> "$GITHUB_STEP_SUMMARY"
    - name: Validate staging-only application environment without logging values
      if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && steps.protected_scope.outputs.narrow != 'true'
      id: staging_env
      env:
        STAGING_ENV_BUNDLE: ${{ inputs.staging_env_bundle }}
      shell: bash
      run: |
        set -euo pipefail
        test -n "$STAGING_ENV_BUNDLE" || {
          echo 'Missing protected layer7-staging environment secret GPOINT_LAYER7_STAGING_APP_ENV.' >&2
          exit 1
        }
        printf '%s' "$STAGING_ENV_BUNDLE" | python3 -c '
        import sys
        from pathlib import Path
        sys.path.insert(0, "scripts")
        from layer7_staging_env import parse_staging_env
        _, digest, bot_enabled = parse_staging_env(sys.stdin.read(48_001))
        print("LAYER7_STAGING_ENV_VALID=PASS SHA256=" + digest)
        with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("bot_enabled=" + str(bot_enabled).lower() + "\n")
        '
    - name: Recheck scoped release before changing Layer7
      if: github.event_name == 'push'
      id: scoped
      env:
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        PREVIOUS_SHA: ${{ github.event.before }}
        REQUESTED_SHA: ${{ inputs.candidate_sha }}
        IMAGE_VERSION: ${{ inputs.scoped_image_version }}
        CORE_DIGEST: ${{ inputs.prepared_app_digest }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_ACTOR" = "$OWNER"
        test "$GITHUB_TRIGGERING_ACTOR" = "$OWNER"
        test "$REQUESTED_SHA" = "$GITHUB_SHA"
        test "$CANDIDATE_SHA" = "$GITHUB_SHA"
        test "$IMAGE_VERSION" = "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        [[ "$CORE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
        git log -1 --format=%B | grep -Fx GPOINT-LAYER7-API >/dev/null
        environment="repos/$GITHUB_REPOSITORY/environments/layer7-api-auto"
        gh api "$environment" | python3 -c '
        import json, sys
        env = json.load(sys.stdin)
        policy = env["deployment_branch_policy"]
        rules = [rule["type"] for rule in env["protection_rules"]]
        if policy != {"protected_branches": False, "custom_branch_policies": True} or rules != ["branch_policy"]:
            raise SystemExit("Layer7 auto environment requires branch policy as its only protection rule")
        '
        gh api "$environment/deployment-branch-policies" | python3 -c '
        import json, sys
        result = json.load(sys.stdin)
        if result["total_count"] != 1 or [(p["name"], p["type"]) for p in result["branch_policies"]] != [("main", "branch")]:
            raise SystemExit("Layer7 auto environment must allow only the main branch")
        '
        before="$RUNNER_TEMP/layer7-verified-baseline.json"
        scripts/layer7-transport.sh ssh "root@$GPOINT_LAYER7_STAGING_HOST" python3 - collect \
          < scripts/layer7_release_scope.py > "$before"
        test "$(python3 scripts/layer7_release_scope.py plan "$GITHUB_SHA" "$before" --previous "$PREVIOUS_SHA")" = '["CORE"]'
        bot_enabled="$(python3 -c 'import json,sys; print(str("gpoint-core-bot" in json.load(open(sys.argv[1]))["roles"]).lower())' "$before")"
        printf 'bot_enabled=%s\n' "$bot_enabled" >> "$GITHUB_OUTPUT"
        # The API switch uses Kamal's digest-verifying pre-app-boot hook.
        # Check for pre-existing credentials before Kamal can change them.
        scripts/layer7-transport.sh ssh "root@$GPOINT_LAYER7_STAGING_HOST" python3 - <<'PYTHON'
        import json
        from pathlib import Path
        config = Path("/root/.docker/config.json")
        value = json.loads(config.read_text()) if config.exists() else {}
        if value.get("credsStore") or "ghcr.io" in value.get("credHelpers", {}) or "ghcr.io" in value.get("auths", {}):
            raise SystemExit("Layer7 already has Docker registry credentials")
        PYTHON
        printf 'image_version=%s\n' "$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
    - name: Install staging secrets and provision only the empty GPoint staging database
