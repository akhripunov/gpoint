service: gpoint-core
image: akhripunov/gpoint-runtime
primary_role: api

servers:
  api:
    hosts:
      - <%= ENV.fetch("GPOINT_PRODUCTION_HOST") %>
    cmd: node apps/api/dist/apps/api/src/main.js
    env:
      clear:
        RELEASE_SHA: <%= ENV.fetch("GPOINT_APP_SOURCE_SHA") %>
    options:
      # Loopback-only endpoint for the Mac Product Worker tunnel. Public traffic
      # keeps using kamal-proxy below; this port is never bound to a public
      # interface and still requires the worker bearer token and tenant.
      publish:
        - "127.0.0.1:13003:3000"
      network:
        - shared_internal
        - gpoint_eros_data
      network-alias: gpoint-core-api
      env-file:
        - /opt/gpoint/env/production.env
        - /opt/gpoint/env/eros-api.env
      volume: /opt/gpoint/media:/data/media
    proxy:
      path_prefixes:
        - /api
      strip_path_prefix: true
      app_port: 3000
      healthcheck:
        path: /health/live

proxy:
  hosts:
    - gpoint.one
  ssl: false
  ssl_redirect: false
  run:
    version: v0.9.2

registry:
  server: ghcr.io
  username: akhripunov
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root
  keys:
    - <%= ENV.fetch("GPOINT_SSH_KEY") %>
  keys_only: true
  config: true

builder:
  arch: amd64

retain_containers: 2
minimum_version: 2.12.0
