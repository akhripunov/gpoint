service: gpoint-eros-pilot
image: akhripunov/gpoint-eros
primary_role: engine

servers:
  engine:
    hosts:
      - <%= ENV.fetch("GPOINT_LAYER7_STAGING_HOST") %>
    proxy: false
    options:
      network:
        - gpoint_eros_data
        - gpoint_eros_api
        # The embedding relay only trusts peers on 172.31.254.0/29, so the
        # engine must reach it over that dedicated network, not the gateway.
        - gpoint_eros_embeddings
      network-alias: gpoint-eros
      env-file:
        - /opt/gpoint/env/eros-engine.env
      volume: /opt/gpoint/env/eros-production-model-config.toml:/etc/eros-engine/model_config.toml:ro
      memory: 384m
      memory-swap: 384m
      cpus: 0.50
      pids-limit: 256
      read-only: true
      tmpfs: /tmp
      cap-drop: ALL
      security-opt: no-new-privileges:true

registry:
  server: ghcr.io
  username: akhripunov
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root
  keys:
    - <%= ENV.fetch("GPOINT_SSH_KEY") %>
  keys_only: true
  config: true

builder:
  arch: amd64

retain_containers: 2
minimum_version: 2.12.0
