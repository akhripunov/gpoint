service: gpoint-core
image: akhripunov/gpoint-runtime
primary_role: api

servers:
  api:
    hosts:
      - <%= ENV.fetch("GPOINT_LAYER7_STAGING_HOST") %>
    cmd: node apps/api/dist/apps/api/src/main.js
    env:
      clear:
        RELEASE_SHA: <%= ENV.fetch("GPOINT_APP_SOURCE_SHA") %>
    options:
      network:
        - shared_internal
        - gpoint_eros_api
      network-alias: gpoint-core-api
      env-file:
        - /opt/gpoint/env/staging.env
        - /opt/gpoint/env/layer7-staging-eros-api.env
      volume: /opt/gpoint/layer7-staging/media:/data/media
    proxy: false

registry:
  server: ghcr.io
  username: akhripunov
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root
  keys:
    - <%= ENV.fetch("GPOINT_SSH_KEY") %>
  keys_only: true
  config: true

builder:
  arch: amd64

retain_containers: 2
minimum_version: 2.12.0
