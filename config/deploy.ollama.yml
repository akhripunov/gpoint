service: gpoint-eros-relay
image: akhripunov/gpoint-eros

accessories:
  ollama:
    image: ollama/ollama@sha256:a717bfc1c56acfc2e85d3109bd40a7646258ec9062c40cea83b9ed0927eb4223
    host: <%= ENV.fetch("GPOINT_PRODUCTION_HOST") %>
    port: "127.0.0.1:11435:11434"
    network: gpoint_ollama_internal
    volumes:
      - ollama-layer7-models:/root/.ollama
    options:
      network-alias: ollama
      restart: unless-stopped
      cpus: 1.5
      memory: 3g
      memory-swap: 3g

registry:
  server: ghcr.io
  username: akhripunov
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root
  keys:
    - <%= ENV.fetch("GPOINT_SSH_KEY") %>
  keys_only: true
  config: true

builder:
  arch: amd64

minimum_version: 2.12.0
