version: "3.8"

services:
  api:
    image: gpoint-runtime:${RELEASE_SHA}
    restart: unless-stopped
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    volumes:
      - /opt/gpoint/media:/data/media
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - gpoint_app
      - shared_internal

  worker:
    image: gpoint-runtime:${RELEASE_SHA}
    restart: unless-stopped
    command: ["node", "apps/worker/dist/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    networks:
      - gpoint_app
      - shared_internal

  bot:
    image: gpoint-runtime:${RELEASE_SHA}
    restart: unless-stopped
    command: ["node", "apps/bot/dist/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    networks:
      - gpoint_app

networks:
  gpoint_app:
    external: true
    name: gpoint_app
  shared_internal:
    external: true
    name: shared_internal
