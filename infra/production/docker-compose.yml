version: "3.8"

services:
  api:
    image: gpoint-runtime:${RELEASE_SHA}
    restart: unless-stopped
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    volumes:
      - /opt/gpoint/media:/data/media
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - gpoint_app
      - shared_internal

  worker:
    image: gpoint-runtime:${RELEASE_SHA}
    restart: unless-stopped
    command: ["node", "apps/worker/dist/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    networks:
      - gpoint_app
      - shared_internal

  bot:
    image: gpoint-runtime:${RELEASE_SHA}
    restart: unless-stopped
    command: ["node", "apps/bot/dist/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    networks:
      - gpoint_app

  gpoint-sensitive-detector:
    build:
      context: https://github.com/misskey-dev/sensitive-detector.git#f91d4bc978bea30aee7c1be1c2b6932c5818c7ec
      dockerfile: Dockerfile
      target: runtime
    image: gpoint-sensitive-detector:f91d4bc978bea30aee7c1be1c2b6932c5818c7ec
    restart: unless-stopped
    env_file:
      - /opt/gpoint/env/production.env
    volumes:
      - /opt/gpoint/compose/sensitive-detector/config.mjs:/config/config.mjs:ro
    command: ["node", "dist/main.mjs", "--config", "/config/config.mjs"]
    networks:
      - gpoint_app
    healthcheck:
      test: ["CMD", "node", "/scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gpoint_app:
    external: true
    name: gpoint_app
  shared_internal:
    external: true
    name: shared_internal
