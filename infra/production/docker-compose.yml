version: "3.8"

services:
  api:
    image: gpoint-runtime:${GPOINT_APP_IMAGE_SHA:-${RELEASE_SHA}}
    restart: unless-stopped
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    environment:
      AGATA_SERVICE_URL: http://agata-api:8000
    volumes:
      - /opt/gpoint/media:/data/media
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - gpoint_app
      - shared_internal

  agata-api:
    profiles: [agata]
    image: gpoint-agata-runtime:${GPOINT_AGATA_IMAGE_SHA:-${RELEASE_SHA}}
    build:
      context: /opt/gpoint/releases/${RELEASE_SHA}/source/services/agata
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - /opt/gpoint/env/production.env
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8
    networks:
      - gpoint_app
      - shared_internal

  agata-memory-worker:
    profiles: [agata]
    image: gpoint-agata-runtime:${GPOINT_AGATA_IMAGE_SHA:-${RELEASE_SHA}}
    build:
      context: /opt/gpoint/releases/${RELEASE_SHA}/source/services/agata
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.memory.worker"]
    env_file:
      - /opt/gpoint/env/production.env
    healthcheck:
      test: ["CMD", "python", "-m", "app.memory.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - gpoint_app
      - shared_internal

  worker:
    image: gpoint-runtime:${GPOINT_APP_IMAGE_SHA:-${RELEASE_SHA}}
    restart: unless-stopped
    command: ["node", "apps/worker/dist/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    networks:
      - gpoint_app
      - shared_internal

  bot:
    image: gpoint-runtime:${GPOINT_APP_IMAGE_SHA:-${RELEASE_SHA}}
    restart: unless-stopped
    command: ["node", "apps/bot/dist/main.js"]
    env_file:
      - /opt/gpoint/env/production.env
    networks:
      - gpoint_app

  gpoint-sensitive-detector:
    build:
      context: /opt/gpoint/compose/sensitive-detector
      dockerfile: Dockerfile
      target: runtime
    image: gpoint-sensitive-detector:f91d4bc978bea30aee7c1be1c2b6932c5818c7ec
    restart: unless-stopped
    env_file:
      - /opt/gpoint/env/production.env
    volumes:
      - /opt/gpoint/compose/sensitive-detector/config.mjs:/config/config.mjs:ro
    command: ["node", "dist/main.mjs", "--config", "/config/config.mjs"]
    networks:
      - gpoint_app
    healthcheck:
      test: ["CMD", "node", "/scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gpoint_app:
    external: true
    name: gpoint_app
  shared_internal:
    external: true
    name: shared_internal
