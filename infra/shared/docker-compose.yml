version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../env/postgres.env
    volumes:
      - ../postgres/data:/var/lib/postgresql/data
    networks:
      shared_internal:
        aliases:
          - shared-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ../redis/data:/data
    networks:
      shared_internal:
        aliases:
          - shared-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_internal:
    name: shared_internal
