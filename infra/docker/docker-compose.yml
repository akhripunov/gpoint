services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gpoint
      POSTGRES_PASSWORD: gpoint_dev_only
      POSTGRES_DB: gpoint
    ports: ["5432:5432"]
    volumes: [gpoint_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpoint -d gpoint"]
      interval: 5s
      timeout: 3s
      retries: 12
  agata-api:
    profiles: [agata]
    build:
      context: ../../services/agata
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &agata_environment
      AGATA_DATABASE_URL: postgresql+asyncpg://gpoint:gpoint_dev_only@postgres:5432/gpoint
      AGATA_TENANT_ID: ${AGATA_TENANT_ID:?Set a UUID tenant for local AGATA}
      AGATA_INTERNAL_API_TOKEN: ${AGATA_INTERNAL_API_TOKEN:?Set a local internal API token}
      AGATA_MESSAGE_AEAD_KEY: ${AGATA_MESSAGE_AEAD_KEY:?Set a base64 32-byte key}
      AGATA_REQUEST_FINGERPRINT_HMAC_KEY: ${AGATA_REQUEST_FINGERPRINT_HMAC_KEY:?Set a base64 32-byte key}
      AGATA_RETRIEVAL_QUERY_HMAC_KEY: ${AGATA_RETRIEVAL_QUERY_HMAC_KEY:?Set a base64 32-byte key}
      AGATA_RESPONSE_FINGERPRINT_HMAC_KEY: ${AGATA_RESPONSE_FINGERPRINT_HMAC_KEY:?Set a base64 32-byte key}
      AGATA_SHADOW_CANDIDATE_HMAC_KEY: ${AGATA_SHADOW_CANDIDATE_HMAC_KEY:?Set a base64 32-byte key}
      AGATA_EMBEDDING_API_KEY: ${AGATA_EMBEDDING_API_KEY:?Set an embedding-provider key}
      AGATA_LLM_API_KEY: ${AGATA_LLM_API_KEY:?Set a response-provider key}
    depends_on:
      postgres:
        condition: service_healthy
    expose: [8000]
    ports: ["127.0.0.1:8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
  agata-worker:
    profiles: [agata]
    build:
      context: ../../services/agata
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.memory.worker"]
    environment: *agata_environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.memory.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gpoint_minio
      MINIO_ROOT_PASSWORD: gpoint_minio_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [gpoint_minio:/data]
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.12
    profiles: [media]
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_MAX_SRC_FILE_SIZE: 10485760
      IMGPROXY_ALLOWED_SOURCES: ${IMGPROXY_ALLOWED_SOURCES:-s3://gpoint-minio}
      IMGPROXY_WORKERS: 2
    ports: ["127.0.0.1:8080:8080"]
  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    profiles: [search]
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-gpoint_local_search_key_change_me}
    ports: ["127.0.0.1:7700:7700"]
    volumes: [gpoint_meili:/meili_data]
volumes:
  gpoint_pg:
  gpoint_minio:
  gpoint_meili:
