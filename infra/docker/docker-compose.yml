services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gpoint
      POSTGRES_PASSWORD: gpoint_dev_only
      POSTGRES_DB: gpoint
    ports: ["5432:5432"]
    volumes: [gpoint_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gpoint_minio
      MINIO_ROOT_PASSWORD: gpoint_minio_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [gpoint_minio:/data]
volumes:
  gpoint_pg:
  gpoint_minio:
